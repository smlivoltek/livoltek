// ══ Linhas de armazém do card: Estoque (cinza) + Disponível (colorido) por armazém.
// Disponível por armazém = saldo − reserva − faturado daquele armazém (já vem em _byWH[w].disp).
// Assim dá pra bater o olho e ver ONDE está o disponível (e onde está negativo/estourado).
// ══ FOTOS DOS PRODUTOS ══
// As imagens ficam no repositório, na pasta img/ (a Cristiane sobe direto no GitHub). Padrão: 192×192 px,
// fundo branco, WebP. O dashboard tenta, nesta ordem: foto do código (img/<codigo>.webp), foto da família
// (img/fam-<familia>.webp) e, se não houver nenhuma, mostra um ícone neutro. Nome em minúsculas, sem acento,
// espaços e símbolos viram "-" (ex.: "INVERSOR - GT1-6K" → fam-inversor-gt1-6k.webp). Para desligar: false.
const IMAGENS_ATIVAS = true;
const imgSlug = t => String(t||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]+/g,'-').replace(/-{2,}/g,'-').replace(/^-+|-+$/g,'');
function fotoHtml(codigo, familia){
  if(!IMAGENS_ATIVAS) return '';
  const c=imgSlug(codigo), f=imgSlug(familia);
  const fb=f?`img/fam-${f}.webp`:'';
  return `<div class="pc2-foto"><i class="ti ti-box" aria-hidden="true"></i>${c?`<img src="img/${c}.webp" data-fb="${fb}" alt="" loading="lazy" decoding="async" width="64" height="64" onerror="fotoErro(this)">`:''}</div>`;
}
function fotoErro(img){
  const fb=img.dataset.fb||'';
  if(fb){ img.dataset.fb=''; img.src=fb; }   // tenta a foto da família
  else img.remove();                          // sem foto: fica o ícone neutro
}

function whListHtml(byWH){
  const head=`<div class="pc2-wh-head"><span class="pc2-wh-name"></span><span class="pc2-wh-col">Estoque</span><span class="pc2-wh-col">Disp.</span></div>`;
  const rows=WH_LIST.map(w=>{
    const d=(byWH&&byWH[w])||{saldo:0,reserva:0,fat:0,disp:0};
    const sal=d.saldo||0, disp=d.disp||0;
    const vazio=!sal&&!d.reserva&&!d.fat;
    const col=disp>0?'var(--grn-d)':disp<0?'var(--red)':'var(--amb-d)';
    return `<div class="pc2-wh-row${vazio?' pc2-wh-zero':''}">
      <i class="ti ${WH_ICON[w]||'ti-building-warehouse'}" style="color:${WH_COLOR[w]||'#94a3b8'};font-size:12px"></i>
      <span class="pc2-wh-name">${w}</span>
      <span class="pc2-wh-sal">${fmt(sal)}</span>
      <span class="pc2-wh-disp" style="color:${vazio?'inherit':col}">${fmt(disp)}</span>
    </div>`;
  }).join('');
  return head+rows;
}

// ══ DEDUP ══
function dedup(items){
  const m={};
  items.forEach(r=>{
    if(!m[r.codigo]) m[r.codigo]={...r,_byWH:{},_sal:0,_res:0,_fat:0,_disp:0};
    if(!m[r.codigo]._byWH[r.wh]) m[r.codigo]._byWH[r.wh]={saldo:0,reserva:0,fat:0,disp:0};
    m[r.codigo]._byWH[r.wh].saldo+=r.saldo;
    m[r.codigo]._byWH[r.wh].reserva+=r.reserva;
    m[r.codigo]._byWH[r.wh].fat+=(r.fat||0);
    m[r.codigo]._byWH[r.wh].disp+=r.disp;
    m[r.codigo]._sal+=r.saldo;
    m[r.codigo]._res+=r.reserva;
    m[r.codigo]._fat+=(r.fat||0);
    m[r.codigo]._disp+=r.disp;
  });
  return Object.values(m);
}

// ══ CATEGORY ROUTING ══
// Prioridade: _catTab pré-calculado. Se não houver, deriva da família.
// Produto com família definida NUNCA vai para Diversos.
function getCatTab(r){
  if(r._catTab && r._catTab!=='div') return r._catTab;
  const fam=(r.familia||'').toUpperCase().trim();
  if(!fam) return r._catTab||'div';
  if(fam.includes('INVERSOR')) return 'inv';
  if(fam.includes('CARREGADOR')) return 'ev';
  if(fam.includes('BATERIA')||fam.includes('BESS')) return 'bess';
  if(fam.includes('KIT SOLAR')) return 'kit';
  if(fam.includes('STRING BOX')) return 'strbox';
  if(fam.includes('MOTOR')) return 'mot';
  return r._catTab||'div';
}

// ══ PRODUTO COMERCIAL CONSOLIDADO ══
// Um card por produto comercial, com os três códigos vinculados (TOP nacional, TOP importado, TOTVS importado).
// A ligação vem do cadastro (uma linha por produto: CODIGO = TOTVS/Hexing, CODIGO TOP MANAGER = TOP importado,
// CODIGO TOP MANAGER NACIONAL = TOP nacional) — nunca só da descrição ou da potência. Os códigos originais
// continuam individuais: cada linha de estoque mantém o seu código, armazém, saldo e reserva.

// Potência (kW) a partir da FAMÍLIA, só em padrões que não deixam dúvida: "GT1-6K" → 6, "GT1-2K2" → 2,2,
// "GT3-100K" → 100, "CARREGADOR - 7,3kW" → 7,3. Famílias como "GF1-3K48" (3 kW / 48 V?) NÃO são interpretadas.
function potenciaDeFamilia(fam){
  const f=String(fam||'');
  let m=f.match(/(\d+(?:[.,]\d+)?)\s*kw\b/i);
  if(m) return parseFloat(m[1].replace(',','.'));
  m=f.match(/(?:^|[-\s])(\d+)K(\d)?(?![0-9A-Za-z])/i);
  if(m) return m[2]!==undefined ? parseFloat(m[1]+'.'+m[2]) : parseInt(m[1],10);
  return null;
}
// Modelo = código comercial sem o sufixo de revisão (R + 5 dígitos), só no padrão de inversores
// (GT1-10KT2R11004 → GT1-10KT2). Fora desse padrão fica vazio (ou use a coluna opcional MODELO).
function modeloDeCodigo(c){
  const m=String(c||'').toUpperCase().match(/^((?:GT|BV|GF|HP)\d-\d+K?[0-9A-Z-]*?)R\d{5}[A-Z0-9-]*$/);
  return m?m[1]:'';
}
const fmtPot = n => (Number.isInteger(n)?String(n):String(n).replace('.',','));

function agruparProdutos(rows){
  const m={};
  rows.forEach(r=>{
    const id=r.prodId||r.codigo;
    const p=m[id]||(m[id]={id,rows:[],nome:'',familia:r.familia||'',categoria:r.categoria||'',isMP:!!r.isMP,isSemAfci:false,_sal:0,_res:0,_fat:0,_disp:0});
    p.rows.push(r);
    p._sal+=r.saldo; p._res+=r.reserva; p._fat+=(r.fat||0); p._disp+=r.disp;
    if(r.isSemAfci) p.isSemAfci=true;
    if(!p.nome) p.nome=r.nomenclatura||r.descricao||id;
  });
  return Object.values(m).map(p=>{ const cad=CADASTRO[p.id]; p.isFiname=!!(cad&&cad.nacional)||p.rows.some(r=>r.isFiname); return p; });
}
// Os três códigos do produto: do cadastro + o que as linhas de estoque comprovam (sistema/origem de cada linha).
function slotsCodigos(p){
  const cad=CADASTRO[p.id]||null;
  const nac=new Set(), imp=new Set(), totEv=new Set();
  p.rows.forEach(r=>{ if(r.sistema==='TOP Manager'){ (r.origemTxt==='Nacional'?nac:imp).add(r.codigo); } else totEv.add(r.codigo); });
  const tot=new Set();
  if(cad){
    (cad.topNacional||[]).forEach(c=>nac.add(c));
    (cad.topLocal||[]).forEach(c=>imp.add(c));
    // o CODIGO do cadastro é o TOTVS principal, exceto se for ele mesmo um código TOP (nacional/importado)
    if(!nac.has(cad.codigo) && !imp.has(cad.codigo)) tot.add(cad.codigo);
    (cad.totvsAlt||[]).forEach(c=>tot.add(c));   // demais códigos TOTVS do mesmo produto
  }
  totEv.forEach(c=>tot.add(c));
  return {nac:[...nac],imp:[...imp],tot:[...tot]};
}
// Busca: termos de potência (10, 10kw, 10 kW) comparam com o ATRIBUTO de potência do produto — nunca com
// o texto do código; o resto (nome, modelo, família, qualquer dos três códigos) por trecho, todos os termos.
const _norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function consultaBusca(q){
  let rest=_norm(q).trim(); const termos=[];
  rest=rest.replace(/(\d+(?:[.,]\d+)?)\s*kw?\b/g,(m,n)=>{ termos.push({pot:parseFloat(n.replace(',','.'))}); return ' '; });
  rest.split(/\s+/).filter(Boolean).forEach(w=>{ if(/^\d{1,3}(?:[.,]\d+)?$/.test(w)) termos.push({pot:parseFloat(w.replace(',','.'))}); else termos.push({txt:w}); });
  return termos;
}
function prodBusca(p,termos){
  const cad=CADASTRO[p.id]||{};
  const sl=slotsCodigos(p);
  const codes=[...sl.nac,...sl.imp,...sl.tot].map(_norm);
  const texto=_norm([cad.titulo,cad.descricao,cad.modelo,p.familia].join(' '));
  const pot=(cad.potenciaKW!==undefined&&cad.potenciaKW!==null)?cad.potenciaKW:null;
  return termos.every(t=> t.pot!==undefined ? (pot!==null && Math.abs(pot-t.pot)<1e-9) : (texto.includes(t.txt)||codes.some(c=>c.includes(t.txt))));
}
function copiarCodigo(btn,code){
  const ok=()=>{ const i=btn.querySelector('i'); if(i){ i.className='ti ti-check'; btn.classList.add('ok'); setTimeout(()=>{ i.className='ti ti-copy'; btn.classList.remove('ok'); },1200); } };
  const fallback=()=>{ const t=document.createElement('textarea'); t.value=code; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(t); };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(ok,fallback); return; } }catch(e){}
  fallback();
}

// Título do card: NOMENCLATURA do cadastro; se vazia, o código do produto. A descrição completa fica logo abaixo.
function tituloProd(p){ const c=CADASTRO[p.id]; return (c&&c.titulo)?c.titulo:p.id; }
// A descrição completa SEMPRE aparece abaixo do título, e vem SÓ do cadastro. Se o cadastro não tiver, o card fica sem descrição
// e o produto entra na Auditoria ("Produtos sem descrição no cadastro") pra ser corrigido lá — nada é preenchido de outra fonte.
function descProd(p){ const c=CADASTRO[p.id]; return (c&&c.descricao)||''; }

// Ordem alfabética pelo título exibido (nomenclatura ou, se vazia, o código) — mesma regra em todas as telas de cards.
function ordemProd(a,b){ return String(tituloProd(a)).localeCompare(String(tituloProd(b)),'pt-BR',{sensitivity:'base'})||String(a.id).localeCompare(String(b.id),'pt-BR'); }
// Produto comercial a que um código pertence (código TOTVS/Hexing, TOP importado ou TOP nacional).
function prodIdDeCodigo(c){
  const st=ST.find(x=>x.codigo===c); if(st&&st.prodId) return st.prodId;
  const k=String(c||'').trim().toUpperCase(); const cad=CADASTRO_ALT[k]||CADASTRO[k]||CADASTRO_NACTOP[k]||CADASTRO_TOP[k];
  return cad?cad.codigo:c;
}

function pCardProd(p, isMP, opts){
  const cad=CADASTRO[p.id]||null;
  const disp=p._disp, sal=p._sal, res=p._res, fat=p._fat;
  const dispCol=disp>0?'var(--grn-d)':disp===0?'var(--amb-d)':'var(--red)';
  const famLabel=p.familia||p.categoria||'';
  const famCol=isMP?'var(--red)':'var(--pri)', famBg=isMP?'var(--red-pale)':'var(--pri-pale)';
  const meta=(cad&&cad.modelo)?`Modelo ${cad.modelo}`:''; // a potência não é mostrada no card (continua valendo na busca)
  const sl=slotsCodigos(p);
  // rótulo (e a origem do sistema logo abaixo); onde não há código fica "-" e preenche sozinho quando surgir
  const linhaCod=(rot,sub,lista,fin)=> (lista.length?lista:[null]).map(c=>`<div class="pc3-cr"><span class="pc3-cl">${rot}${sub?`<small>${sub}</small>`:''}</span>${c
      ? `<span class="pc3-cv">${fin?'<span class="pc3-fin" title="Elegível a financiamento FINAME">⭐ FINAME</span>':''}${c}</span><button class="pc3-cp" onclick="copiarCodigo(this,'${String(c).replace(/'/g,"\\'")}')" title="Copiar código" aria-label="Copiar ${c}"><i class="ti ti-copy"></i></button>`
      : `<span class="pc3-cv vz" title="Sem código — preenche quando houver estoque">-</span><span></span>`}</div>`).join('');
  const codigosHtml=`<div class="pc3-codes">${linhaCod('TOP · Nacional','Fábrica Livoltek Manaus',sl.nac,true)}${linhaCod('TOP · Importado','Fábrica Livoltek Manaus',sl.imp)}${linhaCod('TOTVS','',sl.tot)}</div>`;
  // estoque por armazém E por código (cada saldo com o seu código/sistema/origem; nada é somado entre códigos na linha)
  const mapa={};
  p.rows.forEach(r=>{
    const k=r.codigo+'|'+r.wh;
    const o=mapa[k]||(mapa[k]={codigo:r.codigo,wh:r.wh,sistema:r.sistema||'',origem:r.origemTxt||'',saldo:0,reserva:0,disp:0,virtual:false});
    o.saldo+=r.saldo; o.reserva+=r.reserva; o.disp+=r.disp; if(r._virtual) o.virtual=true;
  });
  const ordSis=o=>o.sistema==='TOTVS'?0:(o.origem==='Importado'?1:2);
  // GRADE PADRÃO: todo card tem sempre as mesmas linhas — os 3 armazéns da Eletra (código TOTVS) e a Fábrica Livoltek
  // Manaus com o código importado e o nacional — com estoque 0 onde não há produto. Com filtro de armazém ativo,
  // só as linhas daquele armazém. Linhas reais que fujam da grade (ex.: reserva num código/armazém que não bate)
  // continuam aparecendo depois, com o alerta.
  const FAB='Fábrica Livoltek', ELET=WH_LIST.filter(w=>w!==FAB), whF=(opts&&opts.whFiltro)||'';
  const grade=[];
  (sl.tot.length?sl.tot:[null]).forEach(c=>ELET.forEach(w=>grade.push({wh:w,codigo:c,sistema:'TOTVS',origem:'Importado'})));
  (sl.imp.length?sl.imp:[null]).forEach(c=>grade.push({wh:FAB,codigo:c,sistema:'TOP Manager',origem:'Importado'}));
  (sl.nac.length?sl.nac:[null]).forEach(c=>grade.push({wh:FAB,codigo:c,sistema:'TOP Manager',origem:'Nacional'}));
  const usadas=new Set();
  const doGrade=grade.filter(g=>!whF||g.wh===whF).map(g=>{
    const k=(g.codigo===null?'':g.codigo)+'|'+g.wh;
    const real=g.codigo!==null?mapa[k]:null; if(real) usadas.add(k);
    return real?real:{codigo:g.codigo===null?'-':g.codigo,wh:g.wh,sistema:g.sistema,origem:g.origem,saldo:0,reserva:0,disp:0,virtual:false};
  });
  const extras=Object.entries(mapa).filter(([k])=>!usadas.has(k)).map(([,o])=>o).filter(o=>!whF||o.wh===whF);
  const cmp=(a,b)=>(WH_LIST.indexOf(a.wh)-WH_LIST.indexOf(b.wh))||(ordSis(a)-ordSis(b))||String(a.codigo).localeCompare(String(b.codigo));
  const linhas=[...doGrade.sort(cmp),...extras.sort(cmp)];
  const tbl=linhas.map(o=>{
    const zero=!o.saldo&&!o.reserva;
    const col=o.disp>0?'var(--grn-d)':o.disp<0?'var(--red)':'var(--txtm)';
    const aviso=o.virtual?'Reserva sem estoque neste código':(o.disp<0?'Reserva maior que o estoque':'');
    const sis=o.sistema==='TOTVS'?'TOTVS':'TOP Manager';
    const finTag=(o.origem==='Nacional' && o.codigo && o.codigo!=='-')?'<span class="pc3-fin" title="Elegível a financiamento FINAME" style="margin:0">⭐ FINAME</span>':'';
    return `<div class="pc3-tr${zero?' z':''}">
      <div><div class="pc3-wn"><i class="ti ${WH_ICON[o.wh]||'ti-building-warehouse'}" style="color:${WH_COLOR[o.wh]||'#94a3b8'};font-size:12px"></i>${o.wh}</div>
      <div class="pc3-cd"><span class="pc3-cdc">${o.codigo}</span><span class="pc3-cds">${sis}</span>${finTag}</div></div>
      <span class="n" style="color:var(--txt2);font-weight:400">${fmt(o.saldo)}</span>
      <span class="n" style="${o.reserva?'color:var(--pur)':'color:var(--txtm)'}">${o.reserva?fmt(o.reserva):'-'}</span>
      <span class="n" style="font-weight:600;${zero?'':'color:'+col}">${fmt(o.disp)}${aviso?` <i class="ti ti-alert-triangle" style="color:var(--red)" title="${aviso}"></i>`:''}</span>
    </div>`;
  }).join('');
  return `<div class="pc2${isMP?' mp':''}" data-prod="${String(p.id).replace(/"/g,'')}">
    <div class="pc2-top">
      ${famLabel?`<span class="pc2-pill" style="color:${famCol};background:${famBg}">${famLabel}</span>`:''}
      ${p.isSemAfci?`<span class="pc2-pill" style="color:#ffffff;background:#dc2626;border:1px solid #dc2626;font-weight:700" title="Equipamento sem proteção AFCI">Exportação-S/AFCI</span>`:''}
      <div class="pc2-id">
        ${fotoHtml(p.id, p.familia)}
        <div class="pc2-id-txt">
          ${isMP?'<div class="mp-badge"><i class="ti ti-box" style="font-size:10px"></i> MATÉRIA-PRIMA</div>':''}
          <div class="pc2-cod" style="font-size:14px;line-height:1.3;word-break:break-word">${tituloProd(p)}</div>
          ${descProd(p)?`<div class="pc2-nom" style="min-height:0">${descProd(p)}</div>`:''}
          ${meta?`<div class="pc3-meta">${meta}</div>`:''}
        </div>
      </div>
    </div>
    <div class="pc2-disp-block">
      <div class="pc2-disp-lbl">${(opts&&opts.lblDisp)||'Total disponível para venda'}</div>
      <div class="pc2-disp-val" style="color:${dispCol}">${fmt(disp)}</div>
    </div>
    ${codigosHtml}
    <div class="pc3-tbl"><div class="pc3-th"><span>Armazém · código</span><span>Estoque</span><span>Reserva</span><span>Disp.</span></div>${tbl||'<div class="pc3-tr z"><span style="font-size:11px;color:var(--txtm)">Sem estoque nos relatórios</span></div>'}</div>
    <div class="pc2-totals pc3-tot">
      <div class="pc2-total-row"><span>Estoque total</span><span>${fmt(sal)}</span></div>
      ${res?`<div class="pc2-total-row"><span>Reservado</span><span>${fmt(res)}</span></div>`:''}
      ${fat?`<div class="pc2-total-row"><span>Faturado</span><span>${fmt(fat)}</span></div>`:''}
    </div>
    ${(opts&&opts.extra)||''}
  </div>`;
}

// ══ CARD DE PRODUTO (formato antigo, 1 card por código — não mais usado nas abas) ══
function pCard(r, isMP){
  const disp=r._disp; // já descontado: Saldo - Reserva - Faturado
  const sal=r._sal;
  const res=r._res||0;
  const fat=r._fat||0;
  const dispCol=disp>0?'var(--grn-d)':disp===0?'var(--amb-d)':'var(--red)';
  const famLabel=r.familia||r.categoria||'';
  const famCol=isMP?'var(--red)':'var(--pri)';
  const famBg=isMP?'var(--red-pale)':'var(--pri-pale)';

  const whRows=whListHtml(r._byWH);

  // Detalhe de reserva por armazém usando _byWH.reserva (já acumulado em dedup)
  const resWhRows=WH_LIST.map(w=>{
    const d=r._byWH[w]; if(!d||!d.reserva) return '';
    const c=WH_COLOR[w]; const ico=WH_ICON[w];
    return `<div class="pc2-wh-row">
      <i class="ti ${ico}" style="color:${c};font-size:12px"></i>
      <span class="pc2-wh-name">${w}</span>
      <span class="pc2-wh-val" style="color:var(--pur)">${fmt(d.reserva)}</span>
    </div>`;
  }).join('');

  // Detalhe de faturado por armazém usando _byWH.fat (já acumulado em dedup)
  const fatWhRows=WH_LIST.map(w=>{
    const d=r._byWH[w]; if(!d||!d.fat) return '';
    const c=WH_COLOR[w]; const ico=WH_ICON[w];
    return `<div class="pc2-wh-row">
      <i class="ti ${ico}" style="color:${c};font-size:12px"></i>
      <span class="pc2-wh-name">${w}</span>
      <span class="pc2-wh-val" style="color:var(--cor-laranja)">${fmt(d.fat)}</span>
    </div>`;
  }).join('');

  const fatPedidos=[...new Set(
    Object.entries(FAT).filter(([k])=>k.endsWith('|'+r.codigo)).flatMap(([,v])=>v.pedidos)
  )];

  const nom=r.nomenclatura||r.descricao||r.codigo;

  return `<div class="pc2${isMP?' mp':''}">
    <div class="pc2-top">
      ${famLabel?`<span class="pc2-pill" style="color:${famCol};background:${famBg}">${famLabel}</span>`:''}
      ${r.isFiname?`<span class="pc2-pill" style="color:#92400e;background:#fef3c7;border:1px solid #fcd34d;font-weight:700" title="Elegível a financiamento FINAME">⭐ FINAME</span>`:''}
      ${r.isSemAfci?`<span class="pc2-pill" style="color:#ffffff;background:#dc2626;border:1px solid #dc2626;font-weight:700" title="Equipamento sem proteção AFCI">Exportação-S/AFCI</span>`:''}
      <div class="pc2-id">
        ${fotoHtml(r.codigo, r.familia)}
        <div class="pc2-id-txt">
          <div class="pc2-head">
            <div class="pc2-cod">${r.codigo}</div>
          </div>
          ${isMP?'<div class="mp-badge"><i class="ti ti-box" style="font-size:10px"></i> MATÉRIA-PRIMA</div>':''}
          <div class="pc2-nom">${nom}</div>
        </div>
      </div>
    </div>
    <div class="pc2-disp-block">
      <div class="pc2-disp-lbl">Disponível para Venda</div>
      <div class="pc2-disp-val" style="color:${dispCol}">${fmt(disp)}</div>
    </div>
    <div class="pc2-wh-list" style="flex:1">${whRows}</div>
    <div class="pc2-totals">
      <div class="pc2-total-row"><span>Estoque Total</span><span>${fmt(sal)}</span></div>
    </div>
    ${(res>0||fat>0)?`
    <div class="pc2-cli-toggle" onclick="toggleTotCard('${r.codigo}',this)">
      <span style="display:flex;gap:10px;align-items:center">
        ${res>0?`<span class="pc2-fat" style="color:var(--pur)"><i class="ti ti-bookmark"></i> ${fmt(res)}</span>`:''}
        ${fat>0?`<span class="pc2-fat"><i class="ti ti-truck-delivery"></i> ${fmt(fat)}</span>`:''}
      </span>
      <i class="ti ti-chevron-down" style="font-size:12px;color:var(--txtm)"></i>
    </div>
    <div class="pc2-tot-detail" style="display:none">
      <div class="pc2-totals" style="border-top:none;padding-top:0">
        ${res>0?`<div class="pc2-total-row pc2-res"><span><i class="ti ti-bookmark"></i> Reserva</span><span>${fmt(res)}</span></div>
          <div style="padding:2px 0 0 12px;display:flex;flex-direction:column;gap:2px">
            ${resWhRows}
          </div>`:''}
        ${fat>0?`
          <div class="pc2-total-row pc2-fat"><span><i class="ti ti-truck-delivery"></i> Faturado</span><span>${fmt(fat)}</span></div>
          <div style="padding:2px 0 0 12px;display:flex;flex-direction:column;gap:2px">
            ${fatWhRows}
          </div>
          <div class="pc2-note">desde ${DATA_CORTE_FATURADOS.toLocaleDateString('pt-BR')}</div>`:''}
        <div class="pc2-note">Reserva e faturados já abatidos do disponível.</div>
      </div>
    </div>`:''}
  </div>`;
}

// Filtro ativo por aba: { tabId: 'NOME_DA_FAMILIA' | '' }
// Toggle da seção de Reserva/Faturado no card
function toggleTotCard(codigo, btn){
  const detail = btn.nextElementSibling;
  if(!detail) return;
  const open = detail.style.display !== 'none';
  detail.style.display = open ? 'none' : 'block';
  const ico = btn.querySelector('.ti');
  if(ico) ico.className = open ? 'ti ti-chevron-down' : 'ti ti-chevron-up';
  ico.style.fontSize='12px'; ico.style.color='var(--txtm)';
}

const famFilters={};
const grpFilters={};   // grupo de famílias ativo por aba (1º nível dos botões)

// Agrupa as famílias em 2 níveis para os botões. "INVERSOR - GT1-5K" → grupo "GT1" (sub-família "GT1-5K");
// "INVERSOR - GT3 -20K" → grupo "GT3"; "INVERSOR - HP1" → grupo "HP1"; "INVERSOR - MATERIA-PRIMA" e
// "CARREGADOR - 60kW" ficam como grupo de uma família só. O grupo é o trecho do modelo (letras+número) antes do 1º "-".
function famGrupo(fam){
  const f=String(fam||'').trim();
  if(!f) return {chave:'',pref:'',grupo:'',resto:''};
  const m=f.match(/^(.*?)\s*-\s*(.*)$/);
  if(!m) return {chave:f,pref:f,grupo:f,resto:f};
  const pref=m[1].trim(), resto=m[2].trim();
  const seg=resto.split('-')[0].trim();
  const grupo=/^[A-Za-z]+\d+$/.test(seg) ? seg : resto;
  return {chave:pref+' - '+grupo,pref,grupo,resto};
}
const natCmp=(a,b)=>String(a).localeCompare(String(b),'pt-BR',{numeric:true});
function setGrp(tabId, chave){
  grpFilters[tabId] = (grpFilters[tabId]===chave) ? '' : chave; // clicar de novo desmarca
  famFilters[tabId] = '';                                        // trocar de grupo limpa a sub-família
  renderCat(tabId);
}
// Filtro FINAME por aba (liga/desliga, combina com o filtro de família). Pedido da Cristiane:
// o vendedor clica e vê só os produtos Finame.
const finameFilters={};
function toggleFiname(tabId){
  finameFilters[tabId]=!finameFilters[tabId];
  renderCat(tabId);
}

function setFam(tabId, fam){
  famFilters[tabId] = (famFilters[tabId]===fam) ? '' : fam; // clicar de novo desmarca
  renderCat(tabId);
}

function renderFamPills(tabId, baseRows){
  const pillsEl=document.getElementById(tabId+'-pills');
  if(!pillsEl) return;
  const esc=t=>String(t).replace(/'/g,"\\'");
  // famílias da aba (só com produtos desta aba), com os códigos de cada uma
  const porFam={};
  baseRows.forEach(r=>{ if(r.familia) (porFam[r.familia]=porFam[r.familia]||new Set()).add(r.prodId||r.codigo); });
  // 1º nível: grupos
  const grupos={};
  Object.keys(porFam).forEach(f=>{
    const g=famGrupo(f);
    const o=grupos[g.chave]||(grupos[g.chave]={chave:g.chave,pref:g.pref,grupo:g.grupo,fams:[],cods:new Set()});
    o.fams.push(f); porFam[f].forEach(c=>o.cods.add(c));
  });
  const lista=Object.values(grupos).sort((a,b)=>natCmp(a.chave,b.chave));
  // Botão FINAME: só aparece se a aba tem algum produto Finame
  const nFin=new Set(baseRows.filter(r=>r.isFiname||(CADASTRO[r.prodId||r.codigo]||{}).nacional).map(r=>r.prodId||r.codigo)).size;
  if(!nFin) finameFilters[tabId]=false; // sem produto Finame na aba, não deixa o filtro preso ligado
  if(!lista.length && !nFin){ pillsEl.innerHTML=''; return; }
  // filtros ativos que não existem mais nesta aba são limpos
  if(grpFilters[tabId] && !grupos[grpFilters[tabId]]){ grpFilters[tabId]=''; famFilters[tabId]=''; }
  if(famFilters[tabId] && !porFam[famFilters[tabId]]) famFilters[tabId]='';
  const gAtivo=grpFilters[tabId]||'', fAtiva=famFilters[tabId]||'';
  const mostrarPref=new Set(lista.map(g=>g.pref)).size>1; // aba com mais de um tipo (ex.: Todos): mostra "INVERSOR - GT1"
  const finBtn = nFin ? `<button class="fam-pill finame${finameFilters[tabId]?' on':''}" onclick="toggleFiname('${tabId}')" title="Mostrar só produtos Finame">⭐ FINAME (${nFin})</button>` : '';
  const nivel1 = lista.map(g=>`<button class="fam-pill${g.chave===gAtivo?' on':''}" onclick="setGrp('${tabId}','${esc(g.chave)}')">${mostrarPref?g.chave:g.grupo}<span class="fam-n">${g.cods.size}</span></button>`).join('');
  // 2º nível: sub-famílias do grupo selecionado (só quando o grupo tem 2 ou mais)
  let nivel2='';
  const ga=grupos[gAtivo];
  if(ga && ga.fams.length>=2){
    const subs=[...ga.fams].sort(natCmp).map(f=>`<button class="fam-pill${f===fAtiva?' on':''}" onclick="setFam('${tabId}','${esc(f)}')">${f===ga.chave?ga.grupo+' (outros)':famGrupo(f).resto}<span class="fam-n">${porFam[f].size}</span></button>`).join('');
    nivel2=`<div class="fam-sub"><span class="fam-sub-lbl">${mostrarPref?ga.chave:ga.grupo}</span><button class="fam-pill${fAtiva?'':' on'}" onclick="setFam('${tabId}','')">Todos<span class="fam-n">${ga.cods.size}</span></button>${subs}</div>`;
  }
  pillsEl.innerHTML = finBtn + nivel1 + nivel2;
}

function renderCat(tabId){
  const q=(document.getElementById(tabId+'-q')?.value||'').toLowerCase();
  const wh=document.getElementById(tabId+'-wh')?.value||'';
  const famAtiva=famFilters[tabId]||'';

  // Aba MP: mostra todos os isMP=true independente do _catTab
  // Outras abas: filtra por _catTab E separa MP em seção inferior
  let baseRows, baseMPRows=[];
  // Produtos de EXPORT_SKUS só podem aparecer na aba Exportação — em nenhuma outra (Todos,
  // categorias, Matéria-Prima). Antes, se o código também tivesse saldo em ARMZ=07, ele
  // aparecia normal em Inversores/etc, confundindo o time de vendas (achavam que dava pra
  // vender no mercado interno). Corrigido em 22/09/2026.
  if(tabId==='todos'){
    baseRows = ST.filter(r=>!r.isMP && !ehExport(r));
    baseMPRows = ST.filter(r=>r.isMP && !ehExport(r));
  } else if(tabId==='mp'){
    baseRows = ST.filter(r=>r.isMP && !ehExport(r));
    baseMPRows = [];
  } else {
    baseRows = ST.filter(r=>getCatTab(r)===tabId && !r.isMP && !ehExport(r));
    baseMPRows = ST.filter(r=>getCatTab(r)===tabId && r.isMP && !ehExport(r));
  }

  renderFamPills(tabId, [...baseRows,...baseMPRows]);

  // Filtros nos produtos normais
  let rows = baseRows;
  const gAtivo=grpFilters[tabId]||'';
  if(famAtiva) rows=rows.filter(r=>r.familia===famAtiva);
  else if(gAtivo) rows=rows.filter(r=>famGrupo(r.familia).chave===gAtivo);
  if(wh) rows=rows.filter(r=>r.wh===wh);
  const termos=consultaBusca(q);
  // Ordem alfabética pelo título que aparece no card (nomenclatura ou, se vazia, o código). Sem ordem "natural"
  // de números (que colocava 91402LK014 antes de 3990028680): é a ordem alfabética comum, sem diferenciar acento nem maiúscula.
  const porNome=ordemProd;
  let dd=agruparProdutos(rows);
  if(finameFilters[tabId]) dd=dd.filter(p=>p.isFiname);
  if(termos.length) dd=dd.filter(p=>prodBusca(p,termos));
  dd.sort(porNome);

  const cardsEl=document.getElementById(tabId+'-cards');
  if(cardsEl) cardsEl.innerHTML=dd.map(p=>pCardProd(p,false,{whFiltro:wh})).join('') ||
    `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--txtm);font-size:13px">Nenhum produto encontrado.</div>`;

  // Seção inferior: Matéria-Prima da família (exceto na aba mp onde já são todos)
  const mpSecEl=document.getElementById(tabId+'-mp-sec');
  if(mpSecEl && tabId!=='mp'){
    let mpRows = baseMPRows;
    if(wh) mpRows=mpRows.filter(r=>r.wh===wh);
    let mpdd=agruparProdutos(mpRows);
    if(finameFilters[tabId]) mpdd=mpdd.filter(p=>p.isFiname);
    if(termos.length) mpdd=mpdd.filter(p=>prodBusca(p,termos));
    mpdd.sort(porNome);
    if(mpdd.length){
      mpSecEl.style.display='block';
      mpSecEl.innerHTML=`
        <div style="margin:20px 0 10px;display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:1px;background:var(--red)"></div>
          <span style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em">
            <i class="ti ti-building-factory-2"></i> Matéria-Prima
          </span>
          <div style="flex:1;height:1px;background:var(--red)"></div>
        </div>
        <div class="cgrid">${mpdd.map(p=>pCardProd(p,true,{whFiltro:wh})).join('')}</div>`;
    } else {
      mpSecEl.style.display='none';
      mpSecEl.innerHTML=''; // não deixa cards antigos escondidos no DOM
    }
  }
}

function rDash(){
  // STV = ST sem os produtos de EXPORT_SKUS — o Dashboard (categorias, armazéns, Top 10)
  // não pode contar estoque de exportação junto com o comercial normal, senão os números
  // e rankings ficam inflados com produto que o vendedor não pode oferecer no mercado interno.
  const STV = ST.filter(r=>!ehExport(r));
  const CAT_DEFS=[
    {tab:'inv',label:'Inversores',ico:'ti-bolt',col:'var(--cwb)',bg:'#dbeafe'},
    {tab:'ev',label:'Carregadores EV',ico:'ti-charging-pile',col:'var(--grn-d)',bg:'var(--grn-pale)'},
    {tab:'bess',label:'BESS / Baterias',ico:'ti-battery-charging',col:'var(--amb-d)',bg:'var(--amb-pale)'},
    {tab:'kit',label:'Kit Solar',ico:'ti-sun',col:'#d97706',bg:'#fef3c7'},
    {tab:'strbox',label:'String Box',ico:'ti-rotate-2',col:'var(--blu)',bg:'#dbeafe'},
    {tab:'div',label:'Diversos',ico:'ti-apps',col:'#7c3aed',bg:'#ede9fe'},
    {tab:'mot',label:'Motor de Barco',ico:'ti-propeller',col:'#0369a1',bg:'#dbeafe'},
    {tab:'mp',label:'Matéria-Prima',ico:'ti-building-factory-2',col:'var(--red)',bg:'var(--red-pale)'},
  ];
  const catData=CAT_DEFS.map(def=>{
    const rows=STV.filter(r=>getCatTab(r)===def.tab);
    const disp=rows.reduce((a,r)=>a+r.disp,0);
    const skus=new Set(rows.filter(r=>!r._zero).map(r=>r.codigo)).size;
    return {...def,disp,skus};
  });
  const totalDisp=catData.reduce((a,c)=>a+c.disp,0);
  const maxDisp=Math.max(...catData.map(c=>c.disp),1);

  const catRows=catData.map(c=>`
    <div class="pr" style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--brd);cursor:pointer" onclick="go('${c.tab}')">
      <div style="width:34px;height:34px;border-radius:8px;background:${c.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ${c.ico}" style="color:${c.col};font-size:17px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-weight:600;font-size:13px">${c.label} <span style="font-size:11px;color:var(--txtm);font-weight:400">${c.skus} SKUs</span></span>
          <span style="font-family:'DM Mono',monospace;font-weight:700;font-size:15px">${fmt(c.disp)}</span>
        </div>
        <div style="height:5px;background:#f1f5f9;border-radius:3px;margin-top:5px;overflow:hidden">
          <div style="height:100%;width:${Math.round(c.disp/maxDisp*100)}%;background:${c.col};border-radius:3px"></div>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('dash-cat').innerHTML=`
    <div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--brd)">
        <span style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--txtm)"><i class="ti ti-chart-bar"></i> Estoque Disponível por Categoria</span>
        <span style="font-size:13px">Total: <b>${fmt(totalDisp)}</b></span>
      </div>
      ${catRows}
    </div>`;

  // Cards por armazém
  document.getElementById('dash-wh').innerHTML = WH_LIST.map(w=>{
    const rows=STV.filter(r=>r.wh===w);
    const disp=rows.reduce((a,r)=>a+r.disp,0);
    const sal=rows.reduce((a,r)=>a+r.saldo,0);
    const skus=new Set(rows.filter(r=>!r._zero).map(r=>r.codigo)).size;
    return `<div class="kcard">
      <div class="kcard-lbl" style="color:${WH_COLOR[w]||'#64748b'}">${w}</div>
      <div class="kcard-val">${fmt(disp)}</div>
      <div style="font-size:11px;color:var(--txtm);margin-top:2px">Estoque: ${fmt(sal)} · ${skus} SKUs</div>
    </div>`;
  }).join('');

  // Top 10 disponível
  const top10=dedup(STV).sort((a,b)=>b._disp-a._disp).slice(0,10);
  document.getElementById('dash-top10').innerHTML = `
    <div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-top:18px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px"><i class="ti ti-trophy"></i> Top 10 — Maior Disponível</div>
      ${top10.map((r,i)=>linhaTop10(r,i)).join('')}
    </div>`;

  // Top 10 por família (Inversores / Carregadores EV) — ranqueado por Disponível
  // (saldo já líquido de reserva, igual ao Top 10 geral acima). Se a família tiver
  // menos de 10 SKUs, mostra só 5 (ou menos, se nem 5 existir).
  function topFamilia(tabId){
    const rows=dedup(STV.filter(r=>getCatTab(r)===tabId)).sort((a,b)=>b._disp-a._disp);
    const n = rows.length>=10 ? 10 : Math.min(5, rows.length);
    return rows.slice(0, n);
  }
  // Linha do Top 10: código completo em destaque (mesmo padrão dos cards de produto),
  // com a nomenclatura/descrição como texto secundário truncado — antes só mostrava a
  // nomenclatura truncada, que às vezes é curta/redundante e não identifica o produto.
  function linhaTop10(r,i){
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--brd);font-size:12px">
      <span style="min-width:0">
        <span style="color:var(--txtm)">${i+1}.</span>
        <span style="font-family:'DM Mono',monospace;font-weight:700">${r.codigo}</span>
        <span style="color:var(--txtm)"> — ${tr(r.nomenclatura||r.descricao,42)}</span>
      </span>
      <span style="font-family:'DM Mono',monospace;font-weight:700;flex-shrink:0">${fmt(r._disp)}</span>
    </div>`;
  }
  function blocoTopFamilia(titulo, icone, rows){
    return `<div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:14px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px"><i class="ti ${icone}"></i> ${titulo}</div>
      ${rows.length ? rows.map((r,i)=>linhaTop10(r,i)).join('') : `<div style="font-size:12px;color:var(--txtm);padding:6px 0">Nenhum item encontrado.</div>`}
    </div>`;
  }
  document.getElementById('dash-top10-fam').innerHTML =
    blocoTopFamilia('Top 10 Inversores — Maior Disponível', 'ti-bolt', topFamilia('inv')) +
    blocoTopFamilia('Top 10 Carregadores EV — Maior Disponível', 'ti-charging-pile', topFamilia('ev'));
}

// Card da aba Reservas: o mesmo card consolidado das demais telas (um por produto comercial, com os 3 códigos e a tabela
// por armazém/código) + a lista de clientes que reservaram. Disponível e reserva mostram SEMPRE o total real do produto:
// um filtro de diretoria/busca não pode fazer o produto parecer mais disponível do que está (caso real de 21/09/2026).
function buildProdCard(g, modoDiretoria, isFiltered){
  const rowsP=ST.filter(s=>(s.prodId||s.codigo)===g.id);
  const cad=CADASTRO[g.id]||{};
  const p = rowsP.length ? agruparProdutos(rowsP)[0]
    : {id:g.id,rows:[],nome:cad.nomenclatura||cad.descricao||g.id,familia:cad.familia||'',categoria:cad.categoria||'',isMP:false,isSemAfci:!!cad.exportacao,isFiname:!!cad.nacional,_sal:0,_res:0,_fat:0,_disp:0};
  const sortedRes=g.reservas.slice().sort((a,b)=>b.qtd-a.qtd);
  const expanded=resExpanded.has(g.id);
  const nCli=new Set(g.reservas.map(r=>r.cliente)).size;
  const idEsc=String(g.id).replace(/'/g,"\\'");
  const extra=`${isFiltered?`<div class="pc2-note" style="padding:0 1rem .5rem">Reserva do filtro atual (lista de clientes abaixo): ${fmt(g.totalQtd)}</div>`:''}
    <div class="pc2-cli-toggle${expanded?' open':''}" onclick="toggleResCard('${idEsc}')">
      <span><i class="ti ti-users"></i> ${nCli} cliente${nCli>1?'s':''} · ${fmt(g.totalQtd)} un.</span>
      <i class="ti ${expanded?'ti-chevron-up':'ti-chevron-down'}"></i>
    </div>
    ${expanded?sortedRes.map(buildResRow).join(''):''}`;
  return pCardProd(p,p.isMP,{extra});
}

function toggleResCard(id){
  if(resExpanded.has(id)) resExpanded.delete(id); else resExpanded.add(id);
  rRes();
}

// ══ EXPORTAÇÃO — SKUs fixos monitorados (todos os armazéns, sem filtro ARMZ)
const EXPORT_SKUS = [
  'GT1-5KD1R11001','GT1-6KD1R11001','GT1-8KT1R11001','GT1-10KT2R11003',
  'GT3-15KD1R11001','GT3-20KD1R11001','GT3-20KL-TW11001',
  'GT3-25KD1R11001','GT3-25KL-TW11001'
];

// Linha de estoque de produto de exportação: vale o produto comercial (código TOTVS OU TOP importado ligado a ele).
const ehExport = r => EXPORT_SKUS.includes(r.prodId||r.codigo);

// Cards de exportação expandidos — mesmo padrão visual das reservas
const expExpanded = new Set();

function toggleExpCard(sku){
  if(expExpanded.has(sku)) expExpanded.delete(sku); else expExpanded.add(sku);
  rExp();
}

function rExp(){
  const el=document.getElementById('exp-cards');
  if(!el) return;
  // Um card por produto de exportação, no mesmo formato das outras telas: 3 códigos (TOTVS, TOP importado e
  // TOP nacional, quando houver), estoque por armazém e por código, título/descrição pela mesma regra.
  const prods=EXPORT_SKUS.map(sku=>{
    const rows=ST.filter(r=>(r.prodId||r.codigo)===sku);
    if(rows.length) return agruparProdutos(rows)[0];
    const cad=CADASTRO[sku]||{};
    return {id:sku,rows:[],nome:cad.nomenclatura||cad.descricao||sku,familia:cad.familia||'',categoria:cad.categoria||'',isMP:false,
      isSemAfci:!!cad.exportacao,isFiname:!!cad.nacional,_sal:0,_res:0,_fat:0,_disp:0};
  }).sort(ordemProd);
  el.innerHTML = prods.map(p=>pCardProd(p,false)).join('');
}

function rRes(){
  const q=(document.getElementById('res-q')?.value||'').toLowerCase();
  const dir=document.getElementById('res-dir')?.value||'';
  const arm=document.getElementById('res-arm')?.value||'';
  const isFiltered = !!(q||dir||arm); // qualquer filtro ativo torna a Reserva exibida "parcial"
  const termos=consultaBusca(q);
  const idPorCod={}; ST.forEach(s=>{ idPorCod[s.codigo]=s.prodId||s.codigo; });
  const idDe=c=> idPorCod[c] || prodIdDeCodigo(c);
  const rowsPorProd={}; ST.forEach(s=>{ (rowsPorProd[s.prodId||s.codigo]=rowsPorProd[s.prodId||s.codigo]||[]).push(s); });
  const cacheP={}; const prodDe=id=>cacheP[id]!==undefined?cacheP[id]:(cacheP[id]=(rowsPorProd[id]?agruparProdutos(rowsPorProd[id])[0]:null));
  const rows=RES.filter(r=>{
    const mq=!q||r.cliente.toLowerCase().includes(q)||(r.responsavel||'').toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q)||(termos.length&&(()=>{ const p=prodDe(idDe(r.codigo)); return p&&prodBusca(p,termos); })());
    const md=!dir||r.diretoria===dir;
    const ma=!arm||(r.wh||'').toLowerCase().includes(arm.toLowerCase());
    return mq&&md&&ma;
  });
  const byProd={};
  rows.forEach(r=>{
    const id=idDe(r.codigo);
    if(!byProd[id]) byProd[id]={id,reservas:[],totalQtd:0,whs:new Set()};
    byProd[id].reservas.push(r); byProd[id].totalQtd+=r.qtd; if(r.wh) byProd[id].whs.add(r.wh);
  });
  const grupos=Object.values(byProd).sort((a,b)=>ordemProd({id:a.id,rows:(rowsPorProd[a.id]||[])},{id:b.id,rows:(rowsPorProd[b.id]||[])}));
  document.getElementById('res-cnt').textContent=fmt(rows.reduce((a,r)=>a+(r.qtd||0),0));
  document.getElementById('res-prod-cnt').textContent=grupos.length;
  const el=document.getElementById('res-cards');
  el.innerHTML = grupos.length ? grupos.map(g=>buildProdCard(g,!!dir,isFiltered)).join('') :
    `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--txtm)"><i class="ti ti-bookmark-off"></i><div>Nenhuma reserva encontrada</div></div>`;
}

// ══ AUDITORIA ══
function rAudit(){
  const N=fmt;
  const fmtTS=ts=>ts?ts.toLocaleString('pt-BR'):'—';

  const fonteDefs=[
    {nome:'Estoque (CSVs)',ts:SRC_TS.estoque,cnt:ST.length,unit:'registros'},
    {nome:'Cadastro de Produtos',ts:SRC_TS.cadastro,cnt:Object.keys(CADASTRO).length,unit:'SKUs'},
    // Armazéns não vêm de um arquivo — é uma lista fixa no próprio código (WH_LIST/FL_MAP),
    // por isso sempre "ok": não há fonte externa que possa falhar aqui.
    {nome:'Armazéns',ts:SRC_TS.estoque,cnt:WH_LIST.length,unit:'armazéns',fixo:true},
    {nome:'Reservas',ts:SRC_TS.reservas,cnt:RES.length,unit:'reservas'},
    {nome:'Baseline travada (overrides_estoque.csv)',ts:Object.keys(AUD_BASELINE).length?SRC_TS.estoque:null,cnt:Object.keys(AUD_BASELINE).length,unit:'código+armazém',opcional:true},
  ];
  const fonteRows=fonteDefs.map(f=>{
    const status = f.fixo ? '✅' : (f.opcional && !f.ts) ? '<span style="color:#9ca3af">— não configurado</span>' : (f.ts?'✅':'❌');
    return `<tr><td>${f.nome}</td><td style="text-align:right;font-family:'DM Mono',monospace">${f.cnt} ${f.unit}</td>
    <td>${f.opcional&&!f.ts?'—':fmtTS(f.ts)}</td><td>${status}</td></tr>`;
  }).join('');
  // Só considera "com problema" as fontes obrigatórias (não fixas, não opcionais) sem timestamp,
  // ou qualquer alerta de erro real (SRC_ALERTS) — Baseline vazio (opcional) e Armazéns (fixo)
  // nunca contam como problema.
  const fontesOk = !SRC_ALERTS.length && fonteDefs.every(f=>f.fixo||f.opcional||f.ts);

  // ── Conferência TOTVS x Sistema: baseline travada vs valor lido agora nos CSVs de estoque
  const nDecididas = AUD_DIVERGENTES.filter(v=>AUD_DECISIONS[AUD_KEY(v.codigo,v.wh)]).length;
  const decRows = AUD_DIVERGENTES.map(v=>{
    const k=AUD_KEY(v.codigo,v.wh);
    const dec=AUD_DECISIONS[k];
    const decLabel=dec?({aceitar_totvs:'✅ Aceitar TOTVS',manter_sistema:'🔒 Manter Sistema',investigar:'🔎 Investigar'}[dec.decisao]||dec.decisao):'';
    const diff=v.saldoTotvs-v.saldoSistema;
    const diffCor=diff>0?'var(--grn-d)':'var(--red)';
    return `<tr style="${dec?'background:#f0fdf4':''}">
      <td style="font-family:'DM Mono',monospace;color:#7c3aed">${v.codigo}</td>
      <td>${v.descricao||'—'}</td>
      <td>${v.wh}</td>
      <td style="text-align:right">${fmt(v.saldoSistema)}</td>
      <td style="text-align:right">${fmt(v.saldoTotvs)}</td>
      <td style="text-align:right;font-weight:700;color:${diffCor}">${diff>0?'+':''}${fmt(diff)}</td>
      <td>${dec?`<span style="font-size:11px;font-weight:600">${decLabel}</span>`:`
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button onclick="setDecisaoAudit('${v.codigo}','${v.wh}','aceitar_totvs')" style="font-size:10px;padding:3px 7px;border:1px solid var(--grn-d);background:var(--grn-pale);color:var(--grn-d);border-radius:5px;cursor:pointer">Aceitar TOTVS</button>
          <button onclick="setDecisaoAudit('${v.codigo}','${v.wh}','manter_sistema')" style="font-size:10px;padding:3px 7px;border:1px solid var(--pri);background:var(--pri-pale);color:var(--pri);border-radius:5px;cursor:pointer">Manter Sistema</button>
          <button onclick="setDecisaoAudit('${v.codigo}','${v.wh}','investigar')" style="font-size:10px;padding:3px 7px;border:1px solid var(--amb-d);background:var(--amb-pale);color:var(--amb-d);border-radius:5px;cursor:pointer">Investigar</button>
        </div>`}</td>
    </tr>`;
  }).join('');
  const totvsBlock = AUD_DIVERGENTES.length ? `
    <div class="aud-block">
      <div class="aud-hdr" style="background:#fdf4ff;color:#7c3aed;justify-content:space-between">
        <span><i class="ti ti-scale"></i> Conferência TOTVS x Sistema — ${AUD_DIVERGENTES.length} divergência${AUD_DIVERGENTES.length>1?'s':''}</span>
        <button onclick="baixarValidacoesEstoque()" style="padding:5px 12px;border:1px solid #7c3aed;background:#7c3aed;color:#fff;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600">
          <i class="ti ti-download"></i> Baixar validações${nDecididas?` (${nDecididas})`:''}

      </div>
      <div style="background:#fdf4ff;border:1px solid #e9d5ff;border-top:none;padding:8px 14px;font-size:11px;color:#581c87">
        <b>Saldo Sistema</b> = valor travado na última validação. <b>Saldo TOTVS</b> = o que veio no arquivo de estoque mais recente.
        Decida linha a linha; ao terminar, baixe o arquivo e suba em <code>data/overrides_estoque.csv</code> — o dashboard assume o novo valor assim que a página recarregar, sem esperar a próxima atualização semanal de estoque.

      <table class="aud-tbl" style="border:1px solid #e9d5ff;border-top:none">
        <tr style="background:#fdf4ff"><th>Código</th><th>Produto</th><th>Armazém</th><th style="text-align:right">Saldo Sistema</th><th style="text-align:right">Saldo TOTVS</th><th style="text-align:right">Dif.</th><th>Decisão</th></tr>

  const alertRows=SRC_ALERTS.map(a=>`<tr style="background:#fff5f5"><td colspan="2" style="color:#dc2626;font-weight:600">${a.fonte}</td><td colspan="2">${a.msg}</td></tr>`).join('');

  const semCadRows=VAL_SEM_CADASTRO.slice(0,30).map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.descricao||'—'}</td><td>${v.wh}</td></tr>`).join('');
  const whInvRows=VAL_WH_INVALIDO.map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.fonte}</td><td>${v.descricao}</td></tr>`).join('');
  const insufRows=VAL_INSUFICIENTE.map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.descricao||'—'}</td><td>${v.wh}</td>
    <td style="text-align:right">${fmt(v.saldo)}</td><td style="text-align:right;color:var(--pur)">${fmt(v.reserva)}</td><td style="text-align:right;color:#dc2626;font-weight:700">${fmt(v.disp)}</td></tr>`).join('');

// ══ VARIAÇÃO DE ESTOQUE vs. versão anterior (histórico de commits do GitHub) ══
// Pedido da Cristiane: ver o que aumentou/diminuiu desde a atualização anterior, sem rotina
// manual. Só roda quando a aba Auditoria é aberta (evita gastar o limite da API do GitHub
// a cada acesso). Compara arquivo contra arquivo (ESTOQUE DISPONIVEL / Saldo Estoque), com os
// mesmos parsers do dashboard. Depende do repositório ser público; se não for, avisa.
const GH_REPO='smlivoltek/livoltek';
let ESTOQUE_TXT={}, ESTOQUE_ITENS_ATUAIS={geral:[],fabrica:[]};
let VARIACAO={estado:'idle',linhas:[],fontes:[],filtro:'todos',erro:''};

async function ghVersaoAnterior(arquivo, textoAtual){
  const norm=t=>String(t||'').replace(/\r\n/g,'\n').trim();
  const rc=await fetch(`https://api.github.com/repos/${GH_REPO}/commits?path=data/${arquivo}&per_page=8`);
  if(!rc.ok) throw new Error('GitHub respondeu HTTP '+rc.status);
  const commits=await rc.json();
  let n=0;
  for(const c of commits){
    if(n++>=6) break;
    const rr=await fetch(`https://raw.githubusercontent.com/${GH_REPO}/${c.sha}/data/${arquivo}`);
    if(!rr.ok) continue;
    const txt=new TextDecoder('windows-1252').decode(await rr.arrayBuffer());
    if(norm(txt)!==norm(textoAtual)) return {txt, data:new Date(c.commit.committer.date), sha:c.sha.slice(0,7)};
  }
  return null;
}

// Os parsers têm efeito colateral (EXP_RAW, SRC_ALERTS) — isolo pra não contaminar a aba Exportação.
function parseIsolado(parser, txt){
  const bakExp=EXP_RAW, nAl=SRC_ALERTS.length;
  EXP_RAW=[];
  try{ return parser(txt); } finally { EXP_RAW=bakExp; SRC_ALERTS.length=nAl; }
}

function somaPorChave(items){
  const m=new Map();
  items.forEach(i=>{
    const k=i.wh+'|'+i.codigo;
    const o=m.get(k)||{codigo:i.codigo,wh:i.wh,descricao:i.descricao||'',saldo:0};
    o.saldo+=i.saldo||0; if(!o.descricao&&i.descricao) o.descricao=i.descricao;
    m.set(k,o);
  });
  return m;
}

function compararEstoque(antes, agora){
  const A=somaPorChave(antes), B=somaPorChave(agora), out=[];
  new Set([...A.keys(),...B.keys()]).forEach(k=>{
    const a=A.get(k), b=B.get(k);
    const ant=a?a.saldo:0, atu=b?b.saldo:0, dif=atu-ant;
    if(!dif) return;
    const base=b||a;
    const cad=(base.wh==='Fábrica Livoltek'?(CADASTRO_NACTOP[base.codigo]||CADASTRO_TOP[base.codigo]||CADASTRO[base.codigo]):CADASTRO[base.codigo])||{};
    out.push({codigo:base.codigo, wh:base.wh, nome:cad.nomenclatura||base.descricao||'',
      ant, atu, dif, tipo: !a?'novo':(!b?'saiu':(dif>0?'subiu':'caiu'))});
  });
  return out;
}

async function carregarVariacaoEstoque(forcar){
  if(VARIACAO.estado==='loading') return;
  if(VARIACAO.estado==='ok'&&!forcar) return;
  VARIACAO={estado:'loading',linhas:[],fontes:[],filtro:'todos',erro:''};
  renderVariacao();
  try{
    const defs=[
      {arquivo:'estoque_geral.csv', alvo:'geral', parser:parseEstoqueGeral},
      {arquivo:'estoque_fabrica_manaus.csv', alvo:'fabrica', parser:parseFabricaManaus},
    ];
    for(const d of defs){
      if(!ESTOQUE_TXT[d.alvo]) continue;
      const ant=await ghVersaoAnterior(d.arquivo, ESTOQUE_TXT[d.alvo]);
      if(!ant){ VARIACAO.fontes.push({arquivo:d.arquivo, semAnterior:true}); continue; }
      const itensAnt=parseIsolado(d.parser, ant.txt);
      VARIACAO.linhas.push(...compararEstoque(itensAnt, ESTOQUE_ITENS_ATUAIS[d.alvo]||[]));
      VARIACAO.fontes.push({arquivo:d.arquivo, data:ant.data, sha:ant.sha});
    }
    VARIACAO.linhas.sort((x,y)=>Math.abs(y.dif)-Math.abs(x.dif));
    VARIACAO.estado='ok';
  }catch(e){
    VARIACAO.estado='erro';
    VARIACAO.erro=e.message||String(e);
  }
  renderVariacao();
}

function setFiltroVariacao(f){ VARIACAO.filtro=f; renderVariacao(); }

function renderVariacao(){
  const el=document.getElementById('aud-variacao'); if(!el) return;
  const hdr=`<div class="aud-hdr" style="background:#eff6ff;color:#1d4ed8"><i class="ti ti-arrows-up-down"></i> Variação de estoque vs. atualização anterior</div>`;
  const box=(inner)=>`<div class="aud-block">${hdr}<div style="border:1px solid #bfdbfe;border-top:none;padding:12px 14px;font-size:13px">${inner}</div></div>`;
  if(VARIACAO.estado==='idle'||VARIACAO.estado==='loading'){ el.innerHTML=box('<span style="color:var(--txtm)">Buscando a versão anterior no histórico do GitHub…</span>'); return; }
  if(VARIACAO.estado==='erro'){
    el.innerHTML=box(`⚠️ Não consegui consultar o histórico (${VARIACAO.erro}). Pode ser o limite de requisições do GitHub ou o repositório estar privado. <button onclick="carregarVariacaoEstoque(true)" style="margin-left:8px;padding:3px 10px;border:1px solid var(--brd);border-radius:6px;background:var(--surf);cursor:pointer">Tentar de novo</button>`);
    return;
  }
  const L=VARIACAO.linhas, N=fmt;
  const cont=t=>L.filter(x=>x.tipo===t).length;
  const fontesTxt=VARIACAO.fontes.map(f=>f.semAnterior
    ? `<b>${f.arquivo}</b>: sem versão anterior diferente no histórico`
    : `<b>${f.arquivo}</b>: versão de ${f.data.toLocaleString('pt-BR')} (commit ${f.sha})`).join(' · ');
  const chip=(k,lbl,n)=>`<button onclick="setFiltroVariacao('${k}')" style="padding:4px 10px;border:1px solid ${VARIACAO.filtro===k?'#1d4ed8':'var(--brd)'};border-radius:999px;background:${VARIACAO.filtro===k?'#dbeafe':'var(--surf)'};font-size:12px;cursor:pointer;margin-right:6px">${lbl} (${n})</button>`;
  const vis=VARIACAO.filtro==='todos'?L:L.filter(x=>VARIACAO.filtro==='sobem'?(x.tipo==='subiu'||x.tipo==='novo'):(x.tipo==='caiu'||x.tipo==='saiu'));
  const tag={subiu:'',caiu:'',novo:' <span style="font-size:10px;color:#1d4ed8">(novo)</span>',saiu:' <span style="font-size:10px;color:#991b1b">(saiu do arquivo)</span>'};
  const linhas=vis.map(x=>`<tr><td style="font-family:'DM Mono',monospace;font-weight:700">${x.codigo}</td>
    <td>${tr(x.nome,48)}${tag[x.tipo]}</td><td>${x.wh}</td>
    <td style="text-align:right;font-family:'DM Mono',monospace;color:var(--txtm)">${N(x.ant)}</td>
    <td style="text-align:right;font-family:'DM Mono',monospace">${N(x.atu)}</td>
    <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:700;color:${x.dif>0?'var(--grn-d)':'var(--red)'}">${x.dif>0?'+':''}${N(x.dif)}</td></tr>`).join('');
  const corpo = L.length ? `
      <div style="margin-bottom:8px">${chip('todos','Todos',L.length)}${chip('sobem','Aumentaram / novos',cont('subiu')+cont('novo'))}${chip('caem','Diminuíram / saíram',cont('caiu')+cont('saiu'))}</div>
      <div style="max-height:420px;overflow:auto;border:1px solid var(--brd);border-radius:8px">
        <table class="aud-tbl" style="width:100%"><tr style="background:#f8fafc;position:sticky;top:0"><th>Código</th><th>Produto</th><th>Armazém</th><th style="text-align:right">Anterior</th><th style="text-align:right">Atual</th><th style="text-align:right">Variação</th></tr>${linhas}</table>
      </div>` : '<span style="color:var(--grn-d)">Nenhuma diferença de quantidade entre as duas versões.</span>';
  el.innerHTML=box(`<div style="font-size:11px;color:var(--txtm);margin-bottom:8px">Comparando com: ${fontesTxt||'—'}</div>${corpo}`);
}

function setStatus(s){
  const d=document.getElementById('sdot'), t2=document.getElementById('stxt');
  if(!d) return; d.className='dot';
  if(s==='ok'){d.classList.add('dot-g');t2.textContent='Base Atualizada';}
  else if(s==='warn'){d.classList.add('dot-a');t2.textContent='Dados parciais — verifique alertas';}
  else if(s==='loading'){d.classList.add('dot-a');t2.textContent='Carregando...';}
  else{d.classList.add('dot-r');t2.textContent='Erro ao carregar';}
}
function showErr(m){
  document.getElementById('ld-area').style.display='none';
  const e=document.getElementById('err-area'); e.style.display='block';
  e.innerHTML=`<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:16px;display:flex;gap:10px">
    <i class="ti ti-alert-circle" style="font-size:18px;color:#dc2626"></i>
    <div>${m}<br><button onclick="boot()" style="margin-top:8px;padding:5px 12px;background:var(--pri);color:#fff;border:none;border-radius:6px;cursor:pointer">Tentar novamente</button></div>
  </div>`;
  setStatus('err');
}
function renderSrcAlerts(){
  const el=document.getElementById('src-alerts');
  if(!SRC_ALERTS.length){ if(el) el.style.display='none'; return; }
  el.innerHTML=SRC_ALERTS.map(a=>`<div style="padding:8px 16px;background:#fffbeb;border-bottom:1px solid #fcd34d;font-size:12px;color:#92400e">
    <i class="ti ti-alert-triangle"></i> <b>${a.fonte}</b> — ${a.msg}</div>`).join('');
  el.style.display='block';
}

// ══ BOOT ══
const RESERVAS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3uDoajQWkalh8Tgks3Vl9G_hS8LHt19wtVmK33LydkfHE7fHBFVE4U3ajgbwVIpyaFiSLeOSYWGi5/pub?gid=577818960&single=true&output=csv';
const PEDIDOS_CSV_URL = 'https://raw.githubusercontent.com/smlivoltek/Pedidos-Livoltek/main/pedidos.csv';
const DATA_CORTE_FATURADOS = new Date(2026, 6, 8); // 08/07/2026 — saldo do inventário já está líquido de tudo faturado até 07/07/2026 (inclusive), então só conta faturados a partir de 08/07 pra não abater 2x

// FATURADOS: { codigo -> { wh, qtd, pedidos:[] } } — abatido do estoque nos cards
let FAT = {};
let EXP_RAW = []; // linhas brutas dos SKUs de exportação (todos os ARMZ)

// Nomes dos sub-armazéns mais comuns
const ARMZ_NOMES = {
  7: 'Estoque Comercial', 8: 'Garantia', 12: 'Reparo',
  16: 'Scrap', 24: 'Trânsito', 60: 'Exportação', 28: 'Projetos',
};
// ARMZ excluídos da aba Exportação: garantia, reparo e scrap
const ARMZ_EXCLUIR_EXP = new Set([8, 12, 16]);

async function boot(){
  setStatus('loading');
  document.getElementById('ld-area').style.display='flex';
  document.getElementById('err-area').style.display='none';
  document.getElementById('mc').style.display='none';
  ST=[]; RES=[]; FAT={}; EXP_RAW=[];
  SRC_ALERTS.length=0;
  VAL_SEM_CADASTRO=[];VAL_INCOMPLETO=[];VAL_WH_INVALIDO=[];VAL_INSUFICIENTE=[];VAL_NEGATIVO=[];VAL_DUPLICADO=[];VAL_RES_SEM_ARMAZEM=[];VAL_RES_CODIGO_INVALIDO=[];

  const prog=txt=>{ const el=document.getElementById('lprog'); if(el) el.textContent=txt; };

  const fetchComTimeout=async(url,segundos=8)=>{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),segundos*1000);
    try{
      const r=await fetch(url,{cache:'no-store',signal:ctrl.signal}); clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP '+r.status+(r.status===403?' — planilha não está pública':''));
      return await r.text();
    }catch(e){ clearTimeout(timer); throw e.name==='AbortError'?new Error('Timeout após '+segundos+'s'):e; }
  };

  // 1. Armazéns — mapa fixo (armazens.csv foi excluído do repositório)
  WH_LIST.length=0;
  WH_LIST.push('Curitiba (Eletra)','Fortaleza (Eletra)','Manaus (Eletra)','Fábrica Livoltek');
  WH_COLOR['Curitiba (Eletra)']='#374151';
  WH_COLOR['Fortaleza (Eletra)']='#374151';
  WH_COLOR['Manaus (Eletra)']='#374151';
  WH_COLOR['Fábrica Livoltek']='#2563eb';
  WH_ICON['Curitiba (Eletra)']='ti-building-warehouse';
  WH_ICON['Fortaleza (Eletra)']='ti-building-warehouse';
  WH_ICON['Manaus (Eletra)']='ti-building-warehouse';
  WH_ICON['Fábrica Livoltek']='ti-building-factory-2';
  SRC_TS.armazens=new Date();

  // 2. cadastro_produtos.csv
  // Decodificado como windows-1252 (mesmo motivo do pedidos.csv e dos estoque_*.csv):
  // se o arquivo vier do Excel/TOTVS nesse encoding e for lido com .text() puro (UTF-8),
  // acentos em "Categoria" (ex: MATÉRIA-PRIMA) e "Família" quebram e o isMP para de bater.
  prog('Carregando cadastro_produtos.csv...');
  try{
    const r=await fetch('data/cadastro_produtos.csv',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const txt=new TextDecoder('windows-1252').decode(buf);
    CADASTRO=parseCadastro(txt);
  }catch(e){
    console.error('Erro ao processar cadastro_produtos.csv:', e);
    showErr('<b>data/cadastro_produtos.csv</b>: '+e.message);
    return;
  }

  // 3. Estoques: 2 arquivos — estoque_geral.csv (Fortaleza+Curitiba+Manaus/Eletra, todos os 3
  // armazéns TOTVS via FL) e estoque_fabrica_manaus.csv (aba EXPEDIÇÃO-TOP, formato
  // TOP/HEXING/Coluna6/Saldo Estoque — sistema TopManager da Fábrica, sem relação com o TOTVS).
  // Voltamos a esse formato em 17/09/2026 a pedido da Cristiane. Sem sobreposição entre os
  // dois arquivos — cada um cobre um armazém diferente, então só concatena, sem merge.
  // Ambos em windows-1252 (TOTVS/Excel) — decodificados via arrayBuffer, não .text(),
  // pra não corromper acentos/caracteres especiais (°, ², µ etc.), mesmo problema já visto no pedidos.csv.
  const stItems=[];
  prog('Carregando arquivos de estoque...');
  let geralItems=[], fabricaItems=[];
  const ESTOQUE_FILES=[
    {url:'data/estoque_geral.csv', label:'estoque_geral.csv', parser:parseEstoqueGeral, target:'geral'},
    {url:'data/estoque_fabrica_manaus.csv', label:'estoque_fabrica_manaus.csv', parser:parseFabricaManaus, target:'fabrica'}
  ];
  await Promise.all(ESTOQUE_FILES.map(async f=>{
    try{
      const r=await fetch(f.url,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const buf=await r.arrayBuffer();
      const txt=new TextDecoder('windows-1252').decode(buf);
      ESTOQUE_TXT[f.target]=txt;
      const items=f.parser(txt);
      if(f.target==='geral') geralItems=items; else fabricaItems=items;
    }catch(e){
      SRC_ALERTS.push({fonte:f.label,msg:`Arquivo não encontrado ou inválido: ${e.message}`,ts:new Date()});
    }
  }));
  stItems.push(...geralItems, ...fabricaItems);
  ESTOQUE_ITENS_ATUAIS={geral:geralItems, fabrica:fabricaItems};
  // Produtos únicos por armazém (não confundir com "linhas": um código pode ter mais de uma
  // linha no mesmo arquivo, ex: matéria-prima em ARMZ diferentes já filtrados, ou repetido
  // entre armazéns).
  const produtosPorArmazem = items => {
    const m={};
    items.forEach(i=>{ (m[i.wh]=m[i.wh]||new Set()).add(i.codigo); });
    const out={};
    Object.entries(m).forEach(([wh,set])=>out[wh]=set.size);
    return out;
  };
  // Saldo (quantidade) somado por armazém — o que a Cristiane pediu em 16/09/2026 como base
  // pra conferir se o estoque bate: soma de unidades, não contagem de SKUs.
  const saldoPorArmazem = items => {
    const m={};
    items.forEach(i=>{ m[i.wh]=(m[i.wh]||0)+(i.saldo||0); });
    return m;
  };
  const somaSaldo = items => items.reduce((a,i)=>a+(i.saldo||0),0);
  ESTOQUE_RECONCILIACAO = {
    geralLinhas: geralItems.length,
    geralProdutosUnicos: new Set(geralItems.map(i=>i.codigo)).size,
    geralProdutosPorArmazem: produtosPorArmazem(geralItems),
    geralRemovidasPorMerge: 0,
    resumoLinhas: fabricaItems.length,
    resumoProdutosUnicos: new Set(fabricaItems.map(i=>i.codigo)).size,
    resumoProdutosPorArmazem: produtosPorArmazem(fabricaItems),
    totalLinhasEsperado: geralItems.length + fabricaItems.length,
    totalLinhasST: stItems.length,
    codigosUnicosEsperado: new Set([...geralItems, ...fabricaItems].map(i=>i.codigo)).size,
    produtosPorArmazemEsperado: produtosPorArmazem([...geralItems, ...fabricaItems]),
    saldoPorArmazemEsperado: saldoPorArmazem([...geralItems, ...fabricaItems]),
    saldoTotalEsperado: somaSaldo([...geralItems, ...fabricaItems]),
  };
  SRC_TS.estoque=new Date();
  if(!stItems.length){ showErr('Nenhum produto carregado. Verifique os arquivos de estoque.'); return; }

  // 3.5 Conferência TOTVS x Sistema — overrides_estoque.csv é OPCIONAL.
  // Se não existir no repo ainda, AUD_BASELINE fica vazio e tudo segue lendo TOTVS ao vivo (padrão de hoje).
  AUD_BASELINE={};
  try{
    const rOv=await fetch('data/overrides_estoque.csv',{cache:'no-store'});
    if(rOv.ok) AUD_BASELINE=parseOverridesEstoque(await rOv.text());
  }catch(e){ /* arquivo opcional — silencioso */ }
  carregarDecisoesLocais();
  aplicarAuditBaseline(stItems);

  stItems.push(...linhasFinameZeradas(stItems));
  joinCadastro(stItems);
  ST=stItems;
  VAL_FABRICA_HEXING=auditarHexingFabrica(stItems);
  // Pista, sem ligar nada sozinho: código TOTVS sem cadastro cuja descrição no relatório cita o CODIGO de outro produto do cadastro
  { const m={}; stItems.filter(s=>s.sistema==='TOTVS' && s._semCadastro).forEach(s=>{
      const toks=new Set(String(s.descricao||'').toUpperCase().match(/[A-Z0-9][A-Z0-9\-\.]{4,}/g)||[]);
      const hit=[...toks].find(t=>CADASTRO[t] && t!==String(s.codigo).toUpperCase());
      if(hit){ const o=m[s.codigo]||(m[s.codigo]={codigo:s.codigo,descricao:s.descricao||'',produto:hit,qtd:0}); o.qtd+=s.saldo; } });
    VAL_TOTVS_DUP=Object.values(m); }
  { const m={}; stItems.filter(s=>s.wh==='Fábrica Livoltek' && s._semCadastro).forEach(s=>{ const o=m[s.codigo]||(m[s.codigo]={top:s.codigo,hexing:s.hexing||'',produto:(CADASTRO[s.hexing]||{}).codigo?((CADASTRO[s.hexing].titulo)||CADASTRO[s.hexing].codigo):'',qtd:0}); o.qtd+=s.saldo; }); VAL_TOP_FORA=Object.values(m); }
  // Códigos únicos "esperados": contados depois da unificação TOP local → Hexing (senão a conferência
  // da Auditoria acusaria falta falsa, porque o mesmo produto passa a ser um código só).
  if(ESTOQUE_RECONCILIACAO){
    ESTOQUE_RECONCILIACAO.codigosUnicosEsperado=new Set([...geralItems,...fabricaItems].map(i=>i.codigo)).size;
    ESTOQUE_RECONCILIACAO.produtosPorArmazemEsperado=produtosPorArmazem([...geralItems,...fabricaItems]);
  }

  // 4. Reservas — Google Sheets em tempo real (com fallback local)
  if(RESERVAS_SHEET_URL){
    prog('Carregando Reservas...');
    try{
      RES=parseReservasSheets(await fetchComTimeout(RESERVAS_SHEET_URL));
    }catch(e){
      SRC_ALERTS.push({fonte:'Reservas (Google Sheets)',msg:e.message+'. Usando reserva.csv local como fallback.',ts:new Date()});
      try{
        const rb=await fetch('data/reserva.csv',{cache:'no-store'});
        if(rb.ok){ RES=parseReservasLocal(await rb.text()); SRC_TS.reservas=new Date(); }
      }catch(e2){}
    }
  } else {
    try{
      const r=await fetch('data/reserva.csv',{cache:'no-store'});
      if(r.ok){ RES=parseReservasLocal(await r.text()); SRC_TS.reservas=new Date(); }
    }catch(e){}
  }

  applyReservas();
  validateAll();
  renderSrcAlerts();

  populateSelects();
  document.getElementById('ld-area').style.display='none';
  document.getElementById('mc').style.display='block';

  // 5. Pedidos Faturados — busca do repositório Pedidos-Livoltek
  // ══ TEMPORARIAMENTE DESATIVADO (a pedido da Cristiane em 22/07/2026) ══
  // Revisão do relatório: por ora considerar só o arquivo de estoque (ARMZ=07,
  // ESTOQUE DISPONIVEL), sem descontar pedidos faturados.
  // Pra reativar: trocar false por true abaixo.
  const FATURADOS_ATIVOS = false;
  FAT = {};
  if (FATURADOS_ATIVOS) {
    prog('Carregando pedidos faturados...');
    try{
      const fatText = await fetchComTimeout(PEDIDOS_CSV_URL, 10);
      FAT = parsePedidosFaturados(fatText);
      const nFat = Object.keys(FAT).length;
      if(nFat) console.log(`📋 Pedidos faturados: ${nFat} combinações produto+armazém desde ${DATA_CORTE_FATURADOS.toLocaleDateString('pt-BR')}`);
    }catch(e){
      SRC_ALERTS.push({fonte:'pedidos.csv (faturados)',msg:'Não foi possível carregar: '+e.message,ts:new Date()});
    }
    // Descontar faturados do disponível (Disponível = Saldo - Reserva - Faturado)
    applyFaturados();
    // Revalida: sem isso, divergências causadas só pelo faturado (ex: saldo 0 + faturado > 0)
    // ficariam de fora da Auditoria, pois validateAll() já tinha rodado antes dos faturados existirem
    validateAll();
  }

  // 6. Data de atualização: data do CSV mais recente via GitHub API
  prog('Verificando data dos dados...');
  let dataCSV = null;
  try{
    const OWNER='smlivoltek', REPO='livoltek';
    // Data do commit mais recente entre os 2 CSVs de estoque
    const estoqueFiles=['data/estoque_geral.csv','data/estoque_fabrica_manaus.csv'];
    const datas = await Promise.all(estoqueFiles.map(async f=>{
      try{
        const resp=await fetchComTimeout(`https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${f}&per_page=1`,5);
        const commits=JSON.parse(resp);
        const iso=commits[0]?.commit?.committer?.date||commits[0]?.commit?.author?.date;
        return iso ? new Date(iso) : null;
      }catch(e){ return null; }
    }));
    const maisRecente = datas.filter(Boolean).sort((a,b)=>b-a)[0];
    if(maisRecente){
      dataCSV = maisRecente.toLocaleDateString('pt-BR')+' '+maisRecente.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){ /* silencioso — fallback abaixo */ }

  document.getElementById('ld-area').style.display='none';
  document.getElementById('mc').style.display='block';

  // Timestamp: data real do último commit > data local de quando os dados mudaram
  const _sig = ST.length+'|'+ST.reduce((a,r)=>a+r.saldo,0).toFixed(0)+'|'+RES.length;
  const _prevSig = localStorage.getItem('livoltek_estoque_sig')||'';
  let _ts;
  if(dataCSV){
    _ts = dataCSV; // prefere data real do GitHub
    try{localStorage.setItem('livoltek_estoque_sig',_sig);localStorage.setItem('livoltek_estoque_ts',_ts);}catch(e){}
  } else if(_sig!==_prevSig){
    const now=new Date();
    _ts=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    try{localStorage.setItem('livoltek_estoque_sig',_sig);localStorage.setItem('livoltek_estoque_ts',_ts);}catch(e){}
  } else {
    _ts=localStorage.getItem('livoltek_estoque_ts')||'—';
  }
  document.getElementById('sync-t').textContent=_ts;
  setStatus((SRC_ALERTS.length||VAL_RES_SEM_ARMAZEM.length||VAL_RES_CODIGO_INVALIDO.length)?'warn':'ok');

  rDash(); rAll();
  ['inv','ev','bess','kit','strbox','div','mot','mp'].forEach(tb=>renderCat(tb));
  rExp(); rRes(); updateSidebar(); rAudit();
}

document.addEventListener('DOMContentLoaded', ()=>{
  applyTranslations();
  boot();
});

// Auto-refresh a cada 3 horas
setInterval(()=>{ boot(); }, 3*60*60*1000);
