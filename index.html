<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Estoque - SM Livoltek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cor-azul:#2563eb; --cor-verde:#16a34a; --cor-laranja:#f59e0b; --cor-vermelho:#dc2626;
  --pri:#2563eb; --pri-pale:#eff6ff; --grn-d:#16a34a; --grn-pale:#dcfce7;
  --amb-d:#b45309; --amb-pale:#fef3c7; --red:#dc2626; --red-pale:#fee2e2;
  --pur:#7c3aed; --bg:#f5f6f8; --surf:#fff; --brd:#e5e7eb; --txt:#111827;
  --txt2:#374151; --txtm:#6b7280; --cwb:#2563eb; --for:#0d9488; --mao-e:#ea580c; --mao-l:#7c3aed;
  --blu:#2563eb;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-g{background:#22C55E;animation:pulse 2s infinite}
.dot-r{background:#EF4444}
.dot-a{background:#F59E0B;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Topbar ── */
.topbar{height:60px;background:#0f172a;color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand-mark{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(37,99,235,.25);
  border:1px solid rgba(96,165,250,.4);border-radius:5px;padding:4px 10px}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.topbar-sub{font-size:11px;color:#94a3b8}
.topbar-right{display:flex;align-items:center;gap:14px}
.sbadge{display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1}
.sync-lbl{font-size:11px;color:#64748b}
.btn-icon{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-icon:hover{background:rgba(255,255,255,.15)}
.mob-menu-btn{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

/* ── Language selector ── */
.lang-selector{position:relative}
.lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lang-menu{display:none;position:absolute;top:110%;right:0;background:#fff;border:1px solid #e5e7eb;
  border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:150px;z-index:100;overflow:hidden}
.lang-menu.open{display:block}
.lang-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;
  border:none;background:#fff;color:#111;cursor:pointer}
.lang-menu button:hover{background:#f3f4f6}

/* ── Layout ── */
.body{display:flex;height:calc(100vh - 60px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--brd);overflow-y:auto;flex-shrink:0;
  display:flex;flex-direction:column;padding:14px 0;transition:transform .25s}
.sb-sec{margin-bottom:6px}
.sb-lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;
  padding:10px 18px 4px}
.sb-div{height:1px;background:var(--brd);margin:8px 16px}
.sbi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:10px 18px;font-size:13px;color:#374151;cursor:pointer;text-align:left;position:relative}
.sbi:hover{background:#f8fafc}
.sbi.on{background:var(--pri-pale);color:var(--pri);font-weight:600}
.sbi.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pri)}
.si{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.sn{flex:1}
.sc{font-size:11px;background:#f1f5f9;color:#64748b;border-radius:10px;padding:1px 7px;font-weight:600}
.sbi.on .sc{background:#dbeafe;color:var(--pri)}

#mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#mob-overlay.open{display:block}

.content{flex:1;overflow-y:auto;padding:22px 26px}
.tab{display:none}
.tab.on{display:block}

/* ── Cards / KPIs ── */
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kcard{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:16px 18px}
.kcard-lbl{font-size:11px;color:var(--txtm);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
.kcard-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;margin-top:4px}

/* ── Cards de produto (pc2) ── */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:.625rem;align-items:stretch}
/* card consolidado (1 produto comercial = 1 card, com os códigos TOP nacional, TOP importado e TOTVS) */
.pc3-meta{font-size:11px;color:var(--txt2);margin-top:2px}
.pc3-codes{padding:.5rem 1rem;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:5px}
.pc3-cr{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:8px;align-items:center}
.pc3-cl{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--txtm);text-transform:uppercase}
.pc3-cl small{display:block;font-size:9px;font-weight:400;letter-spacing:0;text-transform:none}
.pc3-cv{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--txt);word-break:break-all;text-align:right}
.pc3-cv.vz{color:var(--txtm);font-weight:400}
.pc3-cp{border:1px solid var(--brd);background:var(--surf);border-radius:6px;width:24px;height:24px;cursor:pointer;color:var(--txtm);display:flex;align-items:center;justify-content:center;font-size:12px;padding:0}
.pc3-cp:hover{border-color:var(--pri);color:var(--pri)}
.pc3-cp.ok{border-color:var(--grn-d);color:var(--grn-d)}
.pc3-tbl{padding:.375rem 1rem .5rem;border-top:1px solid var(--brd);flex:1}
.pc3-th,.pc3-tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 50px 54px;gap:6px;align-items:center}
.pc3-th{font-size:10px;font-weight:600;color:var(--txtm);padding-bottom:4px;border-bottom:1px solid var(--brd);margin-bottom:2px}
.pc3-th span:not(:first-child),.pc3-tr .n{text-align:right}
.pc3-tr{padding:4px 0;border-top:1px solid var(--brd)}
.pc3-tr:first-of-type{border-top:none}
.pc3-wn{font-size:12px;font-weight:500;color:var(--txt);display:flex;gap:5px;align-items:center}
.pc3-cd{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;margin-top:1px}
.pc3-cdc{font-family:'DM Mono',monospace;font-size:10px;color:var(--txtm);overflow-wrap:anywhere}
.pc3-fin{display:inline-block;font-size:9px;font-weight:700;padding:0 6px;border-radius:4px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;white-space:nowrap;margin-right:6px}
.pc3-cds{font-size:9px;font-weight:600;padding:0 6px;border-radius:4px;background:#f1f5f9;color:var(--txt2);white-space:nowrap}
.pc3-tot .pc2-total-row{color:var(--txtm)}
.pc3-tot .pc2-total-row span:last-child{color:var(--txtm);font-weight:400}
.pc3-tr .n{font-family:'DM Mono',monospace;font-size:12px}
.pc3-tr.z .pc3-wn,.pc3-tr.z .n,.pc3-tr.z .pc3-cd{color:var(--txtm);font-weight:400}


.pc2{background:var(--surf);border:1px solid var(--brd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.pc2-top{padding:.75rem 1rem .375rem}
.pc2-id{display:flex;gap:10px;align-items:flex-start}
.pc2-id-txt{min-width:0;flex:1}
.pc2-foto{position:relative;width:64px;height:64px;flex:none;background:#fff;border:1px solid var(--brd);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--txtm);font-size:22px}
.pc2-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pc2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.pc2-nom{font-size:11px;font-weight:400;color:var(--txtm);line-height:1.4;margin-top:4px;word-break:break-word;
  min-height:5.6em}
.pc2-pill{font-size:9px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;
  display:inline-block;margin-bottom:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.pc2-cod{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--txt);margin-top:0;letter-spacing:-.01em}
.pc2-disp-block{padding:.25rem 1rem .5rem}
.pc2-disp-lbl{font-size:9px;font-weight:700;color:var(--grn-d);text-transform:uppercase;letter-spacing:.05em}
.pc2-disp-val{font-family:'DM Mono',monospace;font-size:32px;font-weight:700;line-height:1}
.pc2-wh-list{padding:.375rem 1rem .5rem;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:3px;flex:1}
.pc2-wh-row{display:flex;align-items:center;gap:7px}
.pc2-wh-row.pc2-wh-zero{opacity:.4}
.pc2-wh-name{flex:1;font-size:12px;color:var(--txt2)}
.pc2-wh-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--txt)}
.pc2-wh-head{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txtm);padding-bottom:2px}
.pc2-wh-head .pc2-wh-name{font-size:9.5px;color:var(--txtm)}
.pc2-wh-col{width:58px;text-align:right}
.pc2-wh-sal{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--txtm);width:58px;text-align:right}
.pc2-wh-disp{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;width:58px;text-align:right}
.pc2-no-stock{font-size:11px;color:var(--txtm)}
.pc2-totals{padding:.375rem 1rem .5rem;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:3px}
.pc2-total-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2)}
.pc2-total-row span:last-child{font-family:'DM Mono',monospace;font-weight:600;color:var(--txt)}
.pc2-res{color:var(--pur)!important}.pc2-res span:last-child{color:var(--pur)!important}
.pc2-fat{color:var(--cor-laranja)!important}.pc2-fat span:last-child{color:var(--cor-laranja)!important}
.pc2-note{font-size:9px;color:var(--txtm);margin-top:2px;font-style:italic}
.pc2-cli-toggle{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;
  border-top:1px solid var(--brd);font-size:11px;color:var(--txtm);cursor:pointer;background:var(--bg);user-select:none}
.pc2-cli-toggle:hover{background:var(--brd)}
.pc2-cli-row{display:flex;justify-content:space-between;align-items:center;padding:5px 1rem;
  border-bottom:1px solid var(--brd);font-size:12px}
.pc2-cli-row:last-child{border-bottom:none}
.pc2-cli-nome{color:var(--txt);font-weight:500}
.pc2-cli-qtd{font-family:'DM Mono',monospace;font-weight:700;color:var(--pur)}

.mp-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--red);
  background:var(--red-pale);border-radius:5px;padding:2px 7px;margin-bottom:5px}
.pc.mp{border-left:3px solid var(--red)}

/* ── Filtros ── */
.fb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sbar{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surf);
  border:1px solid var(--brd);border-radius:8px;padding:8px 12px}
.sbar input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit}
.sel{padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:13px;background:var(--surf);
  font-family:inherit;cursor:pointer}

/* ── Pills de família (sub-categoria dinâmica via cadastro_produtos) ── */
.fam-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fam-pill{padding:6px 13px;border:1px solid var(--brd);border-radius:999px;background:var(--surf);
  font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;font-family:inherit;white-space:nowrap}
.fam-pill:hover{border-color:var(--pri);color:var(--pri)}
.fam-pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.fam-pill .fam-n{font-weight:400;font-size:10px;color:var(--txtm);margin-left:4px}
.fam-pill.on .fam-n{color:#fff}
.fam-sub{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 2px;padding:2px 0 2px 10px;border-left:3px solid var(--pri)}
.fam-sub-lbl{font-size:11px;font-weight:700;color:var(--pri);margin-right:2px}
.fam-pill.finame{background:#fef3c7;border-color:#fcd34d;color:#92400e;font-weight:700}
.fam-pill.finame:hover{border-color:#f59e0b;color:#92400e}
.fam-pill.finame.on{background:#f59e0b;border-color:#f59e0b;color:#fff}

/* ── Auditoria ── */
.aud-block{margin-bottom:20px}
.aud-hdr{font-size:14px;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;
  display:flex;align-items:center;gap:8px}
.aud-tbl{width:100%;border-collapse:collapse;font-size:12px}
.aud-tbl th{text-align:left;padding:6px 12px;font-size:10px;text-transform:uppercase;color:#64748b;background:#f8fafc}
.aud-tbl td{padding:6px 12px;border-top:1px solid var(--brd)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}

@media(max-width:700px){
  .sidebar{position:fixed;top:60px;left:0;bottom:0;z-index:50;transform:translateX(-100%);box-shadow:2px 0 12px rgba(0,0,0,.15)}
  .sidebar.mob-open{transform:translateX(0)}
  .mob-menu-btn{display:block}
  .content{padding:14px}
  .k4{grid-template-columns:1fr 1fr;gap:8px}
  .kcard{padding:12px}
  .kcard-val{font-size:20px}
  #sb-audit{display:none}
  #dash-top10-fam{grid-template-columns:1fr!important}
}
@media(max-width:420px){ .k4{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <button class="mob-menu-btn" onclick="toggleMobMenu()"><i class="ti ti-menu-2"></i></button>
    <div>
      <div class="brand-mark">SM Livoltek</div>
      <div class="topbar-title" data-i18n="title">Dashboard de Estoque</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="sbadge"><span class="dot dot-a" id="sdot"></span><span id="stxt">Carregando...</span></div>
    <span class="sync-lbl">Última atualização: <span id="sync-t"></span></span>
    <button class="btn-icon" onclick="boot()"><i class="ti ti-refresh"></i></button>
    <div class="lang-selector">
      <button class="lang-btn" onclick="toggleLangMenu()">
        <i class="ti ti-language"></i> <span id="langCurrentLabel">Português</span>
      </button>
      <div id="langMenu" class="lang-menu">
        <button onclick="setLang('pt')">🇧🇷 Português</button>
        <button onclick="setLang('en')">🇺🇸 English</button>
      </div>
    </div>
  </div>
</div>

<div id="mob-overlay" onclick="closeMobMenu()"></div>
<div id="src-alerts" style="display:none"></div>

<div class="body">
  <div class="sidebar" id="sidebar">
    <div class="sb-sec">
      <button class="sbi on" id="sb-dash" onclick="go('dash')">
        <i class="ti ti-layout-dashboard si"></i><span class="sn" data-i18n="navDash">Dashboard</span>
      </button>
      <button class="sbi" id="sb-todos" onclick="go('todos')">
        <i class="ti ti-list si"></i><span class="sn" data-i18n="navTodos">Todos</span><span class="sc" id="sc-todos">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-lbl" data-i18n="navCategorias">Categorias</div>
      <button class="sbi" id="sb-inv" onclick="go('inv')">
        <i class="ti ti-bolt si"></i><span class="sn" data-i18n="navInv">Inversores</span><span class="sc" id="sc-inv">—</span>
      </button>
      <button class="sbi" id="sb-ev" onclick="go('ev')">
        <i class="ti ti-charging-pile si"></i><span class="sn" data-i18n="navEv">Carregadores EV</span><span class="sc" id="sc-ev">—</span>
      </button>
      <button class="sbi" id="sb-bess" onclick="go('bess')">
        <i class="ti ti-battery-charging si"></i><span class="sn" data-i18n="navBess">BESS / Baterias</span><span class="sc" id="sc-bess">—</span>
      </button>
      <button class="sbi" id="sb-kit" onclick="go('kit')">
        <i class="ti ti-sun si"></i><span class="sn" data-i18n="navKit">Kit Solar</span><span class="sc" id="sc-kit">—</span>
      </button>
      <button class="sbi" id="sb-strbox" onclick="go('strbox')">
        <i class="ti ti-rotate-2 si"></i><span class="sn" data-i18n="navStrbox">String Box</span><span class="sc" id="sc-strbox">—</span>
      </button>
      <button class="sbi" id="sb-div" onclick="go('div')">
        <i class="ti ti-category si"></i><span class="sn" data-i18n="navDiv">Diversos</span><span class="sc" id="sc-div">—</span>
      </button>
      <button class="sbi" id="sb-mot" onclick="go('mot')">
        <i class="ti ti-propeller si"></i><span class="sn" data-i18n="navMot">Motor de Barco</span><span class="sc" id="sc-mot">—</span>
      </button>
      <button class="sbi" id="sb-mp" onclick="go('mp')">
        <i class="ti ti-building-factory-2 si"></i><span class="sn" data-i18n="navMp">Matéria-Prima</span><span class="sc" id="sc-mp">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-lbl" data-i18n="navComercial">Comercial</div>
      <button class="sbi" id="sb-exp" onclick="go('exp')">
        <i class="ti ti-ship si"></i><span class="sn" data-i18n="navExp">Exportação</span>
      </button>
      <button class="sbi" id="sb-res" onclick="go('res')">
        <i class="ti ti-handshake si"></i><span class="sn" data-i18n="navRes">Reservas</span><span class="sc" id="sc-res">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <button class="sbi" id="sb-audit" onclick="go('audit')">
        <i class="ti ti-shield-check si"></i><span class="sn" data-i18n="navAudit">Auditoria</span>
      </button>
    </div>
  </div>

  <div class="content" id="content">
    <div id="ld-area" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:14px">
      <div style="width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite"></div>
      <div id="lprog" style="font-size:13px;color:var(--txtm)" data-i18n="loadingMsg">Carregando dados...</div>
    </div>
    <div id="err-area" style="display:none"></div>
    <div id="mc" style="display:none">

      <!-- ══ DASHBOARD ══ -->
      <div id="tab-dash" class="tab on">
        <div id="dash-cat" style="margin-bottom:20px"></div>
        <div class="k4" id="dash-wh"></div>
        <div id="dash-top10"></div>
        <div id="dash-top10-fam" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px"></div>
      </div>

      <!-- ══ TODOS ══ -->
      <div id="tab-todos" class="tab">
        <div class="fam-pills" id="todos-pills"></div>
        <div class="fb">
          <div class="sbar"><i class="ti ti-search"></i><input id="todos-q" placeholder="Nome, modelo, potência ou código..." data-i18n-placeholder="searchPh" oninput="renderCat('todos')"></div>

<script>
// ══ CONFIG
const SRC_TS = { estoque:null, cadastro:null, armazens:null, reservas:null };
// Contagens brutas de cada fonte de estoque, capturadas no boot(), pra conferir na Auditoria
// se "total de itens no arquivo" bate com "total de itens no dashboard" (linha a linha, sem
// nada se perder no meio do caminho — merge, cadastro, dedup etc.)
let ESTOQUE_RECONCILIACAO = null;
const SRC_ALERTS = [];
let WH_MAP = {};
const WH_NAMES = {
  '10108':'Curitiba (Eletra)','10102':'Fortaleza (Eletra)','10106':'Manaus (Eletra)','1010':'Fábrica Livoltek',
};
const WH_LIST  = ['Curitiba (Eletra)','Fortaleza (Eletra)','Manaus (Eletra)','Fábrica Livoltek'];
const WH_COLOR = {'Curitiba (Eletra)':'var(--cwb)','Fortaleza (Eletra)':'var(--for)','Manaus (Eletra)':'var(--mao-e)','Fábrica Livoltek':'var(--mao-l)'};
const WH_ICON  = {'Curitiba (Eletra)':'ti-building-warehouse','Fortaleza (Eletra)':'ti-building-warehouse','Manaus (Eletra)':'ti-building-warehouse','Fábrica Livoltek':'ti-building-factory-2'};

let ST=[], RES=[], CADASTRO={}, CADASTRO_TOP={}, CADASTRO_NACTOP={}, CADASTRO_ALT={}, CADASTRO_NOM={}, MODO='novo';
let VAL_SEM_DESCRICAO=[], VAL_SEM_CADASTRO=[], VAL_INCOMPLETO=[], VAL_WH_INVALIDO=[], VAL_INSUFICIENTE=[], VAL_NEGATIVO=[], VAL_DUPLICADO=[], VAL_RES_SEM_ARMAZEM=[], VAL_RES_CODIGO_INVALIDO=[], VAL_FABRICA_HEXING=[], VAL_TOP_REPETIDO=[], VAL_TOP_FORA=[], VAL_TOTVS_DUP=[];

// ══ CONFERÊNCIA TOTVS x SISTEMA ══
// AUD_BASELINE: baseline "travada" por codigo|armazem, lida de data/overrides_estoque.csv (opcional).
//   Enquanto existir baseline pra um codigo|armazem, o Saldo usado em TODO o dashboard (cards, abas,
//   disponível) é o valor TRAVADO, não o TOTVS lido ao vivo — só muda quando você decide "Aceitar TOTVS".
// AUD_DECISIONS: decisões em rascunho (localStorage), aguardando o download de "Baixar validações".
let AUD_BASELINE={}, AUD_DECISIONS={}, AUD_DIVERGENTES=[];
// Tags FINAME e Exportação-S/AFCI vêm do cadastro_produtos.csv (decisão da Cristiane):
//   coluna NACIONAL    marcada → produto nacional, elegível a FINAME  (tag ⭐ FINAME)
//   coluna EXPORTAÇÃO  marcada → equipamento de exportação sem AFCI   (tag Exportação-S/AFCI)
// "Marcada" = qualquer valor preenchido (X, S, SIM, 1...), exceto negativas explícitas
// (NÃO, N, 0, FALSO, -). Célula vazia = não. Mantém tudo numa tabela só: o cadastro.
const celulaMarcada = v=>{
  const t=String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  return t!=='' && !['NAO','N','0','FALSE','FALSO','-'].includes(t);
};
const AUD_KEY = (codigo,wh)=>`${codigo}|${wh}`;
const AUD_LS_KEY = 'livoltek_audit_decisions';

function parseOverridesEstoque(csv){
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:true,skipEmptyLines:true,delimiter:';'}).data;
  const map={};
  all.forEach(r=>{
    const codigo=String(r['codigo']||'').trim().toUpperCase();
    const wh=String(r['armazem']||'').trim();
    if(!codigo||!wh) return;
    map[AUD_KEY(codigo,wh)]={
      saldo: pn(r['saldo_validado']),
      decisao: String(r['decisao']||'').trim(),
      data: String(r['data']||'').trim()
    };
  });
  return map;
}

function carregarDecisoesLocais(){
  try{ AUD_DECISIONS = JSON.parse(localStorage.getItem(AUD_LS_KEY)||'{}'); }catch(e){ AUD_DECISIONS={}; }
}

function setDecisaoAudit(codigo, wh, decisao){
  const k=AUD_KEY(codigo,wh);
  const item=ST.find(s=>s.codigo===codigo&&s.wh===wh);
  AUD_DECISIONS[k]={
    decisao,
    saldoAnterior: AUD_BASELINE[k]?AUD_BASELINE[k].saldo:null,
    saldoTotvsAtual: item?item._saldoTotvsAtual??item.saldo:null,
    ts: new Date().toISOString()
  };
  try{ localStorage.setItem(AUD_LS_KEY, JSON.stringify(AUD_DECISIONS)); }catch(e){}
  rAudit();
}

// Aplica a baseline travada no array de itens (ANTES de reservas/faturados),
// e guarda o valor TOTVS ao vivo em _saldoTotvsAtual só pra fins de comparação/exibição.
function aplicarAuditBaseline(items){
  AUD_DIVERGENTES=[];
  items.forEach(it=>{
    const k=AUD_KEY(it.codigo,it.wh);
    it._saldoTotvsAtual = it.saldo; // valor lido agora do TOTVS
    const base=AUD_BASELINE[k];
    if(!base) return; // sem baseline travada → segue lendo TOTVS ao vivo (comportamento padrão)
    if(base.saldo!==it.saldo){
      AUD_DIVERGENTES.push({codigo:it.codigo, wh:it.wh, descricao:it.nomenclatura||it.descricao, saldoSistema:base.saldo, saldoTotvs:it.saldo});
    }
    it.saldo = base.saldo; // trava o saldo usado no resto do dashboard
  });
}

function baixarValidacoesEstoque(){
  const linhas=['codigo;armazem;saldo_validado;decisao;data'];
  const hoje=new Date().toLocaleDateString('pt-BR');
  const chaves=new Set([...Object.keys(AUD_BASELINE), ...Object.keys(AUD_DECISIONS)]);
  chaves.forEach(k=>{
    const [codigo,wh]=k.split('|');
    const dec=AUD_DECISIONS[k];
    const base=AUD_BASELINE[k];
    let saldo, decisao, data;
    if(dec){
      decisao=dec.decisao;
      data=hoje;
      saldo = dec.decisao==='aceitar_totvs' ? dec.saldoTotvsAtual : (base?base.saldo:dec.saldoTotvsAtual);
    } else if(base){
      saldo=base.saldo; decisao=base.decisao; data=base.data;
    } else return;
    linhas.push(`${codigo};${wh};${saldo};${decisao};${data}`);
  });
  const blob=new Blob([linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='overrides_estoque.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
let AUDIT_INCOMPLETO_ATIVO=false;
const resExpanded = new Set();

// ── i18n ──
const I18N = {
  pt: {
    title:'Dashboard de Estoque', navDash:'Dashboard', navTodos:'Todos', navCategorias:'Categorias',
    navInv:'Inversores', navEv:'Carregadores EV', navBess:'BESS / Baterias', navKit:'Kit Solar',
    navStrbox:'String Box', navDiv:'Diversos', navMot:'Motor de Barco', navMp:'Matéria-Prima',
    navComercial:'Comercial', navExp:'Exportação',
        navRes:'Reservas', navAudit:'Auditoria',
    searchPh:'Nome, modelo, potência ou código...', optTodosArm:'Todos os armazéns', loadingMsg:'Carregando dados...'
  },
  en: {
    title:'Inventory Dashboard', navDash:'Dashboard', navTodos:'All Products', navCategorias:'Categories',
    navInv:'Inverters', navEv:'EV Chargers', navBess:'BESS / Batteries', navKit:'Solar Kit',
    navStrbox:'String Box', navDiv:'Others', navMot:'Boat Motor', navMp:'Raw Material',
    navComercial:'Commercial', navExp:'Export',
        navRes:'Bookings', navAudit:'Audit',
    searchPh:'Name, model, power or code...', optTodosArm:'All warehouses', loadingMsg:'Loading data...'
  }
};
let currentLang = localStorage.getItem('livoltek_estoque_lang')||'pt';
function t(key){ return (I18N[currentLang]&&I18N[currentLang][key]) ?? (I18N.pt[key] ?? key); }
function applyTranslations(){
  document.documentElement.lang = currentLang==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.getAttribute('data-i18n-placeholder')));
  const lbl=document.getElementById('langCurrentLabel'); if(lbl) lbl.textContent = currentLang==='pt'?'Português':'English';
}
function toggleLangMenu(){ document.getElementById('langMenu')?.classList.toggle('open'); }
function setLang(lang){
  currentLang=lang; localStorage.setItem('livoltek_estoque_lang',lang);
  applyTranslations(); document.getElementById('langMenu')?.classList.remove('open');
  if(ST.length){ rDash(); rAll(); ['inv','ev','bess','kit','strbox','div','mot','mp'].forEach(t=>renderCat(t)); rRes(); updateSidebar(); rAudit(); }
}
document.addEventListener('click',(e)=>{
  const sel=document.querySelector('.lang-selector');
  if(sel && !sel.contains(e.target)) document.getElementById('langMenu')?.classList.remove('open');
});

function toggleMobMenu(){ document.getElementById('sidebar').classList.toggle('mob-open'); document.getElementById('mob-overlay').classList.toggle('open'); }
function closeMobMenu(){ document.getElementById('sidebar').classList.remove('mob-open'); document.getElementById('mob-overlay').classList.remove('open'); }
function go(id){
  document.querySelectorAll('.sbi').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(tb=>tb.classList.remove('on'));
  document.getElementById('sb-'+id)?.classList.add('on');
  document.getElementById('tab-'+id)?.classList.add('on');

// ── Helpers ──
const pn = v=>{
  if(v===null||v===undefined||v==='') return 0;
  let s=String(v).trim().replace(/[R$\s]/g,'');
  if(!s||s==='-'||s==='—') return 0;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.');
  else if(s.includes('.')) s=s.replace(/\./g,'');
  s=s.replace(/[^0-9.\-]/g,'');
  return parseFloat(s)||0;
};
const fmt = n=>Math.round(n).toLocaleString('pt-BR');
const tr = (s,n=55)=> s&&s.length>n? s.slice(0,n)+'…' : (s||'—');
const norm = s=> String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
function makeCI(hdr){ return function(...names){ for(const n of names){ const i=hdr.findIndex(h=>norm(h)===norm(n)); if(i>=0) return i; } return -1; }; }

function resolveWH(code){
  const c=String(code||'').trim();
  if(WH_MAP[c]) return WH_MAP[c].nome;
  if(WH_NAMES[c]) return WH_NAMES[c];
  const stripped=c.replace(/^0+/,'');
  if(WH_MAP[stripped]) return WH_MAP[stripped].nome;
  if(WH_NAMES[stripped]) return WH_NAMES[stripped];
  const l=c.toLowerCase();
  if(l.includes('livoltek')||l.includes('fábrica')||l.includes('fabrica')) return 'Fábrica Livoltek';
  if(l.includes('curitiba')) return 'Curitiba (Eletra)';
  if(l.includes('fortaleza')) return 'Fortaleza (Eletra)';
  if(l.includes('manaus')) return 'Manaus (Eletra)';
  return c;
}
function isWHValido(code){
  const c=String(code||'').trim(); if(!c) return false;
  if(WH_MAP[c]) return true;
  const stripped=c.replace(/^0+/,''); if(WH_MAP[stripped]) return true;
  return WH_LIST.includes(resolveWH(c));
}

// ══ PARSERS ══
function parseArmazens(csv){
  const parsed=Papa.parse(csv.replace(/^\uFEFF/,''),{header:true,skipEmptyLines:true,delimiter:';',transformHeader:h=>norm(h)});
  const map={};
  parsed.data.forEach(r=>{
    const cod=String(r['CODIGO_ARMAZEM']||r['CODIGO ARMAZEM']||'').trim();
    const nome=String(r['NOME_ARMAZEM']||r['NOME ARMAZEM']||'').trim();
    const tipo=String(r['TIPO']||'').trim();
    if(!cod||!nome) return;
    const tipoNorm=tipo.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\uFFFD/g,'');
    let nomeDash;
    if(cod==='1010'||tipoNorm.toUpperCase().includes('FABRICA')) nomeDash='Fábrica Livoltek';
    else if(tipoNorm&&tipoNorm!=='Filial') nomeDash=`${nome} (${tipoNorm})`;
    else nomeDash=`${nome} (Eletra)`;
    map[cod]={nome:nomeDash,tipo,codigo:cod};
  });
  SRC_TS.armazens=new Date();
  return map;
}

function parseCadastro(csv){
  const fixEnc = s=>String(s||'').trim().replace(/\uFFFD/g,'');
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:false,skipEmptyLines:true,delimiter:';'}).data;
  if(!all.length) return {};
  let hdrIdx=0;
  for(let i=0;i<Math.min(3,all.length);i++){ if(all[i].join('|').toUpperCase().replace(/[^A-Z|]/g,'').includes('CODIGO')){hdrIdx=i;break;} }
  const hdr=all[hdrIdx];
  const ci=makeCI(hdr);
  const iCOD = ci('CODIGO','CÓDIGO')>=0?ci('CODIGO','CÓDIGO'):0;
  const iDESC= ci('DESCRICAO')>=0?ci('DESCRICAO'):1;
  const iTOP = ci('TOP MANAGER','CODIGO TOP MANAGER'); // opcional: se a coluna não existir, fica -1 (não lê outra coluna no lugar)
  const iCAT = ci('Categoria','CATEGORIA')>=0?ci('Categoria','CATEGORIA'):3;
  const iFAM = ci('Família','Familia','FAMILIA')>=0?ci('Família','Familia','FAMILIA'):4;
  const iNOM = ci('Nomenclatura','NOMENCLATURA'); // opcional: sem a coluna, o nome do produto é a DESCRICAO do cadastro
  // TOP Manager = código NUMÉRICO do sistema da Fábrica (não dá pra personalizar). No cadastro:
  //  • CODIGO = código Hexing/TOTVS do produto (uma linha por produto);
  //  • CODIGO TOP MANAGER          = código(s) LOCAL (não nacional) do produto na Fábrica Manaus;
  //  • CODIGO TOP MANAGER NACIONAL = código(s) do produto NACIONAL (Finame). Nacional não tem Hexing.
  // Mais de um código na mesma célula: separados por "/". Formato antigo aceito: coluna "Nacional"
  // com SIM (a própria linha é o produto nacional).
  const iTOPN = ci('CODIGO TOP MANAGER NACIONAL','TOP MANAGER NACIONAL','CODIGO TOP NACIONAL','TOP NACIONAL');
  const iNAC = ci('NACIONAL');
  const iEXP = ci('EXPORTACAO','EXPORTAÇÃO');
  // Produto com MAIS DE UM código TOTVS (ex.: 9121500200 e HP1-1K5S2R11001 são o mesmo inversor): o CODIGO fica o principal e
  // os demais vão nesta coluna opcional, separados por "/". Cada código continua com o seu estoque e as suas reservas.
  const iALT = ci('TOTVS','CODIGO TOTVS ALTERNATIVO','CODIGOS TOTVS ALTERNATIVOS','OUTROS CODIGOS TOTVS','CODIGO TOTVS 2'); // coluna "TOTVS" do cadastro = demais códigos TOTVS do produto
  const iMOD = ci('MODELO');                                              // opcional
  const iPOT = ci('POTENCIA_KW','POTENCIA (KW)','POTENCIA KW','POTENCIA'); // opcional (em kW)
  const splitCod = v=>String(v||'').split(/[\/;,|]+/).map(x=>x.trim().toUpperCase().replace(/\.0$/,'').replace(/\.$/,'')).filter(Boolean);
  const repetidos=[];
  if(iTOPN<0 && iNAC<0) SRC_ALERTS.push({fonte:'cadastro_produtos.csv',msg:'⚠️ Coluna CODIGO TOP MANAGER NACIONAL não encontrada no cadastro — as tags FINAME não serão exibidas.',ts:new Date()});
  if(iEXP<0) SRC_ALERTS.push({fonte:'cadastro_produtos.csv',msg:'⚠️ Coluna EXPORTAÇÃO não encontrada no cadastro — as tags Exportação-S/AFCI não serão exibidas.',ts:new Date()});
  const map={}, mapTop={}, mapNac={}, mapAlt={}, mapNomCount={}, mapNom={}, dupl=[];
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    const codigo=String(r[iCOD]||'').trim().toUpperCase().replace(/\.$/,''); // remove ponto final
    if(!codigo) continue;
    if(map[codigo]){ dupl.push(codigo); continue; }
    const topLocal = iTOP>=0 ? splitCod(r[iTOP]) : [];
    const topNacional = iTOPN>=0 ? splitCod(r[iTOPN]) : ((iNAC>=0 && celulaMarcada(r[iNAC])) ? [codigo] : []);
    const item={
      codigo, descricao:String(r[iDESC]||'').trim(), topLocal, topNacional, nacional: topNacional.length>0,
      categoria:fixEnc(r[iCAT]), familia:String(r[iFAM]||'').trim(), nomenclatura:((iNOM>=0?String(r[iNOM]||'').trim():'')||String(r[iDESC]||'').trim()),
      exportacao: iEXP>=0 && celulaMarcada(r[iEXP]),
      totvsAlt: iALT>=0 ? splitCod(r[iALT]).filter(c=>c!==codigo) : [],
      titulo: (iNOM>=0?String(r[iNOM]||'').trim():''),   // título do card = NOMENCLATURA; vazia → o próprio código do produto
      modelo: (iMOD>=0?String(r[iMOD]||'').trim():''), // só o que está no cadastro (coluna opcional MODELO)
      potenciaKW: (()=>{ const v=iPOT>=0?parseFloat(String(r[iPOT]||'').replace(',','.')):NaN; return isFinite(v)?v:potenciaDeFamilia(String(r[iFAM]||'')); })()
    };
    map[codigo]=item;
    // Índices dos códigos TOP (a Fábrica Manaus reporta por TOP): local → produto Hexing; nacional → produto nacional.
    // Um mesmo código TOP não pode estar em dois produtos: se estiver, vai pra Auditoria.
    topLocal.forEach(c=>{ if((mapTop[c]&&mapTop[c]!==item)||(mapNac[c]&&mapNac[c]!==item)) repetidos.push({top:c,a:(mapTop[c]||mapNac[c]).codigo,b:codigo}); mapTop[c]=item; });
    topNacional.forEach(c=>{ if((mapNac[c]&&mapNac[c]!==item)||(mapTop[c]&&mapTop[c]!==item)) repetidos.push({top:c,a:(mapNac[c]||mapTop[c]).codigo,b:codigo}); mapNac[c]=item; });
    item.totvsAlt.forEach(c=>{ if(mapAlt[c]&&mapAlt[c]!==item) repetidos.push({top:c,a:mapAlt[c].codigo,b:codigo}); mapAlt[c]=item; });
    // Índice terciário: texto da Nomenclatura → registro. Alguns relatórios (ex: o Resumo
    // da Fábrica/Eletra Manaus) reportam o "Product" usando o texto da Nomenclatura em vez
    // de um código (ex: "GT3 -100K-1 380V AFCI"). Só usamos esse índice quando o texto é
    // único no cadastro (não ambíguo) — se duas linhas tiverem a mesma Nomenclatura, nenhuma
    // delas entra no índice, pra evitar resolver errado.
    const nomKey=item.nomenclatura.toUpperCase();
    if(nomKey){
      mapNomCount[nomKey]=(mapNomCount[nomKey]||0)+1;
      mapNom[nomKey]=item;
    }
  }
  Object.keys(mapNomCount).forEach(k=>{ if(mapNomCount[k]>1) delete mapNom[k]; });
  VAL_TOP_REPETIDO=repetidos;
  VAL_DUPLICADO=dupl.map(c=>({codigo:c,descricao:map[c]?.descricao||'',msg:'Código duplicado no cadastro_produtos'}));
  SRC_TS.cadastro=new Date();
  // Código TOTVS que está na coluna TOTVS de um produto E ainda aparece como linha solta no cadastro (o cadastro vem do TOTVS e
  // a linha volta sempre): vale a coluna — o código conta UMA vez só, dentro do produto, sem alerta e sem card duplicado.
  CADASTRO_TOP=mapTop;
  CADASTRO_NACTOP=mapNac;
  CADASTRO_ALT=mapAlt;
  CADASTRO_NOM=mapNom;
  return map;
}

// ══ Mapa fixo FL (código de filial TOTVS) → armazém canônico do dashboard.
// FL 010107 (Fábrica Livoltek dentro do TOTVS) é ignorado aqui de propósito.
// FL 010106 (Manaus/Eletra) vem inteiro daqui — voltamos ao formato antigo em 17/09/2026:
// a Fábrica Manaus agora tem seu próprio arquivo (estoque_fabrica_manaus.csv, formato
// TOP/HEXING/Coluna6/Saldo Estoque, sem relação com o TOTVS), sem merge com o estoque_geral.csv.
const FL_MAP = { '010102':'Fortaleza (Eletra)', '010106':'Manaus (Eletra)', '010108':'Curitiba (Eletra)' };

// ══ estoque_geral.csv — arquivo único que substitui os 3 arquivos separados
// (estoque_curitiba.csv, estoque_fortaleza.csv, estoque_manaus.csv).
// Mesmo layout TOTVS de sempre (CODIGO;TP;GRUPO;DESCRICAO;U.M.;FL;ARMZ;SALDO EM ESTOQUE;...),
// só que agora com os 3 armazéns misturados nas linhas, distinguidos pela coluna FL.
function parseEstoqueGeral(csv){
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:false,skipEmptyLines:true,delimiter:';'}).data;
  if(!all.length) return [];
  let hdrIdx=0;
  for(let i=0;i<Math.min(5,all.length);i++){
    const joined=all[i].join('|').toUpperCase();
    if(joined.includes('CODIGO')&&joined.includes('SALDO')){hdrIdx=i;break;}
  }
  const hdr=all[hdrIdx].map(h=>String(h).trim());
  const ci=makeCI(hdr);
  const iCOD=ci('CODIGO'), iFL=ci('FL'), iARMZ=ci('ARMZ'), iDESC=ci('DESCRICAO','DESCRIÇÃO');
  const iDISP=ci('ESTOQUE DISPONIVEL','ESTOQUE DISPONÍVEL');
  // ESTOQUE DISPONIVEL é a única fonte aceita pra quantidade — sem fallback silencioso pra
  // SALDO EM ESTOQUE (que não desconta empenho, dá número errado sem avisar). Se a coluna não
  // existir no arquivo, aborta o parse desse arquivo inteiro e avisa claramente, em vez de
  // seguir com dado potencialmente errado.
  if(iDISP<0){
    SRC_ALERTS.push({fonte:'estoque_geral.csv',msg:'⚠️ Erro na fonte de estoque: coluna ESTOQUE DISPONIVEL não encontrada.',ts:new Date()});
    return [];
  }
  const iSAL=iDISP;
  const iTP=ci('TP');

  const items=[];
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    const codigo=String(r[iCOD]||'').trim().toUpperCase();
    if(!codigo) continue;

    // FL identifica o armazém da linha. FL não mapeado (ex: 010107 = Fábrica Livoltek
    // amostra do TOTVS) é ignorado — não é um dos 3 armazéns comerciais deste arquivo.
    const flRaw=String(iFL>=0?r[iFL]:'').trim();
    const whNome=FL_MAP[flRaw];
    if(!whNome) continue;

    // Filtro ARMZ=7: comparação numérica para evitar problemas com espaços/zeros à esquerda
    const armzRaw=String(iARMZ>=0?r[iARMZ]:'').trim();
    const armzNum=parseInt(armzRaw,10);
    if(armzRaw && armzNum!==7) continue;

    const saldo=pn(iSAL>=0?r[iSAL]:0);
    const descricao=String(iDESC>=0?r[iDESC]||'':'').trim();
    const tp=String(r[iTP]||'').trim().toUpperCase();
    items.push({codigo,descricao,wh:whNome,saldo,reserva:0,fat:0,disp:0,
      categoria:'',familia:'',nomenclatura:'',isMP:false,_semCadastro:false,_incompleto:[],tp});
  }

  // Linhas de exportação: SKUs fixos em QUALQUER ARMZ (sem filtro), dentro dos 3 armazéns válidos
  // Guardados separadamente em EXP_RAW para a aba Exportação
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    const codigo=String(r[iCOD]||'').trim().toUpperCase();
    if(!EXPORT_SKUS.includes(codigo)) continue;
    const flRaw=String(iFL>=0?r[iFL]:'').trim();
    const whNome=FL_MAP[flRaw];
    if(!whNome) continue;
    const armzRaw=String(iARMZ>=0?r[iARMZ]:'').trim();
    const armzNum=parseInt(armzRaw,10);
    if(armzNum===7) continue; // já incluído no estoque comercial
    if(ARMZ_EXCLUIR_EXP.has(armzNum)) continue; // excluir garantia(8), reparo(12), scrap(16)
    const saldo=pn(iSAL>=0?r[iSAL]:0);
    if(saldo<=0) continue;
    const descricao=String(iDESC>=0?r[iDESC]||'':'').trim();
    EXP_RAW.push({codigo,descricao,wh:whNome,armz:armzNum,armzNome:ARMZ_NOMES[armzNum]||`ARMZ ${armzNum}`,saldo});
  }
  return items;
}

// ══ estoque_fabrica_manaus.csv — aba EXPEDIÇÃO-TOP, formato TopManager (voltamos a esse
// formato em 17/09/2026 a pedido da Cristiane).
// Fonte: aba "Resumo" da planilha "Warehouse_Eletra_Livoltek_DD_MM_AAAA.xlsx", exportada em CSV.
// Colunas: TOP | HEXING | Coluna3 | Coluna4 | Coluna5 | Coluna6 (descrição) | Coluna7 | Coluna8
// | Coluna9 | Coluna10 | Coluna11 | Coluna12 | Saldo Estoque
//
// Código do produto vem da coluna TOP (não HEXING) — com o TOP certo, o cruzamento com o
// cadastro_produtos.csv funciona direto pelo índice CODIGO TOP MANAGER (CADASTRO_TOP), sem
// precisar de overrides manuais — ex: TOP=106171 já resolve sozinho pra "106171M"
// (MATERIA-PRIMA, INVERSOR - GT1), sem precisar mais do caso especial "GT1 7-10KW" de antes.
function parseFabricaManaus(csv){
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:false,skipEmptyLines:true,delimiter:';'}).data;
  if(all.length<2) return [];
  let hdrIdx=0;
  for(let i=0;i<Math.min(5,all.length);i++){
    const joined=all[i].join('|').toUpperCase();
    if(joined.includes('TOP')&&joined.includes('SALDO')){hdrIdx=i;break;}
  }
  const hdr=all[hdrIdx].map(h=>String(h).trim());
  const ci=makeCI(hdr);
  const iTOP=ci('TOP')>=0?ci('TOP'):0;
  const iDESC=ci('Coluna6')>=0?ci('Coluna6'):5;
  const iSAL=ci('Saldo Estoque')>=0?ci('Saldo Estoque'):hdr.length-1;
  const iHEX=ci('HEXING'); // só para a Auditoria — o código do produto na Fábrica continua sendo o TOP

  const items=[];
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    if(!r||r.length<3) continue;
    const codigo=String(r[iTOP]||'').trim().toUpperCase();
    if(!codigo) continue;
    const saldo=pn(r[iSAL]||0);
    const descricao=String(r[iDESC]||'').trim();
    items.push({codigo,descricao,wh:'Fábrica Livoltek',armz:'07',saldo,reserva:0,fat:0,disp:0,
      categoria:'',familia:'',nomenclatura:'',isMP:false,_semCadastro:false,_incompleto:[],tp:'',
      hexing: iHEX>=0 ? String(r[iHEX]||'').trim().toUpperCase() : ''});
  }
  return items;
}

// Auditoria da Fábrica (roda depois do join, sobre as linhas já resolvidas):
//  1) mais de um código TOP LOCAL no mesmo produto Hexing — o estoque deles soma na mesma linha
//     "Fábrica Livoltek", então vale conferir se é isso mesmo (ex.: GT3-100K-1R11002);
//  2) o mesmo TOP aparecendo com 2+ Hexing diferentes no relatório da Fábrica.
// Auditoria da Fábrica: o mesmo TOP aparecendo com 2+ Hexing diferentes no relatório da Fábrica
// (cada código TOP tem o seu card; o Hexing do relatório é só referência e já veio errado em versões antigas).
function auditarHexingFabrica(items){
  const out=[], hexPorTop={};
  items.filter(i=>i.wh==='Fábrica Livoltek' && i.hexing).forEach(i=>{ (hexPorTop[i.codigo]=hexPorTop[i.codigo]||new Set()).add(i.hexing); });
  Object.entries(hexPorTop).forEach(([top,hs])=>{
    if(hs.size>=2) out.push({tipo:'Mesmo TOP com mais de um Hexing no relatório',hexing:[...hs].join(' / '),detalhe:`TOP ${top}`});
  });
  return out;
}

// Mapa fixo de código numérico de armazém → nome canônico
// Não depende de armazens.csv (excluído do repositório)
const ARMAZEM_CODIGO_MAP = {
  '10108': 'Curitiba (Eletra)',
  '10102': 'Fortaleza (Eletra)',
  '10106': 'Manaus (Eletra)',
  '1010':  'Fábrica Livoltek',
};

function normalizaArmazem(armRaw){
  const s = String(armRaw||'').trim();
  if(!s) return '';
  // Tenta por código numérico exato
  if(ARMAZEM_CODIGO_MAP[s]) return ARMAZEM_CODIGO_MAP[s];
  // Tenta pelo código sem zeros à esquerda
  if(ARMAZEM_CODIGO_MAP[s.replace(/^0+/,'')]) return ARMAZEM_CODIGO_MAP[s.replace(/^0+/,'')];
  // Tenta por nome completo (se já vier como texto)
  if(WH_LIST.includes(s)) return s;
  // Tenta por palavra-chave
  const sl = s.toLowerCase();
  if(sl.includes('curitiba')) return 'Curitiba (Eletra)';
  if(sl.includes('fortaleza')) return 'Fortaleza (Eletra)';
  if(sl.includes('manaus')&&!sl.includes('fabrica')&&!sl.includes('livoltek')) return 'Manaus (Eletra)';
  if(sl.includes('fabrica')||sl.includes('livoltek')) return 'Fábrica Livoltek';
  return s; // retorna o valor original se não reconhecido
}

function parseReservasSheets(csv){
  // Normaliza removendo acentos de verdade (á→a, ó→o etc.) em vez de simplesmente apagar
  // a letra acentuada — o jeito antigo fazia "Código" virar "Cdigo" (perdia o 'o'), que
  // nunca batia com "CODIGO" na comparação, quebrando a detecção da coluna.
  const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();
  const csvClean=csv.replace(/^\uFEFF/,'');
  const detectedSep = csvClean.indexOf(';')!==-1 && (csvClean.indexOf(';')<(csvClean.indexOf(',')===-1?99999:csvClean.indexOf(','))) ? ';' : ',';
  const parsed=Papa.parse(csvClean,{header:true,skipEmptyLines:true,delimiter:detectedSep,
    transformHeader:h=>{
      const tt=h.trim().replace(/^\uFEFF/,'');
      if(semAcento(tt)==='CODIGO') return 'Codigo';
      return tt;
    }});
  const result=[];
  // Debug: logar colunas e primeiras linhas para diagnóstico
  if(parsed.data.length>0) console.log('📋 RESERVAS colunas:', Object.keys(parsed.data[0]));
  parsed.data.forEach((r,idx)=>{
    if(idx<5) console.log('RESERVA linha',idx,JSON.stringify(r));
    // IMPORTANTE: _codKey só é usado se realmente encontrado (nunca cai pra ''), porque
    // planilhas com uma coluna extra sem cabeçalho geram a chave '' — se o fallback fosse
    // '', `r['']` leria o valor dessa coluna solta (ex: uma anotação como "SÓ POR GARANTIA")
    // como se fosse o Código, por engano.
    const _allKeys=Object.keys(r).filter(k=>k!=='');
    const _codKey=_allKeys.find(k=>semAcento(k)==='CODIGO');
    const codigo=String((_codKey?r[_codKey]:'')||r['Código']||r['Codigo']||r['CODIGO']||'').trim().toUpperCase();
    const qtd=pn(r['QUANTIDADE_RESERVADA']||r['Qtdade']||r['QTD']||r['Quantidade']||0);
    const cancelado=String(r['Cancelado']||r['CANCELADO']||'').trim();
    if(!codigo||qtd<=0||cancelado) return;
    const armRaw=String(r['CODIGO_ARMAZEM']||r['Armazem']||r['Armazém']||r['ARMAZEM']||r['armazem']||'').trim();
    // Resolve código numérico (ex: 10102) ou nome completo para nome canônico
    const wh=normalizaArmazem(armRaw);
    const whValido=WH_LIST.includes(wh);
    if(armRaw && !whValido){
      if(!VAL_RES_SEM_ARMAZEM.find(v=>v.codigo===codigo&&v.cliente===String(r['Cliente']||'').trim())){
        VAL_RES_SEM_ARMAZEM.push({
          codigo, cliente:String(r['Cliente']||'').trim(),
          qtd, armRaw: armRaw+'  (não reconhecido)'
        });
      }
      return; // não aplica reserva com armazém inválido
    }
    result.push({
      cliente:String(r['Cliente']||r['CLIENTE']||'').trim(),
      responsavel:String(r['Responsavel']||r['Responsável']||r['RESPONSAVEL']||'').trim(),
      diretoria:String(r['Diretoria']||r['DIRETORIA']||'').trim(),
      codigo, obs:String(r['OBSERVACAO']||r['Observações']||r['OBS']||'').trim(),
      wh, armRaw, qtd, solicitado:String(r['Solicitado']||'').trim(),
    });
  });
  SRC_TS.reservas=new Date();
  return result;
}

// ══ PARSER: Pedidos Faturados (abate do estoque a partir de DATA_CORTE_FATURADOS)
// Lê o mesmo pedidos.csv do repositório Pedidos-Livoltek.
// Filtra status ENVIADO PARA FATURAMENTO (PD) com data de envio >= DATA_CORTE_FATURADOS.
// IMPORTANTE: o saldo do ESTOQUE.csv é o saldo pós-inventário e já reflete (líquido) tudo
// que foi faturado ATÉ o dia do corte (inclusive). Por isso DATA_CORTE_FATURADOS deve ser o
// dia SEGUINTE ao fechamento do inventário — senão o faturamento daquele dia é abatido 2x
// (uma vez fisicamente no saldo, outra vez aqui).
// Agrupa por Código Produto + Warehouse → soma qtd para abater do estoque disponível.
function parsePedidosFaturados(csvText){
  const result = {}; // { 'wh|codigo': {wh, codigo, qtd, pedidos:[]} }
  const clean = csvText.replace(/^\uFEFF/,'');
  const lines = clean.split('\n');
  if(!lines.length) return result;

  const sep = lines[0].includes(';') ? ';' : ',';
  const hdr = lines[0].split(sep).map(h=>h.trim().toLowerCase());

  const iPO    = hdr.findIndex(h=>h.includes('po')&&h.includes('relacionado'));
  const iEnvio = hdr.findIndex(h=>h.includes('data envio faturamento'));
  const iWH    = hdr.findIndex(h=>h.includes('warehouse'));
  const iCod   = hdr.findIndex(h=>h.includes('digo')&&h.includes('produto'));
  const iQtd   = hdr.findIndex(h=>h.includes('qtdade')||h==='qtd');

  const seen = new Set(); // controle de PO já processado (evitar duplicar linhas multi-item)
  const poEnvio = {}; // { po: {dataEnvio, wh} }

  // 1ª passagem: coletar data de envio e warehouse por PO (vem na primeira linha de cada PO)
  lines.slice(1).forEach(line=>{
    const cols = line.split(sep);
    const po = (cols[iPO]||'').trim();
    if(!po||!po.startsWith('LIV')) return;
    const envio = (cols[iEnvio]||'').trim();
    const wh = (cols[iWH]||'').trim();
    if(!poEnvio[po]) poEnvio[po] = {dataEnvio: envio, wh};
  });

  // 2ª passagem: somar qtd por produto+armazém para POs faturados após DATA_CORTE
  lines.slice(1).forEach(line=>{
    const cols = line.split(sep);
    const po = (cols[iPO]||'').trim();
    if(!po||!po.startsWith('LIV')) return;
    const info = poEnvio[po];
    if(!info||!info.dataEnvio) return; // sem data de envio = não faturado

    // Verificar data de corte
    const partes = info.dataEnvio.split('/');
    if(partes.length!==3) return;
    const dataEnvio = new Date(partes[2], partes[1]-1, partes[0]);
    if(dataEnvio < DATA_CORTE_FATURADOS) return;

    const cod = (cols[iCod]||'').trim().toUpperCase();
    const qtd = parseFloat((cols[iQtd]||'0').replace(',','.')) || 0;
    if(!cod||qtd<=0) return;

    const wh = resolveWH(info.wh);
    const k = wh+'|'+cod;
    if(!result[k]) result[k] = {wh, codigo:cod, qtd:0, pedidos:[]};
    result[k].qtd += qtd;
    if(!result[k].pedidos.includes(po)) result[k].pedidos.push(po);
  });

  return result;
}

function parseReservasLocal(csv){
  // fallback: reserva.csv local — mesmo schema legado (Cliente;Responsavel;Diretoria;Código;Observações;Armazem;Qtdade;Cancelado;Solicitado)
  return parseReservasSheets(csv);
}

// ── JOIN ──
// Linhas zeradas (decisão da Cristiane: o vendedor precisa ver que o produto existe e está com 0):
//  1) Finame: todo código TOP nacional sem estoque entra com uma linha zerada na Fábrica;
//  2) produtos com categoria PRODUTO do cadastro que não têm NENHUM código em relatório de estoque
//     entram com 0 — só nas abas de produto (Inversores, Carregadores EV, BESS, Kit Solar, String Box);
//     Diversos fica de fora.
// Retorna as linhas criadas, ainda sem enriquecimento (o joinCadastro completa). Marcadas com _zero
// pra não entrarem nas contagens de SKUs do Dashboard.
function linhasFinameZeradas(items){
  const tem=new Set(items.map(s=>s.codigo));
  const out=[];
  const nova=(codigo,desc)=>({codigo, descricao:desc, wh:'Fábrica Livoltek', armz:'07', saldo:0, reserva:0, fat:0, disp:0,
    categoria:'', familia:'', nomenclatura:'', isMP:false, _semCadastro:false, _incompleto:[], tp:'', _zero:true});
  const ehAltDeOutro=c=>CADASTRO_ALT[c.codigo] && CADASTRO_ALT[c.codigo]!==c;
  Object.values(CADASTRO).forEach(c=>(c.topNacional||[]).forEach(t=>{
    if(!tem.has(t)){ out.push(nova(t,c.descricao)); tem.add(t); }
  }));
  const ABAS_PRODUTO=['inv','ev','bess','kit','strbox'];
  Object.values(CADASTRO).forEach(c=>{
    if(String(c.categoria||'').toUpperCase().trim()!=='PRODUTO') return;
    if(ehAltDeOutro(c)) return; // o código já conta dentro de outro produto (coluna TOTVS)
    const cods=[c.codigo,...(c.topLocal||[]),...(c.topNacional||[])];
    if(cods.some(x=>tem.has(x))) return;
    if(!ABAS_PRODUTO.includes(getCatTab({familia:c.familia}))) return;
    out.push(nova(c.codigo,c.descricao)); tem.add(c.codigo);
  });
  return out;
}

function joinCadastro(items){
  // ESTOQUE.csv já traz Categoria, Família e Nomenclatura nas colunas 15-17.
  // joinCadastro complementa com dados do cadastro_produtos.csv quando disponível,
  // mas não sobrescreve se o campo já veio preenchido do CSV principal.
  const isMP_cat=cat=>{
    const u=(cat||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    return u.includes('MATERIA')&&u.includes('PRIMA');
  };
  items.forEach(s=>{
    // Itens da Fábrica Livoltek vêm com código do sistema TopManager (coluna TOP do relatório).
    // Esse número pode coincidir com uma CODIGO primária de outro item no cadastro (ex: "106170"
    // existe como PRODUTO comum), então pra esses itens buscamos primeiro pelo índice de
    // CODIGO TOP MANAGER (CADASTRO_TOP) — só cai no lookup direto se não achar por lá.
    // Terceira tentativa: Nomenclatura exata (CADASTRO_NOM) — usado quando o relatório de origem
    // reporta o texto da nomenclatura em vez de um código (ex: "GT3 -100K-1 380V AFCI").
    // Quarta tentativa: trecho da Nomenclatura (busca por substring) — usado quando o relatório
    // da Fábrica reporta só um pedaço do nome (ex: "GT3 -100K-1 380V AFCI"), sem o prefixo
    // completo ("INVERSOR ON-GRID TRIFASICO GT3 -100K-1 380V AFCI" no cadastro).
    // Só resolve automático se TODOS os candidatos encontrados concordam em Categoria (não vazia)
    // e Família — aí a ambiguidade é inofensiva (dá na mesma classificação de qualquer jeito).
    // Se divergirem (caso do LHE12DR/LHE34DR, que a Cristiane pediu pra deixar pendente), fica
    // sem cadastro mesmo, pra revisão manual — nunca adivinha.
    const buscarPorNomenclaturaParcial = texto=>{
      const alvo=String(texto||'').toUpperCase().replace(/\s+/g,' ').trim();
      if(!alvo) return null;
      const candidatos=Object.values(CADASTRO).filter(c=>String(c.nomenclatura||'').toUpperCase().replace(/\s+/g,' ').includes(alvo));
      if(!candidatos.length) return null;
      const primeiro=candidatos[0];
      const concordam=candidatos.every(c=>c.categoria&&c.categoria===primeiro.categoria&&c.familia===primeiro.familia);
      return concordam ? primeiro : null;
    };
    // CADA CÓDIGO TEM O SEU CARD — o vendedor sempre informa o código do produto que tem estoque.
    // Fábrica (código TOP): o card mantém o código TOP; os dados (descrição, família, categoria,
    // exportação) vêm da linha do cadastro que lista esse TOP. 1) TOP NACIONAL → card Finame;
    // 2) TOP local → card do código local, sem tag; 3) senão, lookup direto por CODIGO / nomenclatura.
    let cad=null, ehNac=false;
    if(s.wh==='Fábrica Livoltek' && CADASTRO_NACTOP[s.codigo]){ cad=CADASTRO_NACTOP[s.codigo]; ehNac=true; }
    else if(s.wh==='Fábrica Livoltek' && CADASTRO_TOP[s.codigo]){ cad=CADASTRO_TOP[s.codigo]; }
    else cad=(CADASTRO_ALT[s.codigo] || CADASTRO[s.codigo] || CADASTRO_NOM[s.codigo] || (s.wh==='Fábrica Livoltek' ? buscarPorNomenclaturaParcial(s.codigo) : null));
    s._semCadastro=!cad;
    s.isFiname=ehNac;
    s.isSemAfci=!!(cad&&cad.exportacao);
    // Produto comercial (o card consolidado): chave = linha do cadastro que lista este código
    // (Hexing/TOTVS, TOP importado ou TOP nacional). O código original da linha NÃO é alterado.
    s.prodId = cad ? cad.codigo : s.codigo;
    s.sistema = s.wh==='Fábrica Livoltek' ? 'TOP Manager' : 'TOTVS';
    s.origemTxt = ehNac ? 'Nacional' : 'Importado';
    if(cad){
      // Usa dado do ESTOQUE.csv se preenchido, senão cai no cadastro_produtos
      if(!s.nomenclatura) s.nomenclatura=cad.nomenclatura||s.descricao;
      if(!s.familia)      s.familia=cad.familia||'';
      if(!s.categoria)    s.categoria=(cad.categoria||'').toUpperCase();
    }
    // isMP: SEMPRE definido pela Categoria do cadastro_produtos.csv (busca por código),
    // nunca pelo campo TP do estoque_geral.csv — instrução explícita da Cristiane.
    // Se a Categoria estiver vazia/não cadastrada para o código, o item não conta como MP.
    s.isMP=isMP_cat(s.categoria);
    // Recalcular _catTab com dados enriquecidos
    const FAM_ABA={'INVERSOR':'inv','CARREGADOR':'ev','BATERIA':'bess','BESS':'bess',
      'KIT SOLAR':'kit','STRING BOX':'strbox','MOTOR DE BARCO':'mot','HYPER':'inv'};
    // MP: _catTab = aba da família (para aparecer na seção inferior da aba certa)
    // A aba Matéria-Prima usa isMP=true para filtrar independente do _catTab
    const f=(s.familia||'').toUpperCase();
    s._catTab='div';
    for(const [key,tab] of Object.entries(FAM_ABA)){ if(f.includes(key)){s._catTab=tab;break;} }
  });
}

function applyReservas(){
  // Toda reserva real SEMPRE vem com armazém informado — não é uma situação normal
  // ela chegar sem armazém válido. Se acontecer, é erro de cadastro no Sheets e deve
  // ser sinalizado na Auditoria, nunca "adivinhado" automaticamente no cálculo.
  ST.forEach(s=>{ s.reserva=0; });

  // Soma a reserva por chave armazém|código UMA VEZ (não por linha de RES.forEach repetida)
  const lkpRes={}; // 'wh|codigo' -> qtd total reservada
  RES.forEach(r=>{
    const whValido = r.wh && WH_LIST.includes(r.wh);
    if(!whValido){
      if(!VAL_RES_SEM_ARMAZEM.find(v=>v.codigo===r.codigo&&v.cliente===r.cliente)){
        VAL_RES_SEM_ARMAZEM.push({codigo:r.codigo,cliente:r.cliente,qtd:r.qtd,armRaw:r.armRaw||r.wh||'(vazio)'});
      }
      return;
    }
    const k=r.wh+'|'+r.codigo;
    lkpRes[k]=(lkpRes[k]||0)+r.qtd;
  });

  // Aplica reservas em linhas existentes de ST (1 vez por armazém+código)
  const aplicado=new Set();
  ST.forEach(s=>{
    const k=s.wh+'|'+s.codigo;
    if(lkpRes[k] && !aplicado.has(k)){
      s.reserva = lkpRes[k];
      aplicado.add(k);
    }
  });

  // Para reservas sem linha correspondente em ST (produto com saldo zero/ausente no CSV),
  // cria uma linha virtual com saldo=0 — assim o disponível fica negativo (-reserva),
  // mostrando corretamente que há compromisso maior que o estoque disponível.
  //
  // Exceção: se o "código" não existe no cadastro E não tem nenhum dígito (ex: "SÓ POR
  // GARANTIA"), não é um SKU real — é erro de digitação na planilha de Reservas (alguém
  // escreveu uma observação na coluna Código). Nesse caso NÃO cria card navegável — só
  // sinaliza na Auditoria pra corrigir na fonte (planilha de Reservas).
  Object.entries(lkpRes).forEach(([k, qtd])=>{
    if(aplicado.has(k)) return; // já foi aplicado em linha real do ST
    const [wh, ...codParts] = k.split('|');
    const codigo = codParts.join('|');
    const cadItem = CADASTRO_ALT[codigo] || CADASTRO[codigo] || CADASTRO_NACTOP[codigo] || CADASTRO_TOP[codigo] || {};
    const pareceCodigoValido = !!cadItem.nomenclatura || /\d/.test(codigo);
    if(!pareceCodigoValido){
      VAL_RES_CODIGO_INVALIDO.push({codigo, wh, qtd, msg:'Não parece ser um código de produto válido — verifique a coluna Código na planilha de Reservas'});
      return;
    }
    const isMP_v=((cadItem.categoria||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().includes('MATERIA')&&(cadItem.categoria||'').toUpperCase().includes('PRIMA'));
    const byWH_v={};
    byWH_v[wh]={saldo:0,reserva:qtd,fat:0,disp:-qtd};
    const linhaVirtual = {
      codigo, wh, saldo:0, reserva:qtd, fat:0, disp:-qtd, armz:'07',
      descricao: cadItem.descricao||codigo,
      nomenclatura: cadItem.nomenclatura||cadItem.descricao||codigo,
      familia: cadItem.familia||'', categoria: cadItem.categoria||'',
      isMP: isMP_v, _semCadastro:!cadItem.nomenclatura, isFiname:false, isSemAfci:!!cadItem.exportacao, _incompleto:[],
      prodId:(cadItem.codigo||codigo), sistema:(wh==='Fábrica Livoltek'?'TOP Manager':'TOTVS'), origemTxt:(CADASTRO_NACTOP[codigo]?'Nacional':'Importado'), _virtual:true,
      _byWH:byWH_v, _sal:0, _res:qtd, _fat:0, _disp:-qtd, tp:''
    };
    ST.push(linhaVirtual);
    VAL_INSUFICIENTE.push({codigo, descricao:linhaVirtual.nomenclatura, wh, saldo:0, reserva:qtd, disp:-qtd});
  });

  // Aplicar faturados no disp — FAT pode ainda não ter sido carregado aqui
  // então a aplicação final é feita em applyFaturados(), chamado depois do boot
  ST.forEach(s=>{ s.fat=0; s.disp = s.saldo - s.reserva; });
}

// Chamado APÓS parsePedidosFaturados() — desconta faturados do disponível
function applyFaturados(){
  // Zerar fat antes de reaplicar
  ST.forEach(s=>{ s.fat=0; });
  const aplicadoFat=new Set();
  Object.entries(FAT).forEach(([k,v])=>{
    const [wh,...codParts]=k.split('|');
    const codigo=codParts.join('|');
    // Aplicar na primeira linha do ST que bate com armazém+código (mesmo padrão da reserva)
    for(const s of ST){
      const sk=s.wh+'|'+s.codigo;
      if(sk===k && !aplicadoFat.has(k)){
        s.fat=v.qtd;
        aplicadoFat.add(k);
        break;
      }
    }
    // Se não existe linha em ST para esse produto+armazém faturado, cria linha virtual
    if(!aplicadoFat.has(k)){
      const cadItem=CADASTRO_ALT[codigo]||CADASTRO[codigo]||CADASTRO_NACTOP[codigo]||CADASTRO_TOP[codigo]||{};
      ST.push({
        codigo, wh, saldo:0, reserva:0, fat:v.qtd, disp:-v.qtd, armz:'07',
        descricao:cadItem.descricao||codigo,
        nomenclatura:cadItem.nomenclatura||cadItem.descricao||codigo,
        familia:cadItem.familia||'', categoria:cadItem.categoria||'',
        isMP:false, _semCadastro:!cadItem.nomenclatura, isFiname:false, isSemAfci:!!cadItem.exportacao, _incompleto:[],
        prodId:(cadItem.codigo||codigo), sistema:(wh==='Fábrica Livoltek'?'TOP Manager':'TOTVS'), origemTxt:(CADASTRO_NACTOP[codigo]?'Nacional':'Importado'), _virtual:true,
        _byWH:{}, _sal:0, _res:0, _fat:v.qtd, _disp:-v.qtd, tp:''
      });
      aplicadoFat.add(k);
    }
  });
  // Recalcular disp = saldo - reserva - fat
  ST.forEach(s=>{ s.disp = s.saldo - s.reserva - (s.fat||0); });
}

function validateAll(){
  VAL_SEM_CADASTRO=[]; VAL_INCOMPLETO=[]; VAL_INSUFICIENTE=[]; VAL_NEGATIVO=[];
  // Produtos do cadastro que aparecem no dashboard (estoque ou reserva) mas estão SEM descrição no cadastro
  { const ids=new Set(ST.map(s=>s.prodId||s.codigo));
    VAL_SEM_DESCRICAO=Object.values(CADASTRO).filter(c=>!c.descricao && ids.has(c.codigo)).map(c=>({codigo:c.codigo,familia:c.familia||'',titulo:c.titulo||''})); }
  ST.forEach(s=>{
    if(s._semCadastro){ if(!VAL_SEM_CADASTRO.find(v=>v.codigo===s.codigo)) VAL_SEM_CADASTRO.push({codigo:s.codigo,descricao:s.descricao,wh:s.wh}); }
    if(AUDIT_INCOMPLETO_ATIVO&&s._incompleto&&s._incompleto.length>0) VAL_INCOMPLETO.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,campos:s._incompleto});
    if(s.disp<0) VAL_INSUFICIENTE.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,saldo:s.saldo,reserva:s.reserva,disp:s.disp});
    if(s.saldo<0) VAL_NEGATIVO.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,saldo:s.saldo});
  });
}
