<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Estoque - SM Livoltek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cor-azul:#2563eb; --cor-verde:#16a34a; --cor-laranja:#f59e0b; --cor-vermelho:#dc2626;
  --pri:#2563eb; --pri-pale:#eff6ff; --grn-d:#16a34a; --grn-pale:#dcfce7;
  --amb-d:#b45309; --amb-pale:#fef3c7; --red:#dc2626; --red-pale:#fee2e2;
  --pur:#7c3aed; --bg:#f5f6f8; --surf:#fff; --brd:#e5e7eb; --txt:#111827;
  --txt2:#374151; --txtm:#6b7280; --cwb:#2563eb; --for:#0d9488; --mao-e:#ea580c; --mao-l:#7c3aed;
  --blu:#2563eb;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-g{background:#22C55E;animation:pulse 2s infinite}
.dot-r{background:#EF4444}
.dot-a{background:#F59E0B;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Topbar ── */
.topbar{height:60px;background:#0f172a;color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand-mark{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(37,99,235,.25);
  border:1px solid rgba(96,165,250,.4);border-radius:5px;padding:4px 10px}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.topbar-sub{font-size:11px;color:#94a3b8}
.topbar-right{display:flex;align-items:center;gap:14px}
.sbadge{display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1}
.sync-lbl{font-size:11px;color:#64748b}
.btn-icon{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-icon:hover{background:rgba(255,255,255,.15)}
.mob-menu-btn{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

/* ── Language selector ── */
.lang-selector{position:relative}
.lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lang-menu{display:none;position:absolute;top:110%;right:0;background:#fff;border:1px solid #e5e7eb;
  border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:150px;z-index:100;overflow:hidden}
.lang-menu.open{display:block}
.lang-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;
  border:none;background:#fff;color:#111;cursor:pointer}
.lang-menu button:hover{background:#f3f4f6}

/* ── Layout ── */
.body{display:flex;height:calc(100vh - 60px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--brd);overflow-y:auto;flex-shrink:0;
  display:flex;flex-direction:column;padding:14px 0;transition:transform .25s}
.sb-sec{margin-bottom:6px}
.sb-lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;
  padding:10px 18px 4px}
.sb-div{height:1px;background:var(--brd);margin:8px 16px}
.sbi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:10px 18px;font-size:13px;color:#374151;cursor:pointer;text-align:left;position:relative}
.sbi:hover{background:#f8fafc}
.sbi.on{background:var(--pri-pale);color:var(--pri);font-weight:600}
.sbi.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pri)}
.si{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.sn{flex:1}
.sc{font-size:11px;background:#f1f5f9;color:#64748b;border-radius:10px;padding:1px 7px;font-weight:600}
.sbi.on .sc{background:#dbeafe;color:var(--pri)}

#mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#mob-overlay.open{display:block}

.content{flex:1;overflow-y:auto;padding:22px 26px}
.tab{display:none}
.tab.on{display:block}

/* ── Cards / KPIs ── */
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kcard{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:16px 18px}
.kcard-lbl{font-size:11px;color:var(--txtm);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
.kcard-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;margin-top:4px}

/* ── Cards de produto (pc2) ── */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.625rem;align-items:stretch}
@media(max-width:1400px){.cgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1100px){.cgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:750px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.cgrid{grid-template-columns:1fr}}

.pc2{background:var(--surf);border:1px solid var(--brd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.pc2-top{padding:.75rem 1rem .375rem}
.pc2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.pc2-nom{font-size:13px;font-weight:700;color:var(--txt);line-height:1.35;flex:1}
.pc2-pill{font-size:9px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.pc2-cod{font-family:'DM Mono',monospace;font-size:10px;color:var(--txtm);margin-top:3px}
.pc2-disp-block{padding:.25rem 1rem .5rem}
.pc2-disp-lbl{font-size:9px;font-weight:700;color:var(--grn-d);text-transform:uppercase;letter-spacing:.05em}
.pc2-disp-val{font-family:'DM Mono',monospace;font-size:32px;font-weight:700;line-height:1}
.pc2-wh-list{padding:.375rem 1rem .5rem;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:3px}
.pc2-wh-row{display:flex;align-items:center;gap:7px}
.pc2-wh-name{flex:1;font-size:12px;color:var(--txt2)}
.pc2-wh-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--txt)}
.pc2-no-stock{font-size:11px;color:var(--txtm)}
.pc2-totals{padding:.375rem 1rem .5rem;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:3px}
.pc2-total-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2)}
.pc2-total-row span:last-child{font-family:'DM Mono',monospace;font-weight:600;color:var(--txt)}
.pc2-res{color:var(--pur)!important}.pc2-res span:last-child{color:var(--pur)!important}
.pc2-fat{color:var(--cor-laranja)!important}.pc2-fat span:last-child{color:var(--cor-laranja)!important}
.pc2-note{font-size:9px;color:var(--txtm);margin-top:2px;font-style:italic}
.pc2-cli-toggle{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;
  border-top:1px solid var(--brd);font-size:11px;color:var(--txtm);cursor:pointer;background:var(--bg);user-select:none}
.pc2-cli-toggle:hover{background:var(--brd)}
.pc2-cli-row{display:flex;justify-content:space-between;align-items:center;padding:5px 1rem;
  border-bottom:1px solid var(--brd);font-size:12px}
.pc2-cli-row:last-child{border-bottom:none}
.pc2-cli-nome{color:var(--txt);font-weight:500}
.pc2-cli-qtd{font-family:'DM Mono',monospace;font-weight:700;color:var(--pur)}

.mp-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--red);
  background:var(--red-pale);border-radius:5px;padding:2px 7px;margin-bottom:5px}
.pc.mp{border-left:3px solid var(--red)}

/* ── Filtros ── */
.fb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sbar{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surf);
  border:1px solid var(--brd);border-radius:8px;padding:8px 12px}
.sbar input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit}
.sel{padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:13px;background:var(--surf);
  font-family:inherit;cursor:pointer}

/* ── Pills de família (sub-categoria dinâmica via cadastro_produtos) ── */
.fam-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fam-pill{padding:6px 13px;border:1px solid var(--brd);border-radius:999px;background:var(--surf);
  font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;font-family:inherit;white-space:nowrap}
.fam-pill:hover{border-color:var(--pri);color:var(--pri)}
.fam-pill.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* ── Auditoria ── */
.aud-block{margin-bottom:20px}
.aud-hdr{font-size:14px;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;
  display:flex;align-items:center;gap:8px}
.aud-tbl{width:100%;border-collapse:collapse;font-size:12px}
.aud-tbl th{text-align:left;padding:6px 12px;font-size:10px;text-transform:uppercase;color:#64748b;background:#f8fafc}
.aud-tbl td{padding:6px 12px;border-top:1px solid var(--brd)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}

@media(max-width:700px){
  .sidebar{position:fixed;top:60px;left:0;bottom:0;z-index:50;transform:translateX(-100%);box-shadow:2px 0 12px rgba(0,0,0,.15)}
  .sidebar.mob-open{transform:translateX(0)}
  .mob-menu-btn{display:block}
  .content{padding:14px}
  .k4{grid-template-columns:1fr 1fr;gap:8px}
  .kcard{padding:12px}
  .kcard-val{font-size:20px}
  #sb-audit{display:none}
}
@media(max-width:420px){ .k4{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <button class="mob-menu-btn" onclick="toggleMobMenu()"><i class="ti ti-menu-2"></i></button>
    <div>
      <div class="brand-mark">SM Livoltek</div>
      <div class="topbar-title" data-i18n="title">Dashboard de Estoque</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="sbadge"><span class="dot dot-a" id="sdot"></span><span id="stxt">Carregando...</span></div>
    <span class="sync-lbl">Última atualização: <span id="sync-t"></span></span>
    <button class="btn-icon" onclick="boot()"><i class="ti ti-refresh"></i></button>
    <div class="lang-selector">
      <button class="lang-btn" onclick="toggleLangMenu()">
        <i class="ti ti-language"></i> <span id="langCurrentLabel">Português</span>
      </button>
      <div id="langMenu" class="lang-menu">
        <button onclick="setLang('pt')">🇧🇷 Português</button>
        <button onclick="setLang('en')">🇺🇸 English</button>
      </div>
    </div>
  </div>
</div>

<div id="mob-overlay" onclick="closeMobMenu()"></div>
<div id="src-alerts" style="display:none"></div>

<div class="body">
  <div class="sidebar" id="sidebar">
    <div class="sb-sec">
      <button class="sbi on" id="sb-dash" onclick="go('dash')">
        <i class="ti ti-layout-dashboard si"></i><span class="sn" data-i18n="navDash">Dashboard</span>
      </button>
      <button class="sbi" id="sb-todos" onclick="go('todos')">
        <i class="ti ti-list si"></i><span class="sn" data-i18n="navTodos">Todos</span><span class="sc" id="sc-todos">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-lbl" data-i18n="navCategorias">Categorias</div>
      <button class="sbi" id="sb-inv" onclick="go('inv')">
        <i class="ti ti-bolt si"></i><span class="sn" data-i18n="navInv">Inversores</span><span class="sc" id="sc-inv">—</span>
      </button>
      <button class="sbi" id="sb-ev" onclick="go('ev')">
        <i class="ti ti-charging-pile si"></i><span class="sn" data-i18n="navEv">Carregadores EV</span><span class="sc" id="sc-ev">—</span>
      </button>
      <button class="sbi" id="sb-bess" onclick="go('bess')">
        <i class="ti ti-battery-charging si"></i><span class="sn" data-i18n="navBess">BESS / Baterias</span><span class="sc" id="sc-bess">—</span>
      </button>
      <button class="sbi" id="sb-kit" onclick="go('kit')">
        <i class="ti ti-sun si"></i><span class="sn" data-i18n="navKit">Kit Solar</span><span class="sc" id="sc-kit">—</span>
      </button>
      <button class="sbi" id="sb-strbox" onclick="go('strbox')">
        <i class="ti ti-rotate-2 si"></i><span class="sn" data-i18n="navStrbox">String Box</span><span class="sc" id="sc-strbox">—</span>
      </button>
      <button class="sbi" id="sb-div" onclick="go('div')">
        <i class="ti ti-category si"></i><span class="sn" data-i18n="navDiv">Diversos</span><span class="sc" id="sc-div">—</span>
      </button>
      <button class="sbi" id="sb-mot" onclick="go('mot')">
        <i class="ti ti-propeller si"></i><span class="sn" data-i18n="navMot">Motor de Barco</span><span class="sc" id="sc-mot">—</span>
      </button>
      <button class="sbi" id="sb-mp" onclick="go('mp')">
        <i class="ti ti-building-factory-2 si"></i><span class="sn" data-i18n="navMp">Matéria-Prima</span><span class="sc" id="sc-mp">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <div class="sb-lbl" data-i18n="navComercial">Comercial</div>
      <button class="sbi" id="sb-exp" onclick="go('exp')">
        <i class="ti ti-ship si"></i><span class="sn" data-i18n="navExp">Exportação</span>
      </button>
      <button class="sbi" id="sb-res" onclick="go('res')">
        <i class="ti ti-handshake si"></i><span class="sn" data-i18n="navRes">Reservas</span><span class="sc" id="sc-res">—</span>
      </button>
    </div>
    <div class="sb-div"></div>
    <div class="sb-sec">
      <button class="sbi" id="sb-audit" onclick="go('audit')">
        <i class="ti ti-shield-check si"></i><span class="sn" data-i18n="navAudit">Auditoria</span>
      </button>
    </div>
  </div>

  <div class="content" id="content">
    <div id="ld-area" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:14px">
      <div style="width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite"></div>
      <div id="lprog" style="font-size:13px;color:var(--txtm)" data-i18n="loadingMsg">Carregando dados...</div>
    </div>
    <div id="err-area" style="display:none"></div>
    <div id="mc" style="display:none">

      <!-- ══ DASHBOARD ══ -->
      <div id="tab-dash" class="tab on">
        <div id="dash-cat" style="margin-bottom:20px"></div>
        <div class="k4" id="dash-wh"></div>
        <div id="dash-top10"></div>
      </div>

      <!-- ══ TODOS ══ -->
      <div id="tab-todos" class="tab">
        <div class="fam-pills" id="todos-pills"></div>
        <div class="fb">
          <div class="sbar"><i class="ti ti-search"></i><input id="todos-q" placeholder="Nomenclatura ou código..." data-i18n-placeholder="searchPh" oninput="renderCat('todos')"></div>
          <select class="sel" id="todos-wh" onchange="renderCat('todos')"><option value="" data-i18n="optTodosArm">Todos os armazéns</option></select>
        </div>
        <div class="cgrid" id="todos-cards"></div>
        <div id="todos-mp-sec" style="display:none"></div>
      </div>

      <!-- ══ CATEGORIAS (inv/ev/bess/kit/strbox/div/mot) ══ -->
      <div id="tab-inv" class="tab"><div class="fam-pills" id="inv-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="inv-q" placeholder="Nomenclatura ou código..." oninput="renderCat('inv')"></div><select class="sel" id="inv-wh" onchange="renderCat('inv')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="inv-cards"></div><div id="inv-mp-sec" style="display:none"></div></div>
      <div id="tab-ev" class="tab"><div class="fam-pills" id="ev-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="ev-q" placeholder="Nomenclatura ou código..." oninput="renderCat('ev')"></div><select class="sel" id="ev-wh" onchange="renderCat('ev')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="ev-cards"></div><div id="ev-mp-sec" style="display:none"></div></div>
      <div id="tab-bess" class="tab"><div class="fam-pills" id="bess-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="bess-q" placeholder="Nomenclatura ou código..." oninput="renderCat('bess')"></div><select class="sel" id="bess-wh" onchange="renderCat('bess')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="bess-cards"></div><div id="bess-mp-sec" style="display:none"></div></div>
      <div id="tab-kit" class="tab"><div class="fam-pills" id="kit-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="kit-q" placeholder="Nomenclatura ou código..." oninput="renderCat('kit')"></div><select class="sel" id="kit-wh" onchange="renderCat('kit')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="kit-cards"></div><div id="kit-mp-sec" style="display:none"></div></div>
      <div id="tab-strbox" class="tab"><div class="fam-pills" id="strbox-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="strbox-q" placeholder="Nomenclatura ou código..." oninput="renderCat('strbox')"></div><select class="sel" id="strbox-wh" onchange="renderCat('strbox')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="strbox-cards"></div><div id="strbox-mp-sec" style="display:none"></div></div>
      <div id="tab-div" class="tab"><div class="fam-pills" id="div-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-search"></i><input id="div-q" placeholder="Nomenclatura ou código..." oninput="renderCat('div')"></div><select class="sel" id="div-wh" onchange="renderCat('div')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="div-cards"></div><div id="div-mp-sec" style="display:none"></div></div>
      <div id="tab-mot" class="tab"><div class="fam-pills" id="mot-pills"></div><div class="fb"><div class="sbar"><i class="ti ti-propeller"></i><input id="mot-q" placeholder="Nomenclatura ou código..." oninput="renderCat('mot')"></div><select class="sel" id="mot-wh" onchange="renderCat('mot')"><option value="">Todos os armazéns</option></select></div><div class="cgrid" id="mot-cards"></div><div id="mot-mp-sec" style="display:none"></div></div>

      <!-- ══ MATÉRIA-PRIMA ══ -->
      <div id="tab-mp" class="tab">
        <div class="fam-pills" id="mp-pills"></div>
        <div class="fb">
          <div class="sbar"><i class="ti ti-search"></i><input id="mp-q" placeholder="Nomenclatura ou código..." oninput="renderCat('mp')"></div>
          <select class="sel" id="mp-wh" onchange="renderCat('mp')"><option value="">Todos os armazéns</option></select>
        </div>
        <div class="cgrid" id="mp-cards"></div>
      </div>

      <!-- ══ EXPORTAÇÃO ══ -->
      <div id="tab-exp" class="tab">
        <div style="margin-bottom:14px">
          <div style="font-size:13px;color:var(--txtm);margin-bottom:10px">
            Produtos monitorados para exportação — estoque em tempo real.
          </div>
        </div>
        <div class="cgrid" id="exp-cards"></div>
      </div>

      <!-- ══ RESERVAS ══ -->
      <div id="tab-res" class="tab">
        <div class="fb">
          <div class="sbar"><i class="ti ti-search"></i><input id="res-q" placeholder="Produto, cliente, código, resp..." oninput="rRes()"></div>
          <select class="sel" id="res-dir" onchange="rRes()"><option value="">Todas as diretorias</option></select>
          <select class="sel" id="res-arm" onchange="rRes()"><option value="">Todos os armazéns</option></select>
        </div>
        <div id="res-summary"></div>
        <div style="font-size:11px;color:var(--txtm);margin:6px 0 10px">

// ── Helpers ──
const pn = v=>{
  if(v===null||v===undefined||v==='') return 0;
  let s=String(v).trim().replace(/[R$\s]/g,'');
  if(!s||s==='-'||s==='—') return 0;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.');
  else if(s.includes('.')) s=s.replace(/\./g,'');
  s=s.replace(/[^0-9.\-]/g,'');
  return parseFloat(s)||0;
};
const fmt = n=>Math.round(n).toLocaleString('pt-BR');
const tr = (s,n=55)=> s&&s.length>n? s.slice(0,n)+'…' : (s||'—');
const norm = s=> String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
function makeCI(hdr){ return function(...names){ for(const n of names){ const i=hdr.findIndex(h=>norm(h)===norm(n)); if(i>=0) return i; } return -1; }; }

function resolveWH(code){
  const c=String(code||'').trim();
  if(WH_MAP[c]) return WH_MAP[c].nome;
  if(WH_NAMES[c]) return WH_NAMES[c];
  const stripped=c.replace(/^0+/,'');
  if(WH_MAP[stripped]) return WH_MAP[stripped].nome;
  if(WH_NAMES[stripped]) return WH_NAMES[stripped];
  const l=c.toLowerCase();
  if(l.includes('livoltek')||l.includes('fábrica')||l.includes('fabrica')) return 'Fábrica Livoltek';
  if(l.includes('curitiba')) return 'Curitiba (Eletra)';
  if(l.includes('fortaleza')) return 'Fortaleza (Eletra)';
  if(l.includes('manaus')) return 'Manaus (Eletra)';
  return c;
}
function isWHValido(code){
  const c=String(code||'').trim(); if(!c) return false;
  if(WH_MAP[c]) return true;
  const stripped=c.replace(/^0+/,''); if(WH_MAP[stripped]) return true;
  return WH_LIST.includes(resolveWH(c));
}

function parseArmazens(csv){
  const parsed=Papa.parse(csv.replace(/^\uFEFF/,''),{header:true,skipEmptyLines:true,delimiter:';',transformHeader:h=>norm(h)});
  const map={};
  parsed.data.forEach(r=>{
    const cod=String(r['CODIGO_ARMAZEM']||r['CODIGO ARMAZEM']||'').trim();
    const nome=String(r['NOME_ARMAZEM']||r['NOME ARMAZEM']||'').trim();
    const tipo=String(r['TIPO']||'').trim();
    if(!cod||!nome) return;
    const tipoNorm=tipo.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\uFFFD/g,'');
    let nomeDash;
    if(cod==='1010'||tipoNorm.toUpperCase().includes('FABRICA')) nomeDash='Fábrica Livoltek';
    else if(tipoNorm&&tipoNorm!=='Filial') nomeDash=`${nome} (${tipoNorm})`;
    else nomeDash=`${nome} (Eletra)`;
    map[cod]={nome:nomeDash,tipo,codigo:cod};
  });
  SRC_TS.armazens=new Date();
  return map;
}

function parseCadastro(csv){
  const fixEnc = s=>String(s||'').trim().replace(/\uFFFD/g,'');
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:false,skipEmptyLines:true,delimiter:';'}).data;
  if(!all.length) return {};
  let hdrIdx=0;
  for(let i=0;i<Math.min(3,all.length);i++){ if(all[i].join('|').toUpperCase().replace(/[^A-Z|]/g,'').includes('CODIGO')){hdrIdx=i;break;} }
  const hdr=all[hdrIdx];
  const ci=makeCI(hdr);
  const iCOD = ci('CODIGO','CÓDIGO')>=0?ci('CODIGO','CÓDIGO'):0;
  const iDESC= ci('DESCRICAO')>=0?ci('DESCRICAO'):1;
  const iTOP = ci('TOP MANAGER','CODIGO TOP MANAGER')>=0?ci('TOP MANAGER','CODIGO TOP MANAGER'):2;
  const iCAT = ci('Categoria','CATEGORIA')>=0?ci('Categoria','CATEGORIA'):3;
  const iFAM = ci('Família','Familia','FAMILIA')>=0?ci('Família','Familia','FAMILIA'):4;
  const iNOM = ci('Nomenclatura','NOMENCLATURA')>=0?ci('Nomenclatura','NOMENCLATURA'):5;
  const map={}, dupl=[];
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    const codigo=String(r[iCOD]||'').trim().toUpperCase();
    if(!codigo) continue;
    if(map[codigo]){ dupl.push(codigo); continue; }
    map[codigo]={
      codigo, descricao:String(r[iDESC]||'').trim(), topManager:String(r[iTOP]||'').trim(),
      categoria:fixEnc(r[iCAT]), familia:String(r[iFAM]||'').trim(), nomenclatura:String(r[iNOM]||'').trim()
    };
  }
  VAL_DUPLICADO=dupl.map(c=>({codigo:c,descricao:map[c]?.descricao||'',msg:'Código duplicado no cadastro_produtos'}));
  SRC_TS.cadastro=new Date();
  return map;
}

function parseEstoqueWH(csv, whCodigo){
  const WH_FROM_FILE = { curitiba:'Curitiba (Eletra)', fortaleza:'Fortaleza (Eletra)', manaus:'Manaus (Eletra)', fabrica_manaus:'Fábrica Livoltek' };
  const whNome = WH_FROM_FILE[whCodigo] || whCodigo;
  const clean=csv.replace(/^\uFEFF/,'');
  const all=Papa.parse(clean,{header:false,skipEmptyLines:true,delimiter:';'}).data;
  if(!all.length) return [];
  let hdrIdx=0;
  for(let i=0;i<Math.min(5,all.length);i++){
    const joined=all[i].join('|').toUpperCase();
    if(joined.includes('CODIGO')&&joined.includes('SALDO')){hdrIdx=i;break;}
  }
  const hdr=all[hdrIdx].map(h=>String(h).trim());
  const ci=makeCI(hdr);
  // FL (idx 5) = código do armazém principal (10108=Curitiba, etc.) — fixo por arquivo, não filtra
  // ARMZ (idx 6) = sub-armazém dentro do armazém. ARMZ=7 é o único comercial válido.
  const iCOD=ci('CODIGO'), iARMZ=ci('ARMZ'), iDESC=ci('DESCRICAO','DESCRIÇÃO');
  const iDISP=ci('ESTOQUE DISPONIVEL','ESTOQUE DISPONÍVEL');
  const iSAL=iDISP>=0 ? iDISP : ci('SALDO EM ESTOQUE');
  const iTP=ci('TP');
  const iARMZfinal = iARMZ>=0 ? iARMZ : 6; // fallback índice fixo 6

  const items=[];
  for(let i=hdrIdx+1;i<all.length;i++){
    const r=all[i];
    const codigo=String(r[iCOD]||'').trim().toUpperCase();
    if(!codigo) continue;

    // Filtro ARMZ=7: comparação numérica para evitar problemas com espaços/zeros à esquerda
    const armzRaw=String(r[iARMZfinal]||'').trim();
    const armzNum=parseInt(armzRaw,10);
    if(armzRaw && armzNum!==7) continue;

    const saldo=pn(iSAL>=0?r[iSAL]:0);
    const descricao=String(iDESC>=0?r[iDESC]||'':'').trim();
    const tp=String(r[iTP]||'').trim().toUpperCase();
    items.push({codigo,descricao,wh:whNome,saldo,reserva:0,fat:0,disp:0,
      categoria:'',familia:'',nomenclatura:'',isMP:false,_semCadastro:false,_incompleto:[],tp});
  }
  return items;
}

// Mapa fixo de código numérico de armazém → nome canônico
// Não depende de armazens.csv (excluído do repositório)
const ARMAZEM_CODIGO_MAP = {
  '10108': 'Curitiba (Eletra)',
  '10102': 'Fortaleza (Eletra)',
  '10106': 'Manaus (Eletra)',
  '1010':  'Fábrica Livoltek',
};

function normalizaArmazem(armRaw){
  const s = String(armRaw||'').trim();
  if(!s) return '';
  // Tenta por código numérico exato
  if(ARMAZEM_CODIGO_MAP[s]) return ARMAZEM_CODIGO_MAP[s];
  // Tenta pelo código sem zeros à esquerda
  if(ARMAZEM_CODIGO_MAP[s.replace(/^0+/,'')]) return ARMAZEM_CODIGO_MAP[s.replace(/^0+/,'')];
  // Tenta por nome completo (se já vier como texto)
  if(WH_LIST.includes(s)) return s;
  // Tenta por palavra-chave
  const sl = s.toLowerCase();
  if(sl.includes('curitiba')) return 'Curitiba (Eletra)';
  if(sl.includes('fortaleza')) return 'Fortaleza (Eletra)';
  if(sl.includes('manaus')&&!sl.includes('fabrica')&&!sl.includes('livoltek')) return 'Manaus (Eletra)';
  if(sl.includes('fabrica')||sl.includes('livoltek')) return 'Fábrica Livoltek';
  return s; // retorna o valor original se não reconhecido
}

function parseReservasSheets(csv){
  const csvClean=csv.replace(/^\uFEFF/,'');
  const detectedSep = csvClean.indexOf(';')!==-1 && (csvClean.indexOf(';')<(csvClean.indexOf(',')===-1?99999:csvClean.indexOf(','))) ? ';' : ',';
  const parsed=Papa.parse(csvClean,{header:true,skipEmptyLines:true,delimiter:detectedSep,
    transformHeader:h=>{
      const tt=h.trim().replace(/^\uFEFF/,'');
      if(tt.replace(/[^A-Za-z]/g,'').toUpperCase()==='CODIGO') return 'Codigo';
      return tt;
    }});
  const result=[];
  // Debug: logar colunas e primeiras linhas para diagnóstico
  if(parsed.data.length>0) console.log('📋 RESERVAS colunas:', Object.keys(parsed.data[0]));
  parsed.data.forEach((r,idx)=>{
    if(idx<5) console.log('RESERVA linha',idx,JSON.stringify(r));
    const _allKeys=Object.keys(r);
    const _codKey=_allKeys.find(k=>k.replace(/[^A-Za-z]/g,'').toUpperCase()==='CODIGO')||'';
    const codigo=String(r[_codKey]||r['Código']||r['Codigo']||r['CODIGO']||'').trim().toUpperCase();
    const qtd=pn(r['QUANTIDADE_RESERVADA']||r['Qtdade']||r['QTD']||r['Quantidade']||0);
    const cancelado=String(r['Cancelado']||r['CANCELADO']||'').trim();
    if(!codigo||qtd<=0||cancelado) return;
    const armRaw=String(r['CODIGO_ARMAZEM']||r['Armazem']||r['Armazém']||r['ARMAZEM']||r['armazem']||'').trim();
    // Resolve código numérico (ex: 10102) ou nome completo para nome canônico
    const wh=normalizaArmazem(armRaw);
    const whValido=WH_LIST.includes(wh);
    if(armRaw && !whValido){
      if(!VAL_RES_SEM_ARMAZEM.find(v=>v.codigo===codigo&&v.cliente===String(r['Cliente']||'').trim())){
        VAL_RES_SEM_ARMAZEM.push({
          codigo, cliente:String(r['Cliente']||'').trim(),
          qtd, armRaw: armRaw+'  (não reconhecido)'
        });
      }
      return; // não aplica reserva com armazém inválido
    }
    result.push({
      cliente:String(r['Cliente']||r['CLIENTE']||'').trim(),
      responsavel:String(r['Responsavel']||r['Responsável']||r['RESPONSAVEL']||'').trim(),
      diretoria:String(r['Diretoria']||r['DIRETORIA']||'').trim(),
      codigo, obs:String(r['OBSERVACAO']||r['Observações']||r['OBS']||'').trim(),
      wh, armRaw, qtd, solicitado:String(r['Solicitado']||'').trim(),
    });
  });
  SRC_TS.reservas=new Date();
  return result;
}

// ══ PARSER: Pedidos Faturados (abate do estoque a partir de DATA_CORTE_FATURADOS)
// Lê o mesmo pedidos.csv do repositório Pedidos-Livoltek.
// Filtra status ENVIADO PARA FATURAMENTO (PD) com data de envio >= DATA_CORTE_FATURADOS.
// Agrupa por Código Produto + Warehouse → soma qtd para abater do estoque disponível.
function parsePedidosFaturados(csvText){
  const result = {}; // { 'wh|codigo': {wh, codigo, qtd, pedidos:[]} }
  const clean = csvText.replace(/^\uFEFF/,'');
  const lines = clean.split('\n');
  if(!lines.length) return result;

  const sep = lines[0].includes(';') ? ';' : ',';
  const hdr = lines[0].split(sep).map(h=>h.trim().toLowerCase());

  const iPO    = hdr.findIndex(h=>h.includes('po')&&h.includes('relacionado'));
  const iEnvio = hdr.findIndex(h=>h.includes('data envio faturamento'));
  const iWH    = hdr.findIndex(h=>h.includes('warehouse'));
  const iCod   = hdr.findIndex(h=>h.includes('digo')&&h.includes('produto'));
  const iQtd   = hdr.findIndex(h=>h.includes('qtdade')||h==='qtd');

  const seen = new Set(); // controle de PO já processado (evitar duplicar linhas multi-item)
  const poEnvio = {}; // { po: {dataEnvio, wh} }

  // 1ª passagem: coletar data de envio e warehouse por PO (vem na primeira linha de cada PO)
  lines.slice(1).forEach(line=>{
    const cols = line.split(sep);
    const po = (cols[iPO]||'').trim();
    if(!po||!po.startsWith('LIV')) return;
    const envio = (cols[iEnvio]||'').trim();
    const wh = (cols[iWH]||'').trim();
    if(!poEnvio[po]) poEnvio[po] = {dataEnvio: envio, wh};
  });

  // 2ª passagem: somar qtd por produto+armazém para POs faturados após DATA_CORTE
  lines.slice(1).forEach(line=>{
    const cols = line.split(sep);
    const po = (cols[iPO]||'').trim();
    if(!po||!po.startsWith('LIV')) return;
    const info = poEnvio[po];
    if(!info||!info.dataEnvio) return; // sem data de envio = não faturado

    // Verificar data de corte
    const partes = info.dataEnvio.split('/');
    if(partes.length!==3) return;
    const dataEnvio = new Date(partes[2], partes[1]-1, partes[0]);
    if(dataEnvio < DATA_CORTE_FATURADOS) return;

    const cod = (cols[iCod]||'').trim().toUpperCase();
    const qtd = parseFloat((cols[iQtd]||'0').replace(',','.')) || 0;
    if(!cod||qtd<=0) return;

    const wh = resolveWH(info.wh);
    const k = wh+'|'+cod;
    if(!result[k]) result[k] = {wh, codigo:cod, qtd:0, pedidos:[]};
    result[k].qtd += qtd;
    if(!result[k].pedidos.includes(po)) result[k].pedidos.push(po);
  });

  return result;
}

  // fallback: reserva.csv local — mesmo schema legado (Cliente;Responsavel;Diretoria;Código;Observações;Armazem;Qtdade;Cancelado;Solicitado)

// ── JOIN ──
function joinCadastro(items){
  // ESTOQUE.csv já traz Categoria, Família e Nomenclatura nas colunas 15-17.
  // joinCadastro complementa com dados do cadastro_produtos.csv quando disponível,
  // mas não sobrescreve se o campo já veio preenchido do CSV principal.
  const isMP_cat=cat=>{
    const u=(cat||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    return u.includes('MATERIA')&&u.includes('PRIMA');
  };
  items.forEach(s=>{
    const cad=CADASTRO[s.codigo];
    s._semCadastro=!cad;
    if(cad){
      // Usa dado do ESTOQUE.csv se preenchido, senão cai no cadastro_produtos
      if(!s.nomenclatura) s.nomenclatura=cad.nomenclatura||s.descricao;
      if(!s.familia)      s.familia=cad.familia||'';
      if(!s.categoria)    s.categoria=(cad.categoria||'').toUpperCase();
    }
    s.isMP=isMP_cat(s.categoria);
    // Recalcular _catTab com dados enriquecidos
    const FAM_ABA={'INVERSOR':'inv','CARREGADOR':'ev','BATERIA':'bess','BESS':'bess','KIT SOLAR':'kit','STRING BOX':'strbox','MOTOR DE BARCO':'mot'};
    if(!s.isMP){
      const f=(s.familia||'').toUpperCase();
      s._catTab='div';
      for(const [key,tab] of Object.entries(FAM_ABA)){ if(f.includes(key)){s._catTab=tab;break;} }
    } else { s._catTab='mp'; }
  });
}

function applyReservas(){
  // Toda reserva real SEMPRE vem com armazém informado — não é uma situação normal
  // ela chegar sem armazém válido. Se acontecer, é erro de cadastro no Sheets e deve
  // ser sinalizado na Auditoria, nunca "adivinhado" automaticamente no cálculo.
  ST.forEach(s=>{ s.reserva=0; });

  // Soma a reserva por chave armazém|código UMA VEZ (não por linha de RES.forEach repetida)
  const lkpRes={}; // 'wh|codigo' -> qtd total reservada
  RES.forEach(r=>{
    const whValido = r.wh && WH_LIST.includes(r.wh);
    if(!whValido){
      if(!VAL_RES_SEM_ARMAZEM.find(v=>v.codigo===r.codigo&&v.cliente===r.cliente)){
        VAL_RES_SEM_ARMAZEM.push({codigo:r.codigo,cliente:r.cliente,qtd:r.qtd,armRaw:r.armRaw||r.wh||'(vazio)'});
      }
      return;
    }
    const k=r.wh+'|'+r.codigo;
    lkpRes[k]=(lkpRes[k]||0)+r.qtd;
  });

  // Aplica reservas em linhas existentes de ST (1 vez por armazém+código)
  const aplicado=new Set();
  ST.forEach(s=>{
    const k=s.wh+'|'+s.codigo;
    if(lkpRes[k] && !aplicado.has(k)){
      s.reserva = lkpRes[k];
      aplicado.add(k);
    }
  });

  // Para reservas sem linha correspondente em ST (produto com saldo zero/ausente no CSV),
  // cria uma linha virtual com saldo=0 — assim o disponível fica negativo (-reserva),
  // mostrando corretamente que há compromisso maior que o estoque disponível.
  Object.entries(lkpRes).forEach(([k, qtd])=>{
    if(aplicado.has(k)) return; // já foi aplicado em linha real do ST
    const [wh, ...codParts] = k.split('|');
    const codigo = codParts.join('|');
    const cadItem = CADASTRO[codigo] || {};
    const linhaVirtual = {
      codigo, wh, saldo:0, reserva:qtd, disp:-qtd, armz:'07',
      descricao: cadItem.descricao||codigo,
      nomenclatura: cadItem.nomenclatura||cadItem.descricao||codigo,
      familia: cadItem.familia||'', categoria: cadItem.categoria||'',
      isMP: false, _semCadastro:!cadItem.nomenclatura, _incompleto:[],
      _byWH:{}, _sal:0, _res:qtd, _disp:-qtd, tp:''
    };
    ST.push(linhaVirtual);
    VAL_INSUFICIENTE.push({codigo, descricao:linhaVirtual.nomenclatura, wh, saldo:0, reserva:qtd, disp:-qtd});
  });

  // Aplicar faturados no disp — FAT pode ainda não ter sido carregado aqui
  // então a aplicação final é feita em applyFaturados(), chamado depois do boot
  ST.forEach(s=>{ s.fat=0; s.disp = s.saldo - s.reserva; });
}

// Chamado APÓS parsePedidosFaturados() — desconta faturados do disponível
function applyFaturados(){
  // Zerar fat antes de reaplicar
  ST.forEach(s=>{ s.fat=0; });
  const aplicadoFat=new Set();
  Object.entries(FAT).forEach(([k,v])=>{
    const [wh,...codParts]=k.split('|');
    const codigo=codParts.join('|');
    // Aplicar na primeira linha do ST que bate com armazém+código (mesmo padrão da reserva)
    for(const s of ST){
      const sk=s.wh+'|'+s.codigo;
      if(sk===k && !aplicadoFat.has(k)){
        s.fat=v.qtd;
        aplicadoFat.add(k);
        break;
      }
    }
    // Se não existe linha em ST para esse produto+armazém faturado, cria linha virtual
    if(!aplicadoFat.has(k)){
      const cadItem=CADASTRO[codigo]||{};
      ST.push({
        codigo, wh, saldo:0, reserva:0, fat:v.qtd, disp:-v.qtd, armz:'07',
        descricao:cadItem.descricao||codigo,
        nomenclatura:cadItem.nomenclatura||cadItem.descricao||codigo,
        familia:cadItem.familia||'', categoria:cadItem.categoria||'',
        isMP:false, _semCadastro:!cadItem.nomenclatura, _incompleto:[],
        _byWH:{}, _sal:0, _res:0, _fat:v.qtd, _disp:-v.qtd, tp:''
      });
      aplicadoFat.add(k);
    }
  });
  // Recalcular disp = saldo - reserva - fat
  ST.forEach(s=>{ s.disp = s.saldo - s.reserva - (s.fat||0); });
}

function validateAll(){
  VAL_SEM_CADASTRO=[]; VAL_INCOMPLETO=[]; VAL_INSUFICIENTE=[]; VAL_NEGATIVO=[];
  ST.forEach(s=>{
    if(s._semCadastro){ if(!VAL_SEM_CADASTRO.find(v=>v.codigo===s.codigo)) VAL_SEM_CADASTRO.push({codigo:s.codigo,descricao:s.descricao,wh:s.wh}); }
    if(AUDIT_INCOMPLETO_ATIVO&&s._incompleto&&s._incompleto.length>0) VAL_INCOMPLETO.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,campos:s._incompleto});
    if(s.disp<0) VAL_INSUFICIENTE.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,saldo:s.saldo,reserva:s.reserva,disp:s.disp});
    if(s.saldo<0) VAL_NEGATIVO.push({codigo:s.codigo,descricao:s.nomenclatura||s.descricao,wh:s.wh,saldo:s.saldo});
  });
}

function syncWHFromMap(){
  WH_LIST.length=0;

// ══ DEDUP ══
function dedup(items){
  const m={};
  items.forEach(r=>{
    if(!m[r.codigo]) m[r.codigo]={...r,_byWH:{},_sal:0,_res:0,_fat:0,_disp:0};
    if(!m[r.codigo]._byWH[r.wh]) m[r.codigo]._byWH[r.wh]={saldo:0,reserva:0,fat:0,disp:0};
    m[r.codigo]._byWH[r.wh].saldo+=r.saldo;
    m[r.codigo]._byWH[r.wh].reserva+=r.reserva;
    m[r.codigo]._byWH[r.wh].fat+=(r.fat||0);
    m[r.codigo]._byWH[r.wh].disp+=r.disp;
    m[r.codigo]._sal+=r.saldo;
    m[r.codigo]._res+=r.reserva;
    m[r.codigo]._fat+=(r.fat||0);
    m[r.codigo]._disp+=r.disp;
  });
  return Object.values(m);
}

function pCard(r, isMP){

  const famLabel=r.familia||r.categoria||'';
  const famCol=isMP?'var(--red)':'var(--pri)';
  const famBg=isMP?'var(--red-pale)':'var(--pri-pale)';

  const whRows=WH_LIST.map(w=>{
    const d=r._byWH[w]; if(!d||!d.saldo) return '';
    const c=WH_COLOR[w]; const ico=WH_ICON[w];
    return `<div class="pc2-wh-row">
      <i class="ti ${ico}" style="color:${c};font-size:12px"></i>

  // Detalhe de faturado por armazém usando _byWH.fat (já acumulado em dedup)
  const fatWhRows=WH_LIST.map(w=>{

      <span class="pc2-wh-name">${w}</span>
      <span class="pc2-wh-val" style="color:var(--cor-laranja)">${fmt(d.fat)}</span>
    </div>`;
  }).join('');

  const fatPedidos=[...new Set(
    Object.entries(FAT).filter(([k])=>k.endsWith('|'+r.codigo)).flatMap(([,v])=>v.pedidos)
  )];

  const nom=r.nomenclatura||r.descricao||r.codigo;

  return `<div class="pc2${isMP?' mp':''}">
    <div class="pc2-top">
      <div class="pc2-head">
        <div class="pc2-nom">${tr(nom,48)}</div>

      </div>
      ${isMP?'<div class="mp-badge"><i class="ti ti-box" style="font-size:10px"></i> MATÉRIA-PRIMA</div>':''}
      <div class="pc2-cod">${r.codigo}</div>

      <div class="pc2-disp-lbl">Disponível para Venda</div>
      <div class="pc2-disp-val" style="color:${dispCol}">${fmt(disp)}</div>
    </div>
    <div class="pc2-wh-list" style="flex:1">${whRows||'<span class="pc2-no-stock">Sem saldo em estoque</span>'}</div>
    <div class="pc2-totals">
      <div class="pc2-total-row"><span>Estoque Total</span><span>${fmt(sal)}</span></div>
      ${res>0?`<div class="pc2-total-row pc2-res"><span><i class="ti ti-bookmark"></i> Reserva</span><span>${fmt(res)}</span></div>`:''}
      ${fat>0?`
        <div class="pc2-total-row pc2-fat"><span><i class="ti ti-truck-delivery"></i> Faturado</span><span>${fmt(fat)}</span></div>
        ${fatWhRows}
        <div class="pc2-note">${fatPedidos.length} pedido${fatPedidos.length>1?'s':''} · desde ${DATA_CORTE_FATURADOS.toLocaleDateString('pt-BR')}</div>`:''}
      ${res>0||fat>0?`<div class="pc2-note">Reserva e faturados já abatidos do disponível.</div>`:''}
    </div>
  </div>`;
}

// Filtro ativo por aba: { tabId: 'NOME_DA_FAMILIA' | '' }
const famFilters={};

function setFam(tabId, fam){
  famFilters[tabId] = (famFilters[tabId]===fam) ? '' : fam; // clicar de novo desmarca
  renderCat(tabId);
}

function renderFamPills(tabId, baseRows){
  const pillsEl=document.getElementById(tabId+'-pills');
  if(!pillsEl) return;
  // Extrai famílias únicas da coluna FAMILIA do cadastro_produtos, só com produtos desta aba
  const familias=[...new Set(baseRows.map(r=>r.familia).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(!familias.length){ pillsEl.innerHTML=''; return; }
  const ativa=famFilters[tabId]||'';
  pillsEl.innerHTML = familias.map(f=>{
    const on = f===ativa;
    return `<button class="fam-pill${on?' on':''}" onclick="setFam('${tabId}','${f.replace(/'/g,"\\'")}')">${f}</button>`;
  }).join('');
}

function renderCat(tabId){
  const q=(document.getElementById(tabId+'-q')?.value||'').toLowerCase();
  const wh=document.getElementById(tabId+'-wh')?.value||'';
  const famAtiva=famFilters[tabId]||'';

  let baseRows = tabId==='todos' ? ST.slice() : ST.filter(r=>getCatTab(r)===tabId);
  renderFamPills(tabId, baseRows); // pills sempre refletem o universo da aba, antes do filtro de família

  let rows = baseRows;
  if(famAtiva) rows=rows.filter(r=>r.familia===famAtiva);
  if(q) rows=rows.filter(r=> (r.nomenclatura||'').toLowerCase().includes(q) || (r.descricao||'').toLowerCase().includes(q) || r.codigo.toLowerCase().includes(q));
  if(wh) rows=rows.filter(r=>r.wh===wh);
  const dd=dedup(rows).sort((a,b)=>(a.nomenclatura||a.descricao||'').localeCompare(b.nomenclatura||b.descricao||'','pt-BR'));

  const isMPTab = tabId==='mp';
  const cardsEl=document.getElementById(tabId+'-cards');
  if(cardsEl) cardsEl.innerHTML=dd.map(r=>pCard(r,isMPTab||r.isMP)).join('') ||
    `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--txtm);font-size:13px">Nenhum produto encontrado.</div>`;
}

function buildProdCard(g, modoDiretoria, isFiltered){
  const st=ST.find(s=>s.codigo===g.codigo);
  const nom=st?.nomenclatura||st?.descricao||g.codigo;
  const familia=st?.familia||'';
  const stRows=ST.filter(s=>s.codigo===g.codigo);
  const sal=stRows.reduce((a,r)=>a+r.saldo,0);
  const reservaTotalReal=dedup(stRows).reduce((a,r)=>a+r._res,0);
  const dispTotalReal=dedup(stRows).reduce((a,r)=>a+r._disp,0);

  // Quando há filtro ativo (busca/diretoria/armazém), a Reserva e o Disponível exibidos
  // refletem SÓ o que está filtrado na tela — para não contradizer a lista de clientes
  // abaixo, que também é filtrada. Sem filtro, os dois valores são iguais ao total real.
  const reservaExibida = isFiltered ? g.totalQtd : reservaTotalReal;
  const dispExibido = isFiltered ? (sal - g.totalQtd) : dispTotalReal;

  const dispCol=dispExibido>0?'var(--grn-d)':dispExibido===0&&sal>0?'var(--amb-d)':'var(--red)';
  const sortedRes=g.reservas.slice().sort((a,b)=>b.qtd-a.qtd);
  const expanded=resExpanded.has(g.codigo);

  const whMap={};
  stRows.forEach(r=>{whMap[r.wh]=(whMap[r.wh]||0)+r.saldo;});
  const whRows=Object.entries(whMap).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([w,v])=>`<div class="pc2-wh-row"><i class="ti ti-building-warehouse" style="color:${WH_COLOR[w]||'#94a3b8'}"></i><span class="pc2-wh-name">${w}</span><span class="pc2-wh-val">${fmt(v)}</span></div>`).join('');

  const dispLbl = isFiltered ? 'Disponível (filtro ativo)' : 'Disponível Total';
  const resLbl = isFiltered ? 'Reserva (filtro ativo)' : 'Reserva';

  return `<div class="pc2">
    <div class="pc2-top">
      <div class="pc2-head"><div class="pc2-nom">${nom}</div>${familia?`<span class="pc2-pill" style="color:var(--pri);background:var(--pri-pale)">${familia}</span>`:''}</div>

    </div>

    <div class="pc2-wh-list">${whRows||'<span class="pc2-no-stock">Sem saldo em estoque</span>'}</div>
    <div class="pc2-totals"><div class="pc2-total-row pc2-res"><span><i class="ti ti-bookmark"></i> ${resLbl}</span><span>${fmt(reservaExibida)}</span></div>
    ${isFiltered?`<div class="pc2-note">Reserva total do produto (todas as diretorias/buscas): ${fmt(reservaTotalReal)}</div>`:''}
    </div>
    <div class="pc2-cli-toggle${expanded?' open':''}" onclick="toggleResCard('${g.codigo}')">
      <span><i class="ti ti-users"></i> ${nCli} cliente${nCli>1?'s':''} · ${fmt(g.totalQtd)} un.</span>

  </div>`;
}

function rRes(){
  const q=(document.getElementById('res-q')?.value||'').toLowerCase();
  const dir=document.getElementById('res-dir')?.value||'';
  const arm=document.getElementById('res-arm')?.value||'';
  const isFiltered = !!(q||dir||arm); // qualquer filtro ativo torna a Reserva exibida "parcial"
  const rows=RES.filter(r=>{
    const stNom=(ST.find(s=>s.codigo===r.codigo)?.nomenclatura||'').toLowerCase();
    const mq=!q||r.cliente.toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q)||stNom.includes(q)||(r.responsavel||'').toLowerCase().includes(q);
    const md=!dir||r.diretoria===dir;
    const ma=!arm||(r.wh||'').toLowerCase().includes(arm.toLowerCase());
    return mq&&md&&ma;
  });
  const byCode={};
  rows.forEach(r=>{
    if(!byCode[r.codigo]) byCode[r.codigo]={codigo:r.codigo,reservas:[],totalQtd:0,whs:new Set()};
    byCode[r.codigo].reservas.push(r); byCode[r.codigo].totalQtd+=r.qtd; if(r.wh) byCode[r.codigo].whs.add(r.wh);
  });
  const grupos=Object.values(byCode).sort((a,b)=>b.totalQtd-a.totalQtd);
  document.getElementById('res-cnt').textContent=rows.length;
  document.getElementById('res-prod-cnt').textContent=grupos.length;
  const el=document.getElementById('res-cards');
  el.innerHTML = grupos.length ? grupos.map(g=>buildProdCard(g,!!dir,isFiltered)).join('') :
    `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--txtm)"><i class="ti ti-bookmark-off"></i><div>Nenhuma reserva encontrada</div></div>`;
}

// ══ SIDEBAR / SELECTS ══
function updateSidebar(){
  const tabs=['inv','ev','bess','kit','strbox','div','mot','mp'];
  tabs.forEach(tb=>{
    const n=new Set(ST.filter(r=>getCatTab(r)===tb).map(r=>r.codigo)).size;
    const el=document.getElementById('sc-'+tb); if(el) el.textContent=n;
  });
  document.getElementById('sc-todos').textContent=new Set(ST.map(r=>r.codigo)).size;
  document.getElementById('sc-res').textContent=new Set(RES.map(r=>r.codigo)).size;
}

function populateSelects(){
  ['todos','inv','ev','bess','kit','strbox','div','mot','mp'].forEach(tb=>{
    const sel=document.getElementById(tb+'-wh'); if(!sel) return;
    const cur=sel.value;
    sel.innerHTML=`<option value="">Todos os armazéns</option>`+WH_LIST.map(w=>`<option value="${w}">${w}</option>`).join('');
    sel.value=cur;
  });
  const dirSel=document.getElementById('res-dir');
  if(dirSel){
    const dirs=[...new Set(RES.map(r=>r.diretoria).filter(Boolean))].sort();
    dirSel.innerHTML=`<option value="">Todas as diretorias</option>`+dirs.map(d=>`<option value="${d}">${d}</option>`).join('');
  }
  const armSel=document.getElementById('res-arm');
  if(armSel) armSel.innerHTML=`<option value="">Todos os armazéns</option>`+WH_LIST.map(w=>`<option value="${w}">${w}</option>`).join('');
}

// ══ AUDITORIA ══
function rAudit(){
  const N=fmt;
  const fmtTS=ts=>ts?ts.toLocaleString('pt-BR'):'—';
  const toggleBtn=`<button onclick="AUDIT_INCOMPLETO_ATIVO=!AUDIT_INCOMPLETO_ATIVO;validateAll();rAudit();"
    style="padding:4px 10px;border:1px solid ${AUDIT_INCOMPLETO_ATIVO?'var(--grn-d)':'var(--brd)'};border-radius:6px;
    background:${AUDIT_INCOMPLETO_ATIVO?'var(--grn-pale)':'var(--surf)'};font-size:11px;cursor:pointer;margin-left:8px">
    ${AUDIT_INCOMPLETO_ATIVO?'✅ Ativo':'☐ Ativar'}</button>`;

  const fonteRows=[
    {nome:'Estoque (CSVs)',ts:SRC_TS.estoque,cnt:ST.length,unit:'registros'},
    {nome:'Cadastro de Produtos',ts:SRC_TS.cadastro,cnt:Object.keys(CADASTRO).length,unit:'SKUs'},
    {nome:'Armazéns',ts:SRC_TS.armazens,cnt:Object.keys(WH_MAP).length,unit:'armazéns'},
    {nome:'Reservas',ts:SRC_TS.reservas,cnt:RES.length,unit:'reservas'},
  ].map(f=>`<tr><td>${f.nome}</td><td style="text-align:right;font-family:'DM Mono',monospace">${f.cnt} ${f.unit}</td>
    <td>${fmtTS(f.ts)}</td><td>${f.ts?'✅':'❌'}</td></tr>`).join('');

  const alertRows=SRC_ALERTS.map(a=>`<tr style="background:#fff5f5"><td colspan="2" style="color:#dc2626;font-weight:600">${a.fonte}</td><td colspan="2">${a.msg}</td></tr>`).join('');

  const semCadRows=VAL_SEM_CADASTRO.slice(0,30).map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.descricao||'—'}</td><td>${v.wh}</td></tr>`).join('');
  const whInvRows=VAL_WH_INVALIDO.map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.fonte}</td><td>${v.descricao}</td></tr>`).join('');
  const insufRows=VAL_INSUFICIENTE.map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#dc2626">${v.codigo}</td><td>${v.descricao||'—'}</td><td>${v.wh}</td>
    <td style="text-align:right">${fmt(v.saldo)}</td><td style="text-align:right;color:var(--pur)">${fmt(v.reserva)}</td><td style="text-align:right;color:#dc2626;font-weight:700">${fmt(v.disp)}</td></tr>`).join('');
  const resSemArmRows=VAL_RES_SEM_ARMAZEM.map(v=>`<tr><td style="font-family:'DM Mono',monospace;color:#991b1b;font-weight:700">${v.codigo}</td>
    <td>${v.cliente||'—'}</td><td style="text-align:right;font-weight:700">${fmt(v.qtd)}</td>
    <td style="color:#991b1b">"${v.armRaw}"</td></tr>`).join('');

  // ── Bloco crítico em destaque no TOPO: reservas sem armazém válido
  // Toda reserva deveria sempre ter armazém informado — quando isso falha,
  // a reserva NÃO é descontada do cálculo (para não "adivinhar" o armazém errado),
  // então o disponível pode aparecer maior do que realmente é até isso ser corrigido no Sheets.
  const resSemArmBlock = VAL_RES_SEM_ARMAZEM.length ? `
    <div class="aud-block">
      <div class="aud-hdr" style="background:#dc2626;color:#fff;font-size:15px">
        <i class="ti ti-alert-triangle"></i> RESERVA SEM ARMAZÉM INFORMADO — ${VAL_RES_SEM_ARMAZEM.length} ocorrência${VAL_RES_SEM_ARMAZEM.length>1?'s':''}
      </div>
      <div style="background:#fef2f2;border:2px solid #dc2626;border-top:none;padding:10px 14px;font-size:12px;color:#7f1d1d">
        Estas reservas <b>não foram aplicadas</b> ao cálculo de disponível porque o armazém informado é inválido ou está vazio.
        Toda reserva deveria sempre vir com armazém — corrija na planilha de Reservas e atualize a página.
      </div>
      <table class="aud-tbl" style="border:2px solid #dc2626;border-top:none">
        <tr style="background:#fef2f2"><th>Código</th><th>Cliente</th><th style="text-align:right">Qtd.</th><th>Armazém informado</th></tr>
        ${resSemArmRows}
      </table>
    </div>` : '';

  document.getElementById('audit-content').innerHTML=`
    ${resSemArmBlock}
    <div class="aud-block">
      <div class="aud-hdr" style="background:#e8eef6;color:#1E3A5F"><i class="ti ti-database"></i> Auditoria de Fontes</div>
      <table class="aud-tbl" style="border:1px solid var(--brd);border-top:none">
        <tr style="background:#f8fafc"><th>Fonte</th><th style="text-align:right">Registros</th><th>Última Atualização</th><th>Status</th></tr>
        ${fonteRows}${alertRows}
      </table>
    </div>
    ${VAL_SEM_CADASTRO.length?`<div class="aud-block">
      <div class="aud-hdr" style="background:#fee2e2;color:#991b1b"><i class="ti ti-alert-circle"></i> Produtos sem Cadastro Mestre — ${VAL_SEM_CADASTRO.length}</div>
      <table class="aud-tbl" style="border:1px solid #fca5a5;border-top:none">
        <tr style="background:#fff5f5"><th>Código</th><th>Descrição</th><th>Armazém</th></tr>${semCadRows}
      </table></div>`:''}
    ${VAL_WH_INVALIDO.length?`<div class="aud-block">
      <div class="aud-hdr" style="background:#fffbeb;color:#92400e"><i class="ti ti-map-pin-off"></i> Armazéns não Cadastrados — ${VAL_WH_INVALIDO.length}</div>
      <table class="aud-tbl" style="border:1px solid #fcd34d;border-top:none">
        <tr style="background:#fffbeb"><th>Código</th><th>Fonte</th><th>Detalhe</th></tr>${whInvRows}
      </table></div>`:''}
    ${VAL_INSUFICIENTE.length?`<div class="aud-block">
      <div class="aud-hdr" style="background:#fee2e2;color:#991b1b"><i class="ti ti-alert-triangle"></i> Estoque Insuficiente — ${VAL_INSUFICIENTE.length}</div>
      <table class="aud-tbl" style="border:1px solid #fca5a5;border-top:none">
        <tr style="background:#fff5f5"><th>Código</th><th>Produto</th><th>Armazém</th><th style="text-align:right">Saldo</th><th style="text-align:right">Reserva</th><th style="text-align:right">Disp.</th></tr>${insufRows}
      </table></div>`:''}
    <div style="padding:8px 12px;font-size:11px;color:var(--txtm);border:1px solid var(--brd);border-radius:8px">
      Validação de <b>Cadastro Incompleto</b> ${toggleBtn}
      ${VAL_DUPLICADO.length?`<br>⚠️ <b>${VAL_DUPLICADO.length} código(s) duplicado(s)</b>: ${VAL_DUPLICADO.map(v=>v.codigo).slice(0,5).join(', ')}`:''}
    </div>`;
}

function setStatus(s){
  const d=document.getElementById('sdot'), t2=document.getElementById('stxt');
  if(!d) return; d.className='dot';
  if(s==='ok'){d.classList.add('dot-g');t2.textContent='Base Atualizada';}
  else if(s==='warn'){d.classList.add('dot-a');t2.textContent='Dados parciais — verifique alertas';}
  else if(s==='loading'){d.classList.add('dot-a');t2.textContent='Carregando...';}
  else{d.classList.add('dot-r');t2.textContent='Erro ao carregar';}
}
function showErr(m){
  document.getElementById('ld-area').style.display='none';
  const e=document.getElementById('err-area'); e.style.display='block';
  e.innerHTML=`<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:16px;display:flex;gap:10px">
    <i class="ti ti-alert-circle" style="font-size:18px;color:#dc2626"></i>
    <div>${m}<br><button onclick="boot()" style="margin-top:8px;padding:5px 12px;background:var(--pri);color:#fff;border:none;border-radius:6px;cursor:pointer">Tentar novamente</button></div>
  </div>`;
  setStatus('err');
}
function renderSrcAlerts(){
  const el=document.getElementById('src-alerts');
  if(!SRC_ALERTS.length){ if(el) el.style.display='none'; return; }
  el.innerHTML=SRC_ALERTS.map(a=>`<div style="padding:8px 16px;background:#fffbeb;border-bottom:1px solid #fcd34d;font-size:12px;color:#92400e">
    <i class="ti ti-alert-triangle"></i> <b>${a.fonte}</b> — ${a.msg}</div>`).join('');
  el.style.display='block';
}

// ══ BOOT ══
const WAREHOUSES = ['curitiba','fortaleza','manaus','fabrica_manaus'];
const RESERVAS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3uDoajQWkalh8Tgks3Vl9G_hS8LHt19wtVmK33LydkfHE7fHBFVE4U3ajgbwVIpyaFiSLeOSYWGi5/pub?gid=577818960&single=true&output=csv';
const PEDIDOS_CSV_URL = 'https://raw.githubusercontent.com/smlivoltek/Pedidos-Livoltek/main/pedidos.csv';
const DATA_CORTE_FATURADOS = new Date(2026, 6, 1); // 01/07/2026 — mês 6 = julho (0-indexed), sem problema de timezone

// FATURADOS: { codigo -> { wh, qtd, pedidos:[] } } — abatido do estoque nos cards
let FAT = {};

async function boot(){
  setStatus('loading');
  document.getElementById('ld-area').style.display='flex';
  document.getElementById('err-area').style.display='none';
  document.getElementById('mc').style.display='none';
  ST=[]; RES=[]; FAT={};
  SRC_ALERTS.length=0;
  VAL_SEM_CADASTRO=[];VAL_INCOMPLETO=[];VAL_WH_INVALIDO=[];VAL_INSUFICIENTE=[];VAL_NEGATIVO=[];VAL_DUPLICADO=[];VAL_RES_SEM_ARMAZEM=[];

  const prog=txt=>{ const el=document.getElementById('lprog'); if(el) el.textContent=txt; };

  const fetchComTimeout=async(url,segundos=8)=>{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),segundos*1000);
    try{
      const r=await fetch(url,{cache:'no-store',signal:ctrl.signal}); clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP '+r.status+(r.status===403?' — planilha não está pública':''));
      return await r.text();
    }catch(e){ clearTimeout(timer); throw e.name==='AbortError'?new Error('Timeout após '+segundos+'s'):e; }
  };

  // 1. Armazéns — mapa fixo (armazens.csv foi excluído do repositório)
  WH_LIST.length=0;
  WH_LIST.push('Curitiba (Eletra)','Fortaleza (Eletra)','Manaus (Eletra)','Fábrica Livoltek');
  WH_COLOR['Curitiba (Eletra)']='#374151';
  WH_COLOR['Fortaleza (Eletra)']='#374151';
  WH_COLOR['Manaus (Eletra)']='#374151';
  WH_COLOR['Fábrica Livoltek']='#2563eb';
  WH_ICON['Curitiba (Eletra)']='ti-building-warehouse';
  WH_ICON['Fortaleza (Eletra)']='ti-building-warehouse';
  WH_ICON['Manaus (Eletra)']='ti-building-warehouse';
  WH_ICON['Fábrica Livoltek']='ti-building-factory-2';
  SRC_TS.armazens=new Date();

  // 2. cadastro_produtos.csv
  prog('Carregando cadastro_produtos.csv...');
  try{
    const r=await fetch('data/cadastro_produtos.csv',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    CADASTRO=parseCadastro(await r.text());
  }catch(e){
    console.error('Erro ao processar cadastro_produtos.csv:', e);
    showErr('<b>data/cadastro_produtos.csv</b>: '+e.message);
    return;
  }

  // 3. Estoques por armazém (paralelo)
  const stItems=[];
  prog('Carregando arquivos de estoque...');
  await Promise.all(WAREHOUSES.map(async wh=>{
    try{
      const fname = wh==='fabrica_manaus' ? 'data/estoque_fabrica_manaus.csv' : `data/estoque_${wh}.csv`;
      const r=await fetch(fname,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt=await r.text();
      const items = wh==='fabrica_manaus' ? parseFabricaManaus(txt) : parseEstoqueWH(txt,wh);
      stItems.push(...items);
    }catch(e){
      SRC_ALERTS.push({fonte:`estoque_${wh}.csv`,msg:`Arquivo não encontrado ou inválido: ${e.message}`,ts:new Date()});
    }
  }));
  SRC_TS.estoque=new Date();
  if(!stItems.length){ showErr('Nenhum produto carregado. Verifique os arquivos de estoque.'); return; }
  joinCadastro(stItems);
  ST=stItems;

  // 4. Reservas — Google Sheets em tempo real (com fallback local)
  if(RESERVAS_SHEET_URL){
    prog('Carregando Reservas...');
    try{
      RES=parseReservasSheets(await fetchComTimeout(RESERVAS_SHEET_URL));
    }catch(e){
      SRC_ALERTS.push({fonte:'Reservas (Google Sheets)',msg:e.message+'. Usando reserva.csv local como fallback.',ts:new Date()});
      try{
        const rb=await fetch('data/reserva.csv',{cache:'no-store'});
        if(rb.ok){ RES=parseReservasLocal(await rb.text()); SRC_TS.reservas=new Date(); }
      }catch(e2){}
    }
  } else {
    try{
      const r=await fetch('data/reserva.csv',{cache:'no-store'});
      if(r.ok){ RES=parseReservasLocal(await r.text()); SRC_TS.reservas=new Date(); }
    }catch(e){}
  }

  applyReservas();
  validateAll();
  renderSrcAlerts();

  populateSelects();
  document.getElementById('ld-area').style.display='none';
  document.getElementById('mc').style.display='block';

  // 5. Pedidos Faturados — busca do repositório Pedidos-Livoltek
  prog('Carregando pedidos faturados...');
  FAT = {};
  try{
    const fatText = await fetchComTimeout(PEDIDOS_CSV_URL, 10);
    FAT = parsePedidosFaturados(fatText);
    const nFat = Object.keys(FAT).length;
    if(nFat) console.log(`📋 Pedidos faturados: ${nFat} combinações produto+armazém desde ${DATA_CORTE_FATURADOS.toLocaleDateString('pt-BR')}`);
  }catch(e){
    SRC_ALERTS.push({fonte:'pedidos.csv (faturados)',msg:'Não foi possível carregar: '+e.message,ts:new Date()});
  }
  // Descontar faturados do disponível (Disponível = Saldo - Reserva - Faturado)
  applyFaturados();

  // 6. Data de atualização: data do CSV mais recente via GitHub API
  prog('Verificando data dos dados...');
  let dataCSV = null;
  try{
    const OWNER='smlivoltek', REPO='livoltek';
    // Data do commit mais recente entre os 4 CSVs de estoque
    const estoqueFiles=['data/estoque_curitiba.csv','data/estoque_fortaleza.csv','data/estoque_manaus.csv','data/estoque_fabrica_manaus.csv'];
    const datas = await Promise.all(estoqueFiles.map(async f=>{
      try{
        const resp=await fetchComTimeout(`https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${f}&per_page=1`,5);
        const commits=JSON.parse(resp);
        const iso=commits[0]?.commit?.committer?.date||commits[0]?.commit?.author?.date;
        return iso ? new Date(iso) : null;
      }catch(e){ return null; }
    }));
    const maisRecente = datas.filter(Boolean).sort((a,b)=>b-a)[0];
    if(maisRecente){
      dataCSV = maisRecente.toLocaleDateString('pt-BR')+' '+maisRecente.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){ /* silencioso — fallback abaixo */ }

  document.getElementById('ld-area').style.display='none';
  document.getElementById('mc').style.display='block';

  // Timestamp: data real do último commit > data local de quando os dados mudaram
  const _sig = ST.length+'|'+ST.reduce((a,r)=>a+r.saldo,0).toFixed(0)+'|'+RES.length;
  const _prevSig = localStorage.getItem('livoltek_estoque_sig')||'';
  let _ts;
  if(dataCSV){
    _ts = dataCSV; // prefere data real do GitHub
    try{localStorage.setItem('livoltek_estoque_sig',_sig);localStorage.setItem('livoltek_estoque_ts',_ts);}catch(e){}
  } else if(_sig!==_prevSig){
    const now=new Date();
    _ts=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    try{localStorage.setItem('livoltek_estoque_sig',_sig);localStorage.setItem('livoltek_estoque_ts',_ts);}catch(e){}
  } else {
    _ts=localStorage.getItem('livoltek_estoque_ts')||'—';
  }
  document.getElementById('sync-t').textContent=_ts;
  setStatus((SRC_ALERTS.length||VAL_RES_SEM_ARMAZEM.length)?'warn':'ok');

  rDash(); rAll();
  ['inv','ev','bess','kit','strbox','div','mot','mp'].forEach(tb=>renderCat(tb));
  rExp(); rRes(); updateSidebar(); rAudit();
}

document.addEventListener('DOMContentLoaded', ()=>{
  applyTranslations();
  boot();
});

// Auto-refresh a cada 3 horas
setInterval(()=>{ boot(); }, 3*60*60*1000);

</script>
