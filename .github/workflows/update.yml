name: Atualizar Dados de Estoque

on:
  schedule:
    # Roda toda segunda e quinta às 07:00 horário de Brasília (10:00 UTC)
    - cron: "0 10 * * 1,4"
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar dados das planilhas
        run: python update_data.py

      - name: Commit e push dos dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "dados: atualização automática $(date -u +%Y-%m-%d)"
          git push
